<script>
(() => {
  "use strict";
  // The world is 320x192 "units" with extra scenery all around it; the visible window
  // (LW x LH units) is chosen to match the screen, so portrait phones get a taller view.
  const W = 320, H = 192, SHORE = 96, PADX = 120, PADY = 160;
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const T0 = Number(new URLSearchParams(location.search).get("t")) || 0;

  /* ================= helpers ================= */
  const rnd = i => { const s = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return s - Math.floor(s); };
  const mkc = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };
  function L(c, x0, y0, x1, y1, col) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let e = dx + dy;
    for (;;) {
      R(c, x0, y0, 1, 1, col);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * e;
      if (e2 >= dy) { e += dy; x0 += sx; }
      if (e2 <= dx) { e += dx; y0 += sy; }

  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const lerp = (a, b, t) => { const A = hex(a), B = hex(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")"; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const shoreY = x => SHORE + Math.round(3 * Math.sin(x / 24) + 1.5 * Math.sin(x / 9));
  const grassTop = x => shoreY(x) + 15 + Math.round(2 * Math.sin(x / 13 + 1));
  const SKIN = "#f4c79a", DARK = "#2a1c10", GOLD = "#f2b632", EDGE = "#3a2412";

  // 1px dark outline around opaque pixels (Stardew-style); translucent shadows are left alone
  function edge(g, w, h, col) {
    const im = g.getImageData(0, 0, w, h), d = im.data, rgb = hex(col), hit = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {

      if (d[i + 3] >= 140) continue;
      if ((x > 0 && d[i - 4 + 3] >= 140) || (x < w - 1 && d[i + 4 + 3] >= 140) || (y > 0 && d[i - w * 4 + 3] >= 140) || (y < h - 1 && d[i + w * 4 + 3] >= 140)) hit.push(i);

    const m = ol ? 1 : 0, c = mkc(w + 2 * m, h + 2 * m), g = c.getContext("2d");

  /* ================= people ================= */
  // ~20 units tall, big head. (x, y) = ground point under the feet.
  // dir: d u l r. step 0..3 = walk cycle. hl / hr = hand offsets from each shoulder.
  // Returns the absolute hand positions so tools can be attached exactly.
  function person(c, x, y, o) {
    const d = o.dir || "d", st = o.step || 0, u = st & 1 ? 1 : 0, hair = o.hair || "#5a2f14";
    const side = d === "l" || d === "r", f = d === "r" ? 1 : -1;
    if (side) {
      const a = st === 1 ? 1 : st === 3 ? -1 : 0;

      R(c, x - 2 + a * f, y - 2, 3, 2, DARK); R(c, x - a * f, y - 2, 3, 2, DARK);
    } else {
      R(c, x - 2, y - 5, 2, 3, o.pants); R(c, x, y - 5, 2, 3, o.pants);
      R(c, x - 3, y - 2 - (st === 1 ? 1 : 0), 3, 2, DARK); R(c, x, y - 2 - (st === 3 ? 1 : 0), 3, 2, DARK);
    }
    const ty = y - 11 + u;
    R(c, x - 3, ty, 6, 6, o.shirt);
    if (o.stripes) for (let r = 0; r < 6; r += 2) R(c, x - 3, ty + r, 6, 1, o.stripes);
    if (o.apron && d !== "u") R(c, x - 2, ty + 1, 4, 5, "#fff");
    if (o.vest) { R(c, x - 3, ty, 2, 6, o.vest); R(c, x + 1, ty, 2, 6, o.vest); }

    R(c, x - 3, ty + 5, 6, 1, DARK); R(c, x - 1, ty + 5, 2, 1, GOLD);
    const hl = o.hl || [0, 4], hr = o.hr || [0, 4];

      R(c, x - 6, hy - 2, 12, 2, o.hatc); R(c, x - 4, hy - 5, 8, 3, o.hatc);
      R(c, x - 6, hy - 2, 12, 1, GOLD); R(c, x - 6, hy - 3, 1, 1, GOLD); R(c, x + 5, hy - 3, 1, 1, GOLD);
      if (o.skull) R(c, x - 1, hy - 5, 2, 2, "#fff");
      if (o.feather) { R(c, x + 3, hy - 7, 1, 3, "#f4f4ee"); R(c, x + 4, hy - 8, 1, 2, "#e0605a"); }
    } else if (o.hat === "band") {
      R(c, x - 4, hy + 1, 8, 2, o.band);
      if (d === "l") R(c, x + 4, hy + 1, 2, 3, o.band); else R(c, x - 6, hy + 1, 2, 3, o.band);
    } else if (o.hat === "chef") {
      R(c, x - 4, hy - 1, 8, 2, "#fff"); R(c, x - 5, hy - 5, 10, 4, "#fff"); R(c, x - 3, hy - 7, 6, 2, "#fff");
      R(c, x - 5, hy - 3, 1, 1, "#dcdcdc"); R(c, x + 4, hy - 4, 1, 1, "#dcdcdc");
    } else if (o.hat === "cap") {
      R(c, x - 4, hy - 2, 8, 4, o.hatc); R(c, x - 3, hy - 3, 6, 1, o.hatc);
      if (d === "d") R(c, x - 4, hy + 2, 8, 1, "#1a1008"); else if (d === "r") R(c, x + 3, hy + 1, 3, 1, "#1a1008"); else if (d === "l") R(c, x - 6, hy + 1, 3, 1, "#1a1008");
    } else {
      R(c, x - 5, hy + 1, 1, 3, hair); R(c, x + 4, hy + 1, 1, 3, hair); R(c, x - 4, hy - 1, 8, 1, hair);

  }

  const LOOK = {
    captain: { hat: "tri",  hatc: "#1a1a2e", feather: 1, skull: 1, shirt: "#c8372d", pants: "#2a1c10", beard: "#2a1c10", coat: 1, hair: "#2a1c10" },
    mate:    { hat: "tri",  hatc: "#1d3a5c", shirt: "#2f6fb0", pants: "#2a1c10", beard: "#8a4a1a", hair: "#8a4a1a" },
    nav:     { hat: "band", band: "#1f9d8a", hair: "#2a1c10", shirt: "#e8e2cc", pants: "#163a44", vest: "#1f9d8a" },
    qm:      { hat: "none", hair: "#c9c9d0", shirt: "#7a4bb0", pants: "#3a2a4a", glasses: 1 },
    lookout: { hat: "band", band: "#f0dfb0", hair: "#c9742a", shirt: "#4aa84a", pants: "#2a4a2a" },
    gunner:  { hat: "band", band: "#15151c", hair: "#15151c", shirt: "#4a4a52", pants: "#22222a", beard: "#2a1c10" },
    cook:    { hat: "chef", shirt: "#f4f4ee", pants: "#3a3a40", apron: 1, hair: "#5a2f14" },
    carp:    { hat: "cap",  hatc: "#c9a45a", hair: "#5a2f14", shirt: "#8a5a2b", pants: "#3d1f0c", beard: "#6b3b1a" },
    kid:     { hat: "cap",  hatc: "#2f6fb0", hair: "#5a2f14", shirt: "#e8eef0", stripes: "#2f6fb0", pants: "#1d3a5c" }
  };

  /* ================= routes ================= */
  // Walks are axis-aligned like tile movement: every leg is purely horizontal or vertical.
  function mkRoute(nodes, speed) {
    speed = speed || 20;   // 20 px/s = exactly 1 px every 3 ticks at 60 Hz
    const segs = []; let t = 0;
    nodes.forEach((a, i) => {
      const b = nodes[(i + 1) % nodes.length];
      segs.push({ t0: t, t1: t + a.dur, stay: true, a });
      t += a.dur;
      const wt = (Math.abs(b.x - a.x) + Math.abs(b.y - a.y)) / speed;
      if (wt > 0) { segs.push({ t0: t, t1: t + wt, a, b }); t += wt; }
    });
    return { segs, total: Math.max(t, 0.001), speed };
  }
  function at(rt, T) {
    const tt = T % rt.total;
    let s = rt.segs[rt.segs.length - 1];
    for (const g of rt.segs) if (tt >= g.t0 && tt < g.t1) { s = g; break; }
    if (s.stay) return { x: s.a.x, y: s.a.y, dir: s.a.face || "d", moving: false, act: s.a.act, au: tt - s.t0, carry: !!s.a.carry, step: 0 };
    // whole pixels only, so every step lands exactly on the pixel grid
    const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y;

    return {
      x: s.a.x + Math.sign(dx) * Math.min(Math.abs(dx), dist), y: s.a.y + Math.sign(dy) * Math.min(Math.abs(dy), dist),
      moving: true, carry: !!s.a.carry, au: 0,
      dir: dx !== 0 ? (dx > 0 ? "r" : "l") : (dy > 0 ? "d" : "u"),
      step: Math.floor(dist / 3) % 4
    };
  }
  const N = (x, y, act, dur, face, carry) => ({ x, y, act, dur: dur || 0, face, carry });
  const ROUTES = {
    captain: mkRoute([
      N(224, 58, "steer", 7, "u"), N(236, 58, "look", 1.5, "d"), N(236, 104), N(236, 128), N(176, 128, "point", 4, "d"),
      N(236, 128), N(236, 104), N(236, 58)
    ]),
    mate: mkRoute([N(185, 126, "pick", 1.2, "u", true), N(214, 126, null, 0, "r", true), N(214, 160, "put", 1.2, "l", false), N(214, 126, null, 0, "u", false)]),
    nav: mkRoute([N(241, 140, "map", 6, "r"), N(241, 114, "scope", 5, "u")]),
    qm: mkRoute([N(276, 170, "write", 6, "r"), N(276, 154, "write", 4, "u")]),
    cook: mkRoute([N(118, 166, "stir", 7, "r"), N(118, 182), N(152, 182), N(152, 156, "taste", 3, "r"), N(152, 182), N(118, 182)]),
    carp: mkRoute([N(46, 178, "hammer", 7, "u"), N(46, 188), N(100, 188), N(100, 170, "saw", 5, "r"), N(100, 188), N(46, 188)]),
    gunner: mkRoute([N(16, 114, "fire", 9, "r"), N(14, 114), N(14, 154), N(92, 154), N(92, 141, "sword", 5, "r"), N(92, 154), N(14, 154), N(14, 114), N(16, 114)]),
    kid: mkRoute([N(98, 106, "fish", 100, "u")])

  /* ================= static sprites (outlined) ================= */
  // Round leaf clump, lit from the upper left; overlapping clumps give the scalloped Stardew canopy.
  function clump(g, cx, cy, r, pal) {
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
      const d = Math.sqrt(x * x + y * y);
      if (d > r + 0.3) continue;
      const l = (-x * 0.6 - y * 0.8) / r;   // +1 upper left .. -1 lower right
      let col = pal.mid;
      if (d > r - 1.1) col = l < -0.15 ? pal.rim : pal.hi;
      else if (l > 0.38 + (((x + y) & 1) ? 0.12 : -0.12)) col = pal.hi;

  const OAK = (pal, fruit) => spr(44, 46, g => {
    R(g, 8, 38, 28, 6, "rgba(0,40,0,.25)");

  }, "#1c4a22");
  const PAL_A = { hi: "#9be05a", mid: "#5db440", lo: "#3f8f33", rim: "#2a6a2a" };
  const PAL_B = { hi: "#a8d850", mid: "#6fb23f", lo: "#4a9238", rim: "#2f6e2e" };
  const PINE = spr(30, 46, g => {
    R(g, 5, 38, 20, 6, "rgba(0,40,0,.25)");
    R(g, 13, 34, 4, 9, "#6b3b1a"); R(g, 13, 34, 1, 9, "#8a5a2b"); R(g, 16, 34, 1, 9, "#4e2a12");

        }

    R(s, 1, 11, 18, 3, "rgba(0,40,0,.22)");
    for (let y = 0; y < 12; y++) for (let x = 0; x < 20; x++) {

  }, "#1c4a22");
  const CABIN = spr(66, 58, s => {
    R(s, 5, 24, 56, 28, "#b88348");
    for (let y = 27; y < 50; y += 4) R(s, 5, y, 56, 1, "#94642f");
    R(s, 5, 48, 56, 4, "#8c8c96"); for (let x = 5; x < 61; x += 7) R(s, x, 48, 1, 4, "#6e6e78");
    R(s, 5, 24, 2, 28, "#d4a064"); R(s, 59, 24, 2, 28, "#8a5a2b");

      const col = Math.floor(r / 3) % 2 ? "#c8372d" : "#b22d25";
      R(s, 0, 8 + r, 66, 1, r % 3 === 2 ? "#8a1f19" : col);
      if (r % 3 !== 2) for (let x = (Math.floor(r / 3) % 2) * 4; x < 66; x += 8) R(s, x, 8 + r, 1, 1, "#8a1f19");
    }
    R(s, 0, 6, 66, 2, "#e0605a"); R(s, 0, 26, 66, 2, "#5a1410");
    R(s, 46, 0, 8, 12, "#8c8c96"); R(s, 46, 0, 8, 2, "#b4b4c0"); R(s, 46, 4, 8, 1, "#6e6e78"); R(s, 46, 8, 8, 1, "#6e6e78");
    R(s, 27, 34, 11, 18, "#4a2a12"); R(s, 28, 35, 9, 17, "#5e3a1a"); R(s, 35, 43, 1, 2, GOLD);
    R(s, 24, 33, 17, 2, "#8a5a2b");
    [[10, 35], [45, 35]].forEach(([x, y]) => { R(s, x - 1, y - 1, 12, 11, "#6e3b1a"); R(s, x, y, 10, 9, "#ffe27a"); R(s, x + 4, y, 2, 9, "#8a5a2b"); R(s, x, y + 4, 10, 2, "#8a5a2b"); R(s, x, y + 9, 10, 1, "#fff2b0"); });
    R(s, 61, 28, 1, 14, "#4a2a12"); R(s, 61, 28, 5, 1, "#4a2a12");

  }, EDGE);
  const TENT = spr(38, 28, s => {
    R(s, 2, 24, 34, 3, "rgba(0,40,0,.22)");
    for (let r = 0; r < 22; r++) {
      const half = Math.round(2 + r * 0.82), cx = 19;
      for (let x = cx - half; x <= cx + half; x++) R(s, x, 2 + r, 1, 1, Math.floor((x + 40) / 4) % 2 ? "#f4f1e4" : "#c8372d");

      L(SG, h.r[0], h.r[1], h.r[0] + s * 6, h.r[1] - 3, "#c9a45a"); R(SG, h.r[0] + s * 6, h.r[1] - 4, 1, 3, GOLD);
      R(SG, 32 - 9, 48 - 5, 19, 2, "#c99a58"); R(SG, 32 - 8, 48 - 3, 17, 6, "#8a5a2b"); R(SG, 32 - 8, 48, 17, 1, "#5a2f14"); R(SG, 32 - 8, 48 + 2, 17, 1, "#3d1f0c");
      edge(SG, 64, 64, EDGE);
      c.drawImage(SC, 236 - 32, 28 - 48);
    });
    // parrot + gull shadows, then flyers on top
    add(1000, () => {
      for (let i = 0; i < 3; i++) {
        const gx = ((i * 130 + (REDUCED ? 70 : TA * 9)) % (W + 40)) - 20, gy = 14 + i * 20 + (REDUCED ? 0 : Math.round(Math.sin(TA * 1.7 + i) * 3)), f = REDUCED ? 0 : Math.floor(TA * 3 + i) % 2;
        R(c, gx - 3, gy + f, 3, 1, "#fff"); R(c, gx + 1, gy + f, 3, 1, "#fff"); R(c, gx - 1, gy + 1, 2, 1, "#fff");
      }
      const t = REDUCED ? 1.2 : TA, px = Math.round(160 + 100 * Math.sin(t * 0.35)), py = Math.round(70 + 24 * Math.sin(t * 0.7)), d = Math.cos(t * 0.35) >= 0 ? 1 : -1, f = REDUCED ? 0 : Math.floor(TA * 8) % 2;
      R(c, px, py + 22, 6, 2, "rgba(0,20,0,.2)");
      R(c, px - d * 4 + (d > 0 ? 0 : 3), py + 1, 4, 1, "#2f6fb0");
      R(c, px, py, 5, 3, "#d8312a"); R(c, px + (d > 0 ? 5 : -2), py - 1, 3, 3, "#d8312a");
      R(c, px + (d > 0 ? 8 : -3), py, 1, 1, GOLD); R(c, px + (d > 0 ? 6 : -1), py - 1, 1, 1, "#fff");
      R(c, px + 1, py + (f ? -2 : 3), 3, 2, "#2f6fb0");
    });
    E.sort((a, b) => a.y - b.y).forEach(e => e.fn());

    // drifting cloud shadows
    for (let i = 0; i < 4; i++) {
      const bx = ((i * 190 + (REDUCED ? 40 : Math.floor(Tm * 5))) % (WW + 100)) - PADX - 50, by = -60 + i * 90;
      for (let dy = -12; dy <= 12; dy += 2) {
        const hw = Math.round(Math.sqrt(1 - (dy / 13) * (dy / 13)) * 36);
        R(c, bx - hw, by + dy, hw * 2, 2, "rgba(10,30,70,.09)");
      }
    }
  }

  /* ================= start ================= */
  fit();
  if (REDUCED) draw(T0);
  else {
    // one draw per 1/60 s tick, so movement advances by a constant number of pixels per frame
    let start = null, lastTick = -1;
    const loop = ts => {
      if (start === null) start = ts;
      const tick = Math.floor((ts - start) * 60 / 1000);
      if (tick !== lastTick) { lastTick = tick; draw(tick / 60 + T0); }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
