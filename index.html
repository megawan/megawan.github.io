<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>megawan</title>
<meta name="description" content="Small browser games and projects by megawan.">
<style>
  :root { --bg: #f6efe0; --ink: #2f2417; --card: #fffaf0; --line: #dccaa0; --accent: #8a3b1c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  .lead { margin: 0 0 32px; opacity: .75; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
  a.card { display: block; padding: 20px; background: var(--card); border: 2px solid var(--line);
    border-radius: 14px; color: inherit; text-decoration: none; }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
  .title { display: block; font-size: 1.25rem; font-weight: 700; }
  .desc { display: block; margin-top: 4px; opacity: .8; }
  footer { margin-top: 32px; font-size: .9rem; opacity: .75; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>megawan</h1>
  <p class="lead">Small browser games and projects.</p>
  <ul>
    <li>
      <a class="card" href="games/pirates/">
        <span class="title">Pirates</span>
        <span class="desc">A small sailing game. Steer to an island to find my cloud work, notes and pirate RPG.</span>
      </a>
    </li>
    <li>
      <a class="card" href="games/hijaiyah/">
        <span class="title">Belajar Huruf Hijaiyah</span>
        <span class="desc">A learning game for children: the 28 hijaiyah letters and their harakat, with sound.</span>
      </a>
    </li>
  </ul>
  <footer><a href="https://github.com/megawan">github.com/megawan</a></footer>
</main>
</body>
</html>
