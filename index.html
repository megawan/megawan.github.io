<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>megawan · Pulau Bajak Laut</title>
<meta name="description" content="Pulau bajak laut bergaya pixel ala Stardew Valley. Kapten dan kru kapal punya tugas masing-masing; klik untuk berkenalan.">
<meta name="theme-color" content="#8accf6">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  /* sky above the horizon line, sea below: fills any letterbox around the canvas */
  body { background: linear-gradient(#8accf6 48.9%, #3d9fe0 48.9%); }
  #scene { position: fixed; left: 50%; top: 48.9%; transform: translate(-50%, -48.9%); display: block;
           image-rendering: pixelated; image-rendering: crisp-edges; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<h1 class="sr">megawan · Pulau Bajak Laut</h1>
<canvas id="scene" width="320" height="180" role="img"
  aria-label="Pulau bajak laut bergaya pixel di siang hari: kapal bajak laut bersandar di dermaga, kapten di kemudi, dan kru yang sibuk bekerja."></canvas>

<script>
(() => {
  "use strict";
  const W = 320, H = 180, HOR = 88;
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ================= crew ================= */
  const LOOK = {
    captain:  { hat: "tri",  hatc: "#1a1a2e", feather: 1, skull: 1, shirt: "#c8372d", pants: "#2a1c10", beard: "#2a1c10", coat: 1, patch: 1 },
    mate:     { hat: "tri",  hatc: "#1d3a5c", shirt: "#2f6fb0", pants: "#2a1c10", beard: "#8a4a1a" },
    nav:      { hat: "band", band: "#1f9d8a", hair: "#2a1c10", shirt: "#e8e2cc", pants: "#163a44", vest: "#1f9d8a" },
    qm:       { hat: "none", hair: "#c9c9d0", shirt: "#7a4bb0", pants: "#3a2a4a", glasses: 1 },
    lookout:  { hat: "band", band: "#f0dfb0", hair: "#c9742a", shirt: "#4aa84a", pants: "#2a4a2a" },
    gunner:   { hat: "band", band: "#15151c", hair: "#15151c", shirt: "#4a4a52", pants: "#22222a", beard: "#2a1c10" },
    cook:     { hat: "chef", shirt: "#f4f4ee", pants: "#3a3a40", apron: 1 },
    carp:     { hat: "cap",  hatc: "#c9a45a", hair: "#5a2f14", shirt: "#8a5a2b", pants: "#3d1f0c", beard: "#6b3b1a" },
    kid:      { hat: "cap",  hatc: "#2f6fb0", hair: "#5a2f14", shirt: "#e8eef0", stripes: "#2f6fb0", pants: "#1d3a5c" }
  };

  /* ================= drawing helpers ================= */
  const SKIN = "#f2c28b", DARK = "#2a1c10", GOLD = "#f2b632";
  const rnd = i => { const s = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return s - Math.floor(s); };
  const mk = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; };
  const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };
  function L(c, x0, y0, x1, y1, col) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let e = dx + dy;
    for (;;) {
      R(c, x0, y0, 1, 1, col);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * e;
      if (e2 >= dy) { e += dy; x0 += sx; }
      if (e2 <= dx) { e += dx; y0 += sy; }
    }
  }
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const lerp = (a, b, t) => { const A = hex(a), B = hex(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")"; };

  // A person is ~20 units tall and 9 wide. (x, y) = ground point between the feet.
  // o.hl / o.hr are hand offsets from the left / right shoulder; o.step 0|1|2 lifts a foot.
  function person(c, x, y, o) {
    x = Math.round(x); y = Math.round(y);
    const d = o.dir || 1, st = o.step || 0;
    R(c, x - 4, y, 9, 1, "rgba(0,0,0,.22)");
    // legs
    R(c, x - 3, y - 5, 2, 3, o.pants); R(c, x + 2, y - 5, 2, 3, o.pants);
    R(c, x - 3, y - 2 - (st === 1 ? 1 : 0), 2, 2, DARK); R(c, x + 2, y - 2 - (st === 2 ? 1 : 0), 2, 2, DARK);
    // body
    R(c, x - 3, y - 11, 7, 6, o.shirt);
    if (o.stripes) for (let r = 0; r < 6; r += 2) R(c, x - 3, y - 11 + r, 7, 1, o.stripes);
    if (o.apron) R(c, x - 2, y - 10, 5, 5, "#fff");
    if (o.vest) { R(c, x - 3, y - 11, 2, 6, o.vest); R(c, x + 2, y - 11, 2, 6, o.vest); }
    if (o.coat) { R(c, x, y - 11, 1, 5, "#fff3d0"); R(c, x - 1, y - 10, 1, 1, GOLD); R(c, x + 1, y - 8, 1, 1, GOLD); R(c, x - 3, y - 11, 7, 1, "#8a1f19"); }
    R(c, x - 3, y - 6, 7, 1, DARK); R(c, x, y - 6, 1, 1, GOLD);
    // head
    R(c, x - 2, y - 16, 5, 5, SKIN);
    const e1 = x + (d > 0 ? 0 : -2), e2 = x + (d > 0 ? 2 : 0);
    R(c, e1, y - 14, 1, 1, DARK); R(c, e2, y - 14, 1, 1, DARK);
    if (o.glasses) { R(c, e1 - 1, y - 15, 3, 1, "#c9c9d0"); R(c, e2 - 1, y - 15, 3, 1, "#c9c9d0"); }
    if (o.patch) { R(c, d > 0 ? e2 : e1, y - 14, 1, 1, "#000"); R(c, x - 2, y - 15, 5, 1, "#000"); }
    if (o.beard) { R(c, x - 2, y - 13, 5, 2, o.beard); R(c, x - 1, y - 11, 3, 1, o.beard); R(c, e1, y - 14, 1, 1, DARK); R(c, e2, y - 14, 1, 1, DARK); }
    // headgear
    if (o.hat === "tri") {
      R(c, x - 4, y - 17, 9, 1, o.hatc); R(c, x - 2, y - 19, 5, 2, o.hatc); R(c, x - 1, y - 20, 3, 1, o.hatc);
      R(c, x - 4, y - 17, 1, 1, GOLD); R(c, x + 4, y - 17, 1, 1, GOLD); R(c, x - 2, y - 17, 5, 1, GOLD);
      if (o.skull) { R(c, x, y - 19, 1, 1, "#fff"); R(c, x - 1, y - 18, 3, 1, "#fff"); }
      if (o.feather) { R(c, x + d * 3, y - 21, 1, 3, "#f4f4ee"); R(c, x + d * 4, y - 22, 1, 2, "#e0605a"); }
    } else if (o.hat === "band") {
      R(c, x - 2, y - 17, 5, 1, o.hair || "#5a2f14"); R(c, x - 2, y - 16, 5, 1, o.band);
      R(c, x - d * 3, y - 16, 1, 2, o.band); R(c, x - d * 4, y - 14, 1, 1, o.band);
    } else if (o.hat === "chef") {
      R(c, x - 2, y - 17, 5, 1, "#fff"); R(c, x - 3, y - 20, 7, 3, "#fff"); R(c, x - 2, y - 21, 5, 1, "#fff");
      R(c, x - 3, y - 18, 1, 1, "#dcdcdc"); R(c, x + 3, y - 19, 1, 1, "#dcdcdc");
    } else if (o.hat === "cap") {
      R(c, x - 2, y - 17, 5, 1, o.hair || "#5a2f14"); R(c, x - 3, y - 18, 7, 2, o.hatc); R(c, x - 2, y - 19, 5, 1, o.hatc);
      R(c, x + d * 3 - (d > 0 ? 0 : 1), y - 16, 2, 1, o.hatc);
    } else {
      R(c, x - 2, y - 17, 5, 2, o.hair || "#5a2f14"); R(c, x - 3, y - 15, 1, 2, o.hair || "#5a2f14"); R(c, x + 3, y - 15, 1, 2, o.hair || "#5a2f14");
    }
    // arms
    const hl = o.hl || [0, 4], hr = o.hr || [0, 4];
    L(c, x - 4, y - 10, x - 4 + hl[0], y - 10 + hl[1], o.shirt); R(c, x - 4 + hl[0], y - 10 + hl[1], 1, 1, SKIN);
    L(c, x + 4, y - 10, x + 4 + hr[0], y - 10 + hr[1], o.shirt); R(c, x + 4 + hr[0], y - 10 + hr[1], 1, 1, SKIN);
  }

  function parrot(c, x, y, d, f, big) {
    x = Math.round(x); y = Math.round(y);
    const s = big ? 2 : 1;
    R(c, x - d * 4 * s - (d > 0 ? 0 : -s), y + s, 4 * s, s, "#2f6fb0");          // tail
    R(c, x, y, 5 * s, 3 * s, "#d8312a");                                         // body
    R(c, x + (d > 0 ? 5 : -2) * s, y - s, 3 * s, 3 * s, "#d8312a");               // head
    R(c, x + (d > 0 ? 8 : -3) * s, y, s, s, GOLD);                               // beak
    R(c, x + (d > 0 ? 6 : -1) * s, y - s, s, s, "#fff");                         // eye
    R(c, x + 1 * s, y + (f ? -2 * s : 3 * s), 3 * s, 2 * s, "#2f6fb0");          // wing
    R(c, x + 1 * s, y + (f ? -2 * s : 3 * s) + (f ? 0 : s), 3 * s, s, "#f2b632");
  }

  /* ================= static layers ================= */
  const back = mk(), front = mk();
  (function buildBack() {
    const c = back.getContext("2d");
    const sky = ["#4fa9ee", "#6dbbf3", "#8accf6", "#a9dcf9", "#c6e8fb"], band = HOR / 5;
    for (let y = 0; y < HOR; y++) {
      const i = Math.min(4, Math.floor(y / band)), pos = y - i * band;
      R(c, 0, y, W, 1, sky[i]);
      if (i < 4 && pos > band - 3) for (let x = y % 2; x < W; x += 2) R(c, x, y, 1, 1, sky[i + 1]);
    }
    // sun
    for (let dy = -12; dy <= 12; dy++) for (let dx = -12; dx <= 12; dx++) {
      const d = dx * dx + dy * dy;
      if (d <= 49) R(c, 270 + dx, 24 + dy, 1, 1, "#fff7c8");
      else if (d <= 81) R(c, 270 + dx, 24 + dy, 1, 1, "#ffe27a");
      else if (d <= 144 && (dx + dy) % 2 === 0) R(c, 270 + dx, 24 + dy, 1, 1, "#ffeeb0");
    }
    // far islands
    for (let x = 18; x < 120; x++) { const h = Math.round(9 * Math.pow(Math.sin(Math.PI * (x - 18) / 102), 0.8)); R(c, x, HOR - h, 1, h, "#5f9f8f"); }
    R(c, 70, HOR - 15, 1, 7, "#3d6b5a"); R(c, 67, HOR - 16, 7, 1, "#3d6b5a"); R(c, 68, HOR - 17, 5, 1, "#4d8b72");
    for (let x = 160; x < 210; x++) { const h = Math.round(5 * Math.sin(Math.PI * (x - 160) / 50)); R(c, x, HOR - h, 1, h, "#7fb3a8"); }
    // sea
    for (let y = HOR; y < H; y++) R(c, 0, y, W, 1, lerp("#3d9fe0", "#1b62a6", Math.min(1, Math.floor((y - HOR) / 8) / 11)));
    R(c, 0, HOR, W, 1, "#b8e3ff");
  })();

  (function buildFront() {
    const c = front.getContext("2d");
    // hill + grass
    for (let x = 0; x < 114; x++) {
      const top = 119 - Math.round(17 * Math.pow(Math.sin(Math.PI * x / 114), 0.7));
      R(c, x, top, 1, 129 - top, "#5aa833"); R(c, x, top, 1, 1, "#86d14f"); R(c, x, top + 1, 1, 1, "#74c13f");
    }
    R(c, 0, 119, 131, 10, "#6dbb3f");
    for (let i = 0; i < 70; i++) {
      const x = rnd(i) * 128, y = 108 + rnd(i + 99) * 19;
      if (y > 119 || x > 6) { R(c, x, y, 1, 2, "#8fd35a"); R(c, x + 1, y + 1, 1, 1, "#4e9a2e"); }
    }
    for (let i = 0; i < 9; i++) { const x = 4 + rnd(i + 50) * 120, y = 121 + rnd(i + 70) * 6; R(c, x, y, 1, 1, i % 2 ? "#ffd35c" : "#fff"); R(c, x, y + 1, 1, 1, "#3f8a2a"); }
    R(c, 0, 128, 131, 1, "#3f8a2a");
    // sand
    const edge = y => 131 + Math.min(8, Math.floor((y - 128) * 0.8));
    for (let y = 129; y < H; y++) {
      const e = edge(y);
      R(c, 0, y, e, 1, "#f1d78e"); R(c, e - 3, y, 3, 1, "#dcc27a");
    }
    for (let i = 0; i < 150; i++) { const x = rnd(i + 300) * 128, y = 131 + rnd(i + 700) * 48; R(c, x, y, 1, 1, i % 3 ? "#dcbf74" : "#fff0b8"); }
    // rocks
    [[34, 176], [100, 134]].forEach(([x, y]) => { R(c, x, y, 6, 3, "#8c8c96"); R(c, x + 1, y - 1, 4, 1, "#a9a9b4"); R(c, x, y + 2, 6, 1, "#5e5e68"); });
    // crates on the beach (start of the haul)
    R(c, 112, 122, 7, 6, "#c9a45a"); R(c, 112, 122, 7, 1, "#e0c27a"); R(c, 112, 125, 7, 1, "#8a6a2a"); R(c, 115, 122, 1, 6, "#8a6a2a");
    R(c, 106, 124, 6, 4, "#b8923f"); R(c, 108, 124, 1, 4, "#8a6a2a");
    // hut
    R(c, 60, 106, 21, 13, "#b07a40");
    for (let y = 108; y < 119; y += 3) R(c, 60, y, 21, 1, "#8a5a2b");
    for (let r = 0; r < 7; r++) R(c, 70 - (r + 1) * 2 - 1, 99 + r, (r + 1) * 4 + 3, 1, r === 0 ? "#e0605a" : "#c8372d");
    R(c, 56, 105, 29, 1, "#8a1f19");
    R(c, 66, 110, 6, 9, "#3a1d0a"); R(c, 73, 109, 5, 5, "#ffe27a"); R(c, 75, 109, 1, 5, "#8a5a2b"); R(c, 73, 111, 5, 1, "#8a5a2b");
    R(c, 76, 94, 4, 8, "#8c8c96");
    // dock
    R(c, 120, 135, 72, 3, "rgba(8,40,80,.35)");
    for (let k = 0; k < 4; k++) { R(c, 124 + k * 24, 134, 3, 13, "#5a2f14"); R(c, 124 + k * 24, 146, 3, 1, "#3d1f0c"); }
    R(c, 120, 130, 72, 4, "#a9753a"); R(c, 120, 130, 72, 1, "#d2a35e"); R(c, 120, 134, 72, 1, "#5a2f14");
    for (let x = 126; x < 190; x += 6) R(c, x, 131, 1, 3, "#7a4a1e");
    for (let k = 0; k < 4; k++) { R(c, 123 + k * 24, 126, 5, 4, "#5a2f14"); R(c, 123 + k * 24, 126, 5, 1, "#8a5a2b"); }
    // crates on the dock (where the haul ends)
    [[160, 124], [168, 124], [164, 118]].forEach(([x, y]) => { R(c, x, y, 7, 6, "#c9a45a"); R(c, x, y, 7, 1, "#e0c27a"); R(c, x, y + 5, 7, 1, "#8a6a2a"); R(c, x + 3, y, 1, 6, "#8a6a2a"); });
    R(c, 174, 122, 7, 8, "#8a5a2b"); R(c, 174, 124, 7, 1, "#3d1f0c"); R(c, 174, 128, 7, 1, "#3d1f0c"); R(c, 174, 122, 7, 1, "#b27a3e");
    // gangplank
    L(c, 190, 132, 198, 121, "#b27a3e"); L(c, 191, 132, 199, 121, "#8a5a2b"); L(c, 189, 132, 197, 121, "#b27a3e");
    // chest
    R(c, 8, 154, 13, 8, "#8a5a2b"); R(c, 8, 151, 13, 4, "#b27a3e"); R(c, 8, 154, 13, 1, "#2a1c10"); R(c, 8, 161, 13, 1, "#5a2f14");
    R(c, 13, 154, 3, 3, GOLD); R(c, 8, 151, 1, 11, "#5a2f14"); R(c, 20, 151, 1, 11, "#5a2f14");
    R(c, 10, 149, 3, 2, GOLD); R(c, 14, 150, 2, 1, "#ffe27a"); R(c, 17, 149, 2, 2, GOLD);
  })();

  /* ================= dynamic scene ================= */
  const cv = document.getElementById("scene");
  const ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  function cloud(c, x, y, u) {
    R(c, x + 4 * u, y, 5 * u, u, "#fff"); R(c, x + 2 * u, y + u, 10 * u, u, "#fff");
    R(c, x, y + 2 * u, 14 * u, u, "#fff"); R(c, x + u, y + 3 * u, 12 * u, u, "#dcebf7");
  }
  const CLOUDS = [[20, 14, 2, 3], [150, 30, 2, 2], [240, 8, 2, 1.5], [90, 52, 1, 4], [300, 46, 1, 2.5]];

  function palm(c, x, y, T, ph, h, lean) {
    let tx = x, ty = y;
    for (let i = 0; i < h; i++) {
      tx = x + Math.round(Math.sin(i / h * 1.3) * 5 * lean); ty = y - i;
      R(c, tx, ty, 2, 1, i % 3 ? "#8a5a2b" : "#6b3b1a");
    }
    const sw = REDUCED ? 0 : Math.sin(T * 1.1 + ph) * 1.5;
    [[-15, 5], [-10, -2], [-5, -7], [0, -9], [5, -7], [10, -2], [15, 5]].forEach(([dx, dy]) => {
      const ex = tx + dx + (dx > 0 ? sw : -sw) * Math.abs(dx) / 10, ey = ty + dy + 3;
      const mx = tx + dx * 0.55, my = ty + dy * 0.5 - 3;
      L(c, tx + 1, ty, mx, my, "#4fb02e"); L(c, mx, my, ex, ey, "#2f7a20");
      L(c, mx, my - 1, ex, ey - 1, "#7ad04a");
    });
    R(c, tx - 1, ty + 1, 2, 2, "#5a2f14"); R(c, tx + 2, ty + 1, 2, 2, "#5a2f14");
  }

  function ship(c, T, b) {
    const top = 116 + b, sw = (a, s) => REDUCED ? 0 : Math.sin(a) * s;
    // rigging
    L(c, 240, 12, 186, top - 14, "#3a2210"); L(c, 240, 12, 304, top - 6, "#3a2210");
    // stern cabin
    R(c, 183, top - 14, 15, 14, "#8a5a2b"); R(c, 182, top - 16, 17, 3, "#5a2f14");
    for (let y = top - 11; y < top; y += 3) R(c, 183, y, 15, 1, "#6e3b1a");
    R(c, 187, top - 11, 6, 5, "#ffe27a"); R(c, 190, top - 11, 1, 5, "#8a5a2b"); R(c, 187, top - 9, 6, 1, "#8a5a2b");
    // masts
    R(c, 239, 10, 3, top - 10, "#4a2a12"); R(c, 239, 10, 1, top - 10, "#6e3b1a");
    R(c, 287, 46, 3, top - 46, "#4a2a12"); R(c, 287, 46, 1, top - 46, "#6e3b1a");
    // bowsprit
    L(c, 300, top + 1, 319, top - 6, "#4a2a12"); L(c, 300, top + 2, 319, top - 5, "#4a2a12");
    // sails (rows ripple in the wind)
    for (let r = 0; r < 44; r++) {
      const o = Math.round(sw(T * 1.6 + r * 0.15, 1.2));
      const col = r % 14 === 13 ? "#d9d0b0" : "#f6f2e2";
      R(c, 224 + o, 52 + r, 32, 1, col); R(c, 248 + o, 52 + r, 8, 1, r % 14 === 13 ? "#cfc59f" : "#e4dcc0");
    }
    R(c, 220, 50, 40, 2, "#4a2a12");
    // skull emblem
    R(c, 237, 66, 7, 5, "#1a1a2e"); R(c, 238, 71, 5, 2, "#1a1a2e");
    R(c, 238, 68, 2, 2, "#fff"); R(c, 241, 68, 2, 2, "#fff"); R(c, 240, 70, 1, 1, "#fff");
    R(c, 239, 72, 1, 1, "#fff"); R(c, 241, 72, 1, 1, "#fff");
    L(c, 234, 75, 246, 81, "#1a1a2e"); L(c, 246, 75, 234, 81, "#1a1a2e");
    for (let r = 0; r < 34; r++) {
      const o = Math.round(sw(T * 1.6 + r * 0.15 + 1, 1));
      const red = r >= 12 && r <= 17;
      R(c, 274 + o, 58 + r, 26, 1, red ? "#c8372d" : "#f6f2e2");
      R(c, 292 + o, 58 + r, 8, 1, red ? "#a82a22" : "#e4dcc0");
    }
    R(c, 272, 56, 30, 2, "#4a2a12");
    // flag
    R(c, 238, 4, 5, 4, GOLD);
    for (let col = 0; col < 11; col++) {
      const o = Math.round(sw(T * 4 + col * 0.7, 1.3));
      R(c, 242 + col, 5 + o, 1, 7, "#15152a");
      if (col >= 3 && col <= 6) { R(c, 242 + col, 7 + o, 1, 2, "#fff"); }
    }
    // hull
    for (let r = 0; r < 24; r++) {
      const l = 182 + Math.floor(r * 0.45), rr = 306 - r;
      const col = r < 2 ? "#b27a3e" : r < 4 ? "#5a2f14" : r === 9 ? GOLD : r === 13 || r === 14 ? "#a82a22" : r > 20 ? "#3d1f0c" : (r % 4 === 0 ? "#5e3216" : "#6e3b1a");
      R(c, l, top + r, rr - l, 1, col);
    }
    [210, 230, 250, 270].forEach(px => { R(c, px, top + 5, 5, 3, "#140a05"); R(c, px, top + 5, 5, 1, "#3a2210"); });
    // rail
    for (let x = 200; x < 300; x += 10) R(c, x, top - 3, 1, 3, "#8a5a2b");
    R(c, 200, top - 3, 100, 1, "#a9753a");
    // waterline foam
    for (let i = 0; i < 12; i++) {
      const x = 180 + ((i * 11 + (REDUCED ? 0 : T * 9)) % 130);
      R(c, x, top + 23, 5, 1, "#e6f4ff"); R(c, x + 2, top + 24, 4, 1, "#8cc8f2");
    }
  }

  function draw(T) {
    const c = ctx;
    c.drawImage(back, 0, 0);
    // clouds
    CLOUDS.forEach(([x0, y, u, v]) => { const x = ((x0 + (REDUCED ? 0 : T * v)) % (W + 80)) - 50; cloud(c, x, y, u); });
    // gulls
    for (let i = 0; i < 3; i++) {
      const gx = ((i * 120 + (REDUCED ? 60 : T * 7)) % (W + 40)) - 20, gy = 40 + i * 10 + (REDUCED ? 0 : Math.sin(T * 2 + i) * 2);
      const f = REDUCED ? 0 : Math.floor(T * 3 + i) % 2;
      R(c, gx - 2, gy + f, 2, 1, "#fff"); R(c, gx + 1, gy + f, 2, 1, "#fff"); R(c, gx, gy + 1 - f * 0, 1, 1, "#fff");
    }
    // waves
    for (let k = 0; k < 18; k++) {
      const y = HOR + 4 + k * 5, len = 6 + (k % 3) * 2, col = k < 6 ? "#7cc4f2" : "#58a8e2";
      for (let i = 0; i < 7; i++) {
        const x = ((i * 52 + k * 17 + (REDUCED ? 0 : T * (4 + (k % 3) * 3))) % (W + 20)) - 10;
        R(c, x, y, len, 1, col); R(c, x + len + 2, y + 1, 3, 1, col);
      }
    }
    const b = REDUCED ? 0 : Math.round(Math.sin(T * 1.3));
    ship(c, T, b);
    c.drawImage(front, 0, 0);
    palm(c, 24, 123, T, 0, 30, 1);
    palm(c, 104, 120, T, 2, 26, -1);

    const E = [];
    const add = (y, fn) => E.push({ y, fn });

    // captain at the wheel
    add(116, () => {
      const y = 116 + b, wx = 217, wy = y - 8, a = REDUCED ? 0 : T * 0.4;
      R(c, wx, wy + 3, 2, 8, "#5a2f14");
      for (let i = 0; i < 8; i++) {
        const ang = a + i * Math.PI / 4;
        L(c, wx, wy, wx + Math.cos(ang) * 6, wy + Math.sin(ang) * 6, "#c9a45a");
      }
      for (let i = 0; i < 16; i++) { const ang = i * Math.PI / 8; R(c, wx + Math.round(Math.cos(ang) * 5), wy + Math.round(Math.sin(ang) * 5), 1, 1, "#8a5a2b"); }
      const point = !REDUCED && (T % 9) < 2.2;
      person(c, 205, y, { ...LOOK.captain, dir: 1, hl: point ? [6, -7] : [-1, 4], hr: [8, 2] });
    });
    // navigator with map and telescope
    add(116, () => {
      const y = 116 + b, tele = !REDUCED && (T % 8) < 3;
      R(c, 276, y - 6, 12, 2, "#a9753a"); R(c, 277, y - 4, 2, 4, "#5a2f14"); R(c, 285, y - 4, 2, 4, "#5a2f14");
      R(c, 278, y - 8, 8, 2, "#f0dfb0"); R(c, 283, y - 8, 1, 1, "#c8372d"); R(c, 279, y - 7, 3, 1, "#8a5a2b");
      person(c, 268, y, { ...LOOK.nav, dir: 1, hl: tele ? [3, -7] : [3, 1], hr: tele ? [4, -9] : [6, 3] });
      if (tele) { L(c, 272 + 4, y - 19, 272 + 11, y - 21, "#c9a45a"); R(c, 272 + 11, y - 22, 2, 3, GOLD); }
    });
    // lookout in the crow's nest
    add(46, () => {
      const y = 46 + b, d = REDUCED || Math.sin(T * 0.6) >= 0 ? 1 : -1;
      person(c, 240, y, { ...LOOK.lookout, dir: d, hl: [d * 4, -4], hr: [d * 5, -5] });
      L(c, 240 + d * 9, y - 15, 240 + d * 15, y - 16, "#c9a45a"); R(c, 240 + d * 15, y - 17, 1, 3, GOLD);
      R(c, 232, y - 5, 17, 2, "#a9753a"); R(c, 233, y - 3, 15, 5, "#8a5a2b"); R(c, 233, y, 15, 1, "#5a2f14"); R(c, 233, y + 2, 15, 1, "#3d1f0c");
    });
    // first mate hauling crates along the dock
    add(131, () => {
      const p = REDUCED ? 8 : (T * 9) % 64, right = p < 32, u = right ? p / 32 : 2 - p / 32;
      const x = 124 + u * 32, st = REDUCED ? 0 : (Math.floor(T * 6) % 2 ? 1 : 2);
      person(c, x, 131, { ...LOOK.mate, dir: right ? 1 : -1, step: st, hl: right ? [4, -3] : [-1, (st === 1 ? 5 : 3)], hr: right ? [3, -3] : [1, (st === 1 ? 3 : 5)] });
      if (right) { R(c, x + 2, 131 - 14, 7, 6, "#c9a45a"); R(c, x + 2, 131 - 14, 7, 1, "#e0c27a"); R(c, x + 5, 131 - 14, 1, 6, "#8a6a2a"); }
    });
    // quartermaster counting
    add(131, () => {
      const t = REDUCED ? 0 : Math.floor(T * 2.5) % 2;
      person(c, 183, 131, { ...LOOK.qm, dir: -1, hl: [-4, -1], hr: [-3, -3 + t] });
      R(c, 183 - 11, 131 - 13, 6, 7, "#f0dfb0"); R(c, 183 - 11, 131 - 13, 6, 1, "#8a5a2b");
      R(c, 183 - 10, 131 - 11, 4, 1, "#8a7a5a"); R(c, 183 - 10, 131 - 9, 3, 1, "#8a7a5a");
    });
    // kid fishing
    add(143, () => {
      const dip = !REDUCED && (T % 6) > 5.1, bob = REDUCED ? 0 : Math.round(Math.sin(T * 2)) + (dip ? 2 : 0);
      person(c, 126, 143, { ...LOOK.kid, dir: 1, hl: [3, 1], hr: [5, dip ? -5 : -4] });
      const hx = 126 + 4 + 5, hy = 143 - 10 + (dip ? -5 : -4);
      L(c, hx, hy, 143, 122, "#b27a3e");
      L(c, 143, 122, 143, 146 + bob, "#f4f4ee");
      R(c, 142, 145 + bob, 3, 2, "#c8372d"); R(c, 142, 145 + bob, 3, 1, "#fff");
      if (!REDUCED) { const r = Math.floor(T * 2) % 3; R(c, 140 - r, 149, 2 + r * 2 + 2, 1, "rgba(255,255,255,.55)"); }
    });
    // cook stirring over the fire
    add(150, () => {
      const y = 150, f = REDUCED ? 0 : Math.floor(T * 8) % 3, a = REDUCED ? 0 : T * 4;
      const hx = 48 + 6 + Math.round(Math.cos(a) * 1.5), hy = y - 10 + 5 + Math.round(Math.sin(a) * 1.5);
      L(c, 60, y - 22, 55, y - 2, "#5a2f14"); L(c, 64, y - 22, 69, y - 2, "#5a2f14");
      R(c, 57, y - 2, 11, 2, "#5a2f14"); R(c, 58, y - 3, 9, 1, "#3d1f0c");
      R(c, 59, y - 8, 7, 6, "#e8561a"); R(c, 60, y - 11 + (f % 2), 5, 7, "#f2b632"); R(c, 61, y - 6, 3, 3, "#fff2b0");
      if (f === 1) R(c, 62, y - 13, 1, 2, "#e8561a");
      R(c, 57, y - 18, 11, 7, "#2a2a32"); R(c, 56, y - 19, 13, 2, "#4a4a56"); R(c, 58, y - 17, 3, 1, "#6a6a78");
      R(c, 59, y - 20, 7, 1, "#c8863a");
      person(c, 48, y, { ...LOOK.cook, dir: 1, hl: [1, 4], hr: [hx - 52, hy - (y - 10)] });
      L(c, hx, hy, hx + 5, hy - 2, "#c9c9d0");
      if (!REDUCED) for (let k = 0; k < 5; k++) {
        const ph = (T * 0.8 + k * 0.2) % 1, px = 62 + Math.sin(T + k) * 3 + ph * 7, py = y - 24 - ph * 28, s = 2 + Math.floor(ph * 3);
        R(c, px, py, s, s, "rgba(245,245,250," + (0.75 * (1 - ph)).toFixed(2) + ")");
      }
    });
    // carpenter hammering
    add(166, () => {
      const y = 166, ph = REDUCED ? 0 : (T * 1.6) % 1, up = ph < 0.7;
      R(c, 91, y - 5, 14, 2, "#d8b06a"); R(c, 91, y - 5, 14, 1, "#ecd08e");
      R(c, 93, y - 3, 2, 3, "#5a2f14"); R(c, 101, y - 3, 2, 3, "#5a2f14");
      R(c, 108, y - 1, 2, 1, "#e8c88a"); R(c, 86, y, 1, 1, "#e8c88a"); R(c, 106, y + 1, 1, 1, "#e8c88a");
      person(c, 84, y, { ...LOOK.carp, dir: 1, hl: [4, -2], hr: up ? [4, -7] : [8, -1] });
      const hx = 84 + 4 + (up ? 4 : 8), hy = y - 10 + (up ? -7 : -1);
      R(c, hx, hy - 4, 1, 5, "#8a5a2b"); R(c, hx - 1, hy - 6, 4, 2, "#8a8a96");
      if (!up && ph < 0.78) { R(c, 96, y - 7, 1, 1, GOLD); R(c, 98, y - 8, 1, 1, "#fff2b0"); R(c, 94, y - 7, 1, 1, "#fff2b0"); }
    });
    // gunner and cannon
    add(172, () => {
      const y = 172, ph = REDUCED ? 0 : T % 8, load = ph > 5.2 && ph < 6;
      R(c, 114, y - 5, 12, 2, "#5a2f14");
      R(c, 116, y - 8, 7, 5, "#2a2a32"); R(c, 122, y - 9, 6, 5, "#2a2a32"); R(c, 127, y - 10, 5, 5, "#2a2a32");
      R(c, 116, y - 8, 7, 1, "#4a4a56"); R(c, 122, y - 9, 6, 1, "#4a4a56"); R(c, 127, y - 10, 5, 1, "#4a4a56");
      for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; R(c, 119 + Math.round(Math.cos(a) * 4), y - 4 + Math.round(Math.sin(a) * 4), 1, 1, "#8a5a2b"); }
      R(c, 119, y - 4, 1, 1, "#8a5a2b");
      person(c, 108, y, { ...LOOK.gunner, dir: 1, hl: [2, 4], hr: load ? [6, -3] : [1, 4] });
      if (ph >= 6 && ph < 6.25) R(c, 132, y - 14, 5, 6, "#fff2b0");
      if (ph >= 6 && ph < 7.8) for (let i = 0; i < 4; i++) {
        const q = ph - 6;
        R(c, 133 + q * 14 + i * 3, y - 10 - q * 5 - i, 2 + Math.floor(q * 3), 2 + Math.floor(q * 3), "rgba(232,232,236," + Math.max(0, 0.9 - q * 0.5).toFixed(2) + ")");
      }
      if (ph >= 6 && ph < 7.4) {
        const u = (ph - 6) / 1.4;
        R(c, 134 + u * 70, 162 + 8 * u - 100 * u * (1 - u), 3, 3, "#15151c");
      } else if (ph >= 7.4) {
        const q = ph - 7.4;
        for (let i = 0; i < 4; i++) R(c, 204 + (i - 1.5) * 3 * (1 + q * 2), 170 - Math.sin(Math.min(1, q * 1.6) * Math.PI) * 8, 2, 2, "#e6f4ff");
      }
    });
    // treasure sparkle
    add(163, () => {
      const t = REDUCED ? 0 : T % 3;
      if (t < 0.5) { R(c, 12, 144, 1, 5, "#fff"); R(c, 10, 146, 5, 1, "#fff"); R(c, 11, 145, 3, 3, "rgba(255,240,170,.6)"); }
    });
    // parrot
    add(260, () => {
      const t = REDUCED ? 1.2 : T, px = 170 + 66 * Math.sin(t * 0.45), py = 64 + 10 * Math.sin(t * 0.9);
      const d = Math.cos(t * 0.45) >= 0 ? 1 : -1;
      parrot(c, px, py, d, REDUCED ? 0 : Math.floor(T * 8) % 2);
    });

    E.sort((a, b2) => a.y - b2.y).forEach(e => e.fn());
  }

  /* ================= full-frame scaling ================= */
  // Cover the viewport with a whole-number scale (crisp pixels). If that would crop too much of
  // the scene, step down and let the sky/sea body background fill the letterbox.
  function fit() {
    const vw = innerWidth, vh = innerHeight;
    let s = Math.max(vw / W, vh / H);
    if (s >= 2) {
      s = Math.ceil(s);
      if (vw / s < W * 0.8) s = Math.floor(Math.max(vw / W, vh / H));
    } else if (vw / s < W * 0.8) s = vw / (W * 0.8);
    if (s * W > vw * 1.25) s = vw * 1.25 / W; // never crop more than ~20% of the width
    cv.style.width = Math.round(W * s) + "px";
    cv.style.height = Math.round(H * s) + "px";
  }
  addEventListener("resize", fit); fit();

  /* ================= start ================= */
  draw(0);
  if (!REDUCED) {
    let last = 0;
    const loop = ts => {
      if (ts - last >= 33) { last = ts; draw(ts / 1000); }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
