<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>megawan · Gua Bajak Laut</title>
<meta name="description" content="Sepuluh awak bajak laut di sebuah gua. Setiap awak adalah satu repo; yang paling banyak commit memegang pangkat tertinggi.">
<meta name="theme-color" content="#0d0c1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0d0c1e;
    --rock: #1d1a3e;
    --wood: #3d1f0c;
    --wood-lt: #5a2f14;
    --parchment: #f0dfb0;
    --parchment-dk: #d6c08a;
    --ink: #2a1c10;
    --red: #c8372d;
    --gold: #f2b632;
    --foam: #e6f1f0;
    --px: "Press Start 2P", "Courier New", monospace;
    --body: "VT323", "Courier New", monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--night); color: var(--foam);
    font-family: var(--body); font-size: 22px; line-height: 1.25;
  }
  a { color: var(--gold); }
  :focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

  header { text-align: center; padding: 32px 16px 28px; }
    h1 { font-family: var(--px); font-size: clamp(16px, 4.2vw, 36px); line-height: 1.4; margin: 0; color: var(--parchment); text-shadow: 4px 4px 0 #000; }
  h1 span { color: var(--red); }
  
  /* ---------- the cave ---------- */
  .stage { max-width: 1180px; margin: 0 auto; padding: 0 12px; }
  .cave {
    position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 0 0 4px var(--wood-lt), 0 0 0 8px var(--wood), 8px 8px 0 8px #000;
  }
  #cave { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tag {
    position: absolute; transform: translate(-50%, -50%); z-index: 2;
    width: 7%; height: 16%; padding: 0; border: 0; background: transparent; cursor: pointer;
  }
  .tag:focus-visible { outline: 3px solid var(--gold); outline-offset: 0; }

  .card {
    position: absolute; z-index: 3; width: min(280px, 70%); padding: 14px;
    background: var(--parchment); color: var(--ink);
    box-shadow: 0 0 0 4px var(--wood), 6px 6px 0 4px #000;
    font-size: 21px;
  }
  .card[hidden] { display: none; }
  .card .r { font-family: var(--px); font-size: 8px; color: var(--red); margin: 0 0 8px; }
  .card h2 { font-family: var(--px); font-size: 11px; line-height: 1.6; margin: 0 0 6px; word-break: break-word; }
  .card p { margin: 0 0 6px; }
  .card .c { font-family: var(--px); font-size: 9px; }
  .card a { color: var(--red); }

  
  /* ---------- roster ---------- */
  section { max-width: 1180px; margin: 0 auto; padding: 48px 16px 24px; }
  h2.sec { font-family: var(--px); font-size: clamp(13px, 2.6vw, 18px); color: var(--parchment); margin: 0 0 8px; }
  .sec + * { margin-top: 28px; }
  .roster { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .row {
    position: relative; display: grid; grid-template-columns: 72px 1fr; gap: 4px 14px; align-items: start;
    background: var(--parchment); color: var(--ink); padding: 20px 14px 14px;
    box-shadow: 0 0 0 4px var(--wood), 4px 4px 0 4px #000;
  }
  .row .rk {
    position: absolute; top: -13px; left: 10px; padding: 6px 8px;
    font-family: var(--px); font-size: 9px; color: var(--parchment); background: var(--wood); box-shadow: 0 0 0 3px var(--wood-lt);
  }
  .row:first-child .rk { background: var(--red); box-shadow: 0 0 0 3px #7e1e17; }
  .row canvas { width: 72px; height: 84px; }
  .row h3 { font-family: var(--px); font-size: 10px; line-height: 1.6; margin: 2px 0 0; word-break: break-word; }
  .row h3 a { color: var(--ink); }
  .row h3 a:hover { color: var(--red); }
  .row .job { margin: 2px 0 0; font-size: 21px; }
  .row .meta { grid-column: 1 / -1; margin-top: 6px; }
  .bar { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; height: 12px; }
  .bar i { background: #bfa96f; }
  .bar i.on { background: var(--red); }
  .row:first-child .bar i.on { background: var(--gold); box-shadow: inset 0 -3px 0 #a87a10; }
  .count { font-family: var(--px); font-size: 9px; margin-top: 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

  .harbor { border-top: 8px solid var(--wood); margin-top: 32px; max-width: none; background: #07121a; }
  .harbor > div { max-width: 1180px; margin: 0 auto; }
  .ports { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .port a {
    display: block; padding: 18px; text-decoration: none; color: var(--foam);
    background: #10303f; box-shadow: 0 0 0 4px #1f5a73, 4px 4px 0 4px #000;
  }
  .port a:hover { background: #164559; }
  .port b { display: block; font-family: var(--px); font-size: 11px; line-height: 1.6; color: var(--gold); font-weight: normal; margin-bottom: 6px; }
  footer { padding: 24px 16px 40px; text-align: center; background: #07121a; font-size: 20px; }
  footer p { margin: 4px 0; opacity: .8; }

  @media (max-width: 560px) {
    body { font-size: 20px; }
    .tag { padding: 3px 4px; }
    .card { font-size: 19px; padding: 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>Gua Bajak Laut <span>megawan</span></h1>
</header>

<main>
  <div class="stage">
    <div class="cave" id="stage">
      <canvas id="cave" width="640" height="360" role="img" aria-label="Sepuluh awak bajak laut sibuk bekerja di dalam gua: memindahkan harta karun, menambal kapal, memasak, dan mengintai."></canvas>
      <div id="tags"></div>
      <div class="card" id="card" role="dialog" aria-live="polite" hidden></div>
    </div>
  </div>

  <section>
    <h2 class="sec">Daftar Kru</h2>
    <ol class="roster" id="roster"></ol>
  </section>

  <section class="harbor">
    <div>
      <h2 class="sec">Pelabuhan</h2>
      <ul class="ports">
        <li class="port"><a href="games/pirates/"><b>Pirates</b>Game berlayar kecil. Arahkan kapal ke pulau untuk melihat kerjaan cloud, catatan, dan RPG bajak laut.</a></li>
        <li class="port"><a href="games/hijaiyah/"><b>Belajar Huruf Hijaiyah</b>Game belajar untuk anak: 28 huruf hijaiyah dan harakatnya, lengkap dengan suara.</a></li>
      </ul>
    </div>
  </section>
</main>

<footer>
  <p><a href="https://github.com/megawan">github.com/megawan</a></p>
</footer>

<script>
(() => {
  "use strict";
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const W = 320, H = 180, S = 2; // scene units; one unit is S device pixels

  /* ================= data ================= */
  // Top 10 repos by commits on the default branch. Private repos are anonymised on purpose (p: true).
  const REPOS = [
    { n: "", p: true, c: 379, d: "Repo private. Isinya dirahasiakan, tapi dialah yang paling sering disentuh." },
    { n: "megawan.github.io", c: 52, l: "HTML", d: "Dek kapal ini: halaman utama dan game-game kecil." },
    { n: "AWScripting", c: 27, l: "Shell", d: "Kumpulan AWS CLI untuk mempermudah kerjaan." },
    { n: "", p: true, c: 25, d: "Repo private. Isinya dirahasiakan." },
    { n: "valkyrie", c: 13, l: "Perl", d: "Alat kecil penangkal brute force SSH dan serangan kamus.", a: true },
    { n: "ansible-playbook", c: 10, d: "Koleksi playbook untuk mempermudah hidup kerja." },
    { n: "", p: true, c: 9, d: "Repo private. Isinya dirahasiakan." },
    { n: "", p: true, c: 7, d: "Repo private. Isinya dirahasiakan." },
    { n: "lambda-iam-autoreminder", c: 5, l: "Python", d: "Lambda pengingat otomatis untuk IAM." },
    { n: "", p: true, c: 5, d: "Repo private. Isinya dirahasiakan." }
  ];

  // Index = rank. Each rank has a look and a job.
  const CREW = [
    { t: "KAPTEN",        job: "Mengawasi tumpukan harta karun",   hat: "tri",  shirt: "#c8372d", pants: "#2a1c10", beard: "#2a1c10", feather: true, skull: true },
    { t: "FIRST MATE",    job: "Mengangkut peti harta ke kapal",   hat: "tri",  shirt: "#2f6fb0", pants: "#2a1c10", hatc: "#1d3a5c" },
    { t: "QUARTERMASTER", job: "Mencatat dan menghitung koin",     hat: "band", shirt: "#7a4bb0", pants: "#3a2a4a", band: "#e8c872", patch: true },
    { t: "BOSUN",         job: "Menambal lambung kapal yang bocor", hat: "band", shirt: "#d98a1c", pants: "#4a3320", band: "#c8372d", beard: "#6b3b1a" },
    { t: "GUNNER",        job: "Mengasah golok di batu asah",      hat: "band", shirt: "#4a4a52", pants: "#22222a", band: "#111", beard: "#2a1c10" },
    { t: "NAVIGATOR",     job: "Membaca peta pelayaran",           hat: "tri",  shirt: "#1f9d8a", pants: "#163a44", hatc: "#0f5c52" },
    { t: "KOKI",          job: "Mengaduk sup di kuali",            hat: "chef", shirt: "#f4f4ee", pants: "#3a3a40", apron: true },
    { t: "TUKANG KAYU",   job: "Menggergaji papan di geladak",     hat: "band", shirt: "#8a5a2b", pants: "#3d1f0c", band: "#c9a45a" },
    { t: "PENGINTAI",     job: "Mengintai dari tiang tertinggi",   hat: "band", shirt: "#4aa84a", pants: "#2a4a2a", band: "#f0dfb0" },
    { t: "KELASI",        job: "Mengepel lantai gua",              hat: "none", shirt: "#e8eef0", pants: "#1d3a5c", stripes: "#2f6fb0", hair: "#5a2f14" }
  ];
  const crewData = REPOS.slice().sort((a, b) => b.c - a.c || a.n.localeCompare(b.n)).slice(0, 10);

  /* ================= drawing helpers ================= */
  // Scene coordinates are in "units" (320x180). One unit is S device pixels, so sub-unit
  // positions and sizes (0.5) give the finer detail.
  const SKIN = "#f2c28b", DARK = "#2a1c10", GOLD = "#f2b632", WHITE = "#fff";
  const cave = document.getElementById("cave");
  const ctx = cave.getContext("2d");
  const bgc = document.createElement("canvas"); bgc.width = W * S; bgc.height = H * S;
  const fgc = document.createElement("canvas"); fgc.width = W * S; fgc.height = H * S;
  let g = ctx;

  const r = (x, y, w, h, c) => {
    g.fillStyle = c;
    g.fillRect(Math.round(x * S), Math.round(y * S), Math.max(1, Math.round(w * S)), Math.max(1, Math.round(h * S)));
  };
  // Bresenham at device-pixel resolution; th is the thickness in device pixels
  function line(x0, y0, x1, y1, c, th) {
    th = th || 1;
    x0 = Math.round(x0 * S); y0 = Math.round(y0 * S); x1 = Math.round(x1 * S); y1 = Math.round(y1 * S);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let e = dx + dy;
    g.fillStyle = c;
    for (;;) {
      g.fillRect(x0, y0, th, th);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * e;
      if (e2 >= dy) { e += dy; x0 += sx; }
      if (e2 <= dx) { e += dx; y0 += sy; }
    }
  }
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const jit = n => { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); };
  const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const mix = (a, b, u) => { const A = hex(a), B = hex(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * u)).join(",") + ")"; };
  const dark = (c, u) => mix(c, "#000000", u), light = (c, u) => mix(c, "#ffffff", u);

  // One pirate, drawn on a half-unit grid. (x, y) is the point between the feet, in units.
  // a1/a2 are hand offsets from the shoulders in units; returns the hand positions in units.
  function person(x, y, L, o) {
    o = o || {};
    const f = o.f || 1, lg = o.legs || 0;
    const X = Math.round(x * S), Y = Math.round(y * S), yb = Y - Math.round((o.bob || 0) * S);
    const q = (dx, dy, w, h, c, base) => {
      g.fillStyle = c;
      g.fillRect(X + (f > 0 ? dx : -dx - w), (base === undefined ? yb : base) + dy, w, h);
    };
    const hair = L.hair || "#3a2412", boot = "#3a2412";
    const sh = dark(L.shirt, .28), hl = light(L.shirt, .18), pd = dark(L.pants, .3);
    const skinD = "#d9a06a";

    if (!o.noShadow) { g.fillStyle = "rgba(0,0,0,.22)"; g.fillRect(X - 9, Y, 18, 2); g.fillStyle = "rgba(0,0,0,.2)"; g.fillRect(X - 6, Y, 12, 2); }
    // legs
    if (lg === 3) {
      q(-3, -10, 10, 4, L.pants, Y); q(-3, -6, 10, 1, pd, Y);
      q(5, -10, 4, 10, L.pants, Y); q(5, -3, 7, 3, boot, Y); q(5, -4, 4, 1, "#5a3a1e", Y);
    } else {
      const l1 = lg === 1 ? 2 : 0, l2 = lg === 2 ? 2 : 0;
      [[-5, l1], [1, l2]].forEach(([dx, up], k) => {
        q(dx, -10 - up, 4, 6, L.pants, Y); q(dx + (k ? 0 : 3), -10 - up, 1, 6, pd, Y);
        q(dx, -4 - up, 5, 4, boot, Y); q(dx, -4 - up, 4, 1, "#5a3a1e", Y); q(dx, -1 - up, 5, 1, "#1a0e06", Y);
      });
    }
    // arms behind the torso edge: far arm first
    const sy = yb - 21;
    const far = [X + (f > 0 ? -6 : 4), sy], near = [X + (f > 0 ? 4 : -6), sy];
    const hf = [Math.round(far[0] + (o.a2 || [-1, 6])[0] * S * f), Math.round(far[1] + (o.a2 || [-1, 6])[1] * S)];
    const hn = [Math.round(near[0] + (o.a1 || [1, 6])[0] * S * f), Math.round(near[1] + (o.a1 || [1, 6])[1] * S)];
    const arm = (s0, h0, c) => {
      const x0 = s0[0], y0 = s0[1], x1 = h0[0], y1 = h0[1];
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sY = y0 < y1 ? 1 : -1;
      let e = dx + dy, cx = x0, cy = y0; g.fillStyle = c;
      for (;;) {
        g.fillRect(cx, cy, 2, 2);
        if (cx === x1 && cy === y1) break;
        const e2 = 2 * e;
        if (e2 >= dy) { e += dy; cx += sx; }
        if (e2 <= dx) { e += dx; cy += sY; }
      }
    };
    arm(far, hf, sh);
    // torso
    q(-6, -23, 12, 13, L.shirt); q(-6, -23, 2, 13, sh); q(4, -23, 2, 13, hl); q(-6, -11, 12, 1, sh);
    if (L.stripes) { q(-6, -20, 12, 2, L.stripes); q(-6, -16, 12, 2, L.stripes); }
    if (L.apron) { q(-4, -19, 8, 9, "#d9d4c0"); q(-4, -12, 8, 1, "#b8b29a"); q(-6, -19, 12, 1, "#d9d4c0"); }
    if (L.cross) { q(-1, -22, 2, 7, "#c8372d"); q(-3, -20, 6, 2, "#c8372d"); }
    q(-2, -24, 4, 2, skinD);  // neck
    q(-6, -12, 12, 2, DARK); q(-1, -12, 3, 2, GOLD); q(0, -11, 1, 1, "#a87a10");
    arm(near, hn, L.shirt);
    // hands
    g.fillStyle = SKIN; g.fillRect(hf[0] - 1, hf[1] - 1, 3, 3); g.fillRect(hn[0] - 1, hn[1] - 1, 3, 3);
    g.fillStyle = skinD; g.fillRect(hf[0] - 1, hf[1] + 1, 3, 1); g.fillRect(hn[0] - 1, hn[1] + 1, 3, 1);

    // head
    q(-5, -35, 10, 11, SKIN); q(-6, -34, 12, 9, SKIN); q(-5, -25, 10, 1, skinD); q(-6, -26, 1, 1, skinD); q(5, -26, 1, 1, skinD);
    q(-7, -31, 2, 4, "#e6b07a");                                  // ear
    q(6, -30, 2, 2, "#d99a68");                                    // nose
    if (L.beard) { q(-6, -29, 12, 5, L.beard); q(-5, -24, 10, 2, L.beard); q(1, -27, 5, 1, dark(L.beard, .2)); }
    q(-1, -32, 2, 3, DARK); q(3, -32, 2, 3, DARK);                 // eyes
    q(0, -32, 1, 1, WHITE); q(4, -32, 1, 1, WHITE);
    q(-2, -34, 4, 1, hair); q(2, -34, 4, 1, hair);                 // brows
    if (!L.beard) { q(2, -27, 3, 1, "#a8553a"); q(-3, -29, 2, 1, "#e8a080"); }
    else q(2, -27, 3, 1, "#7a3a2a");
    if (L.patch) { q(2, -33, 5, 5, "#111"); q(-6, -34, 12, 1, "#111"); q(-1, -33, 4, 1, "#111"); }
    q(-7, -34, 2, 5, hair);                                         // sideburn

    // headwear
    if (L.hat === "tri") {
      const c = L.hatc || "#15151c", cl = light(c, .18);
      q(-5, -42, 10, 3, c); q(-6, -39, 12, 3, c); q(-5, -42, 10, 1, cl);
      q(-10, -37, 20, 2, c); q(-11, -39, 3, 3, c); q(8, -39, 3, 3, c);
      q(-8, -37, 16, 1, GOLD); q(-8, -36, 16, 1, "#a87a10");
      if (L.skull) { q(-2, -41, 4, 3, WHITE); q(-2, -40, 1, 1, "#111"); q(1, -40, 1, 1, "#111"); q(-1, -38, 2, 1, "#111"); }
      if (L.feather) { q(6, -49, 2, 8, WHITE); q(8, -47, 2, 5, "#e6e6e6"); q(5, -46, 1, 4, "#e6e6e6"); }
    } else if (L.hat === "band") {
      q(-6, -38, 12, 5, L.band); q(-6, -36, 12, 1, dark(L.band, .22)); q(-6, -38, 12, 1, light(L.band, .2));
      q(-5, -40, 10, 2, hair);
      q(-10, -35, 4, 3, L.band); q(-12, -33, 3, 4, L.band); q(-9, -32, 2, 4, dark(L.band, .22));
      q(4, -37, 1, 3, light(L.band, .35)); q(0, -37, 1, 2, light(L.band, .35));
    } else if (L.hat === "chef") {
      q(-5, -44, 10, 4, WHITE); q(-8, -42, 5, 5, WHITE); q(3, -42, 5, 5, WHITE); q(-7, -38, 14, 3, WHITE);
      q(-4, -44, 3, 1, "#e6e6e6"); q(-8, -36, 16, 2, "#d9d4c0"); q(-8, -35, 16, 1, "#b8b29a");
    } else {
      q(-6, -38, 12, 4, hair); q(-7, -36, 3, 5, hair); q(-4, -40, 8, 2, hair); q(-3, -39, 3, 1, light(hair, .2));
    }
    return { h1: [hn[0] / S, hn[1] / S], h2: [hf[0] / S, hf[1] / S] };
  }

  /* ================= static background ================= */
  function buildBG() {
    const rnd = rng(11);
    g = bgc.getContext("2d");

    // wall: smooth vertical gradient, then rock mottling at sub-unit size
    const stops = ["#0d0c1e", "#12112a", "#171534", "#1d1a3e", "#231f46", "#2a2550", "#312b58", "#383160", "#3e3768", "#443d6e", "#4a4274", "#4e4678"];
    for (let y = 0; y < 144; y += 1) {
      const u = y / 144 * (stops.length - 1), i = Math.floor(u);
      r(0, y, W, 1, mix(stops[i], stops[Math.min(i + 1, stops.length - 1)], u - i));
    }
    for (let i = 0; i < 900; i++) {
      r(rnd() * W, rnd() * 140, .5 + rnd() * 4, .5 + rnd() * 1.5, rnd() < .5 ? "rgba(0,0,0,.16)" : "rgba(255,255,255,.045)");
    }
    for (let i = 0; i < 40; i++) { // cracks
      let cx = rnd() * W, cy = 20 + rnd() * 110;
      for (let k = 0; k < 7; k++) { r(cx, cy, .5, .5, "rgba(0,0,0,.35)"); cx += (rnd() - .5) * 2; cy += .5 + rnd(); }
    }

    // ceiling and stalactites
    const ch = x => 12 + 6 * Math.sin(x * .07) + 4 * Math.sin(x * .19 + 1) + 1.5 * Math.sin(x * .6);
    for (let x = 0; x < W; x += .5) r(x, 0, .5, ch(x), "#07060f");
    for (let x = 0; x < W; x += .5) r(x, ch(x) - 1, .5, 1, "#100e22");
    for (let sx = 5; sx < W; sx += 8 + (rnd() * 8 | 0)) {
      const len = 6 + (rnd() * 15 | 0), top = ch(sx);
      for (let k = 0; k < len; k += .5) {
        const w = Math.max(.5, 4.5 * Math.pow(1 - k / len, 1.2));
        r(sx - w / 2, top + k, w, .5, "#0a0918");
        r(sx - w / 2, top + k, Math.min(.5, w), .5, "#1c1938");
      }
    }
    // skylight, which the mast pokes through

      return [x, 144];
    }
  ];

  /* ================= frame ================= */
  const stageEl = document.getElementById("stage");
  const tagsEl = document.getElementById("tags");
  const cardEl = document.getElementById("card");
  const tagEls = [];
  const tagPos = jobs.map(() => [0, 0]);

  function frame(t) {
    g = ctx;
    ctx.drawImage(bgc, 0, 0);
    beam(t); torches(t); lantern(t); sparkles(t); cauldron(t); grindstone(t); drips(t);

    // seated and fixed crew go behind the table and nest front; the two walkers pass in front of them
    [0, 5, 4, 6, 3, 7, 8, 2].forEach(i => { tagPos[i] = jobs[i](t, CREW[i]); });
    ctx.drawImage(fgc, 0, 0);
    [1, 9].forEach(i => { tagPos[i] = jobs[i](t, CREW[i]); });

    // things lying on the table
    r(115, 137, 11, 2, "#6b2a1a"); r(116, 136, 9, 1, "#f0e6c8");
    const n = (Math.floor(t) % 4) + 1;
    for (let k = 0; k < n; k++) r(109, 138 - k, 3, 1, GOLD);
    r(113, 138, 2, 1, GOLD); r(113, 137, 2, 1, "#c98a14");

    bats(t); water(t);
    // pennant on the mast
    const fl = Math.round(Math.sin(t * 5));
    r(268, 28, 9, 4, "#111"); r(273 + fl, 29, 4, 2, "#111"); r(270, 29, 2, 1, WHITE);

    tagEls.forEach((el, i) => {
      el.style.left = (tagPos[i][0] / W * 100) + "%";
      el.style.top = ((tagPos[i][1] + 16) / H * 100) + "%";
    });
    if (openIdx >= 0) placeCard(openIdx);
  }

  /* ================= tags, card, roster ================= */
  let openIdx = -1;
  const label = (d, i) => d.p ? "Repo private #" + (i + 1) : d.n;

  function fillCard(i) {
    const d = crewData[i], L = CREW[i];
    cardEl.textContent = "";
    const rk = document.createElement("p"); rk.className = "r"; rk.textContent = "#" + (i + 1) + " " + L.t;
    const h = document.createElement("h2"); h.textContent = label(d, i);
    const job = document.createElement("p"); job.textContent = L.job + ".";
    const ds = document.createElement("p"); ds.textContent = d.d;
    const c = document.createElement("p"); c.className = "c"; c.textContent = d.c.toLocaleString("id-ID") + " COMMIT" + (d.a ? " · PENSIUN" : "");
    cardEl.append(rk, h, job, ds, c);
    if (!d.p) {
      const a = document.createElement("a"); a.href = "https://github.com/megawan/" + encodeURIComponent(d.n); a.textContent = "Buka di GitHub";
      cardEl.append(a);
    }
  }
  function placeCard(i) {
    const [x, y] = tagPos[i], px = x / W, py = y / H;
    cardEl.style.left = (px * 100) + "%";
    cardEl.style.top = (py * 100) + "%";
    const tx = px > .68 ? "-100%" : px < .32 ? "0" : "-50%";
    const ty = py > .5 ? "calc(-100% - 18px)" : "18px";
    cardEl.style.transform = "translate(" + tx + "," + ty + ")";
  }
  function show(i) {
    openIdx = i; fillCard(i); cardEl.hidden = false; placeCard(i);
    tagEls.forEach((el, k) => el.setAttribute("aria-expanded", String(k === i)));
  }
  function hide() { openIdx = -1; cardEl.hidden = true; tagEls.forEach(el => el.setAttribute("aria-expanded", "false")); }

  crewData.forEach((d, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tag";
    b.setAttribute("aria-label", "#" + (i + 1) + " " + CREW[i].t + ", " + label(d, i));
    b.setAttribute("aria-expanded", "false");
    b.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") show(i); });
    b.addEventListener("click", () => openIdx === i ? hide() : show(i));
    tagsEl.append(b); tagEls.push(b);
  });
  stageEl.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hide(); });
  addEventListener("keydown", e => { if (e.key === "Escape") hide(); });
  document.addEventListener("click", e => { if (!stageEl.contains(e.target)) hide(); });

  // Roster: a small idle portrait for each crew member
  const rosterEl = document.getElementById("roster");
  const maxC = crewData[0].c;
  crewData.forEach((d, i) => {
    const L = CREW[i];
    const li = document.createElement("li"); li.className = "row";
    const rk = document.createElement("span"); rk.className = "rk"; rk.textContent = "#" + (i + 1) + " " + L.t;
    const cv = document.createElement("canvas"); cv.width = 24; cv.height = 28; cv.setAttribute("aria-hidden", "true");
    g = cv.getContext("2d"); person(12, 26, L, { f: 1, noShadow: true }); g = ctx;

    const info = document.createElement("div");
    const h = document.createElement("h3");
    if (d.p) h.textContent = "Repo private";
    else { const a = document.createElement("a"); a.href = "https://github.com/megawan/" + encodeURIComponent(d.n); a.textContent = d.n; h.append(a); }
    const job = document.createElement("p"); job.className = "job"; job.textContent = L.job + ".";
    info.append(h, job);

    const meta = document.createElement("div"); meta.className = "meta";
    const bar = document.createElement("div"); bar.className = "bar"; bar.setAttribute("aria-hidden", "true");
    const on = Math.max(1, Math.round(Math.sqrt(d.c / maxC) * 20));
    for (let k = 0; k < 20; k++) { const s = document.createElement("i"); if (k < on) s.className = "on"; bar.append(s); }
    const cnt = document.createElement("div"); cnt.className = "count";
    const c1 = document.createElement("span"); c1.textContent = d.c.toLocaleString("id-ID") + " COMMIT";
    const c2 = document.createElement("span"); c2.textContent = [d.l, d.a ? "PENSIUN" : ""].filter(Boolean).join(" · ");
    cnt.append(c1, c2);
    meta.append(bar, cnt);

    li.append(rk, cv, info, meta);
    rosterEl.append(li);
  });

  /* ================= go ================= */
  buildBG();
  g = ctx;
  frame(REDUCED ? 3 : 0);
  if (!REDUCED) {
    let last = 0;
    const loop = ms => {
      if (ms - last > 1000 / 30) { last = ms; frame(ms / 1000); }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
