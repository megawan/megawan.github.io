<script>
(() => {
  "use strict";
  const W = 320, H = 192, SHORE = 96;
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ================= helpers ================= */
  const rnd = i => { const s = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return s - Math.floor(s); };
  const mkc = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };
  function L(c, x0, y0, x1, y1, col) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let e = dx + dy;
    for (;;) {
      R(c, x0, y0, 1, 1, col);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * e;
      if (e2 >= dy) { e += dy; x0 += sx; }
      if (e2 <= dx) { e += dx; y0 += sy; }
    }
  }
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const lerp = (a, b, t) => { const A = hex(a), B = hex(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")"; };
  const spr = (w, h, fn) => { const c = mkc(w, h), g = c.getContext("2d"); fn(g); return c; };
  const shoreY = x => SHORE + Math.round(3 * Math.sin(x / 24) + 1.5 * Math.sin(x / 9));
  const grassTop = x => shoreY(x) + 15 + Math.round(2 * Math.sin(x / 13 + 1));
  const SKIN = "#f4c79a", DARK = "#2a1c10", GOLD = "#f2b632";

  /* ================= people ================= */
  // ~20 units tall with a big head. (x, y) = ground point under the feet.
  // dir: d u l r. step 0..3 = walk cycle. hl / hr = hand offsets from each shoulder.
  function person(c, x, y, o) {
    x = Math.round(x); y = Math.round(y);
    const d = o.dir || "d", st = o.step || 0, u = st & 1 ? 1 : 0;
    const hair = o.hair || "#5a2f14";
    R(c, x - 5, y - 2, 11, 3, "rgba(0,20,0,.22)");
    // legs
    const side = d === "l" || d === "r", f = d === "r" ? 1 : -1;
    if (side) {
      const a = st === 1 ? 1 : st === 3 ? -1 : 0;
      R(c, x - 2 + a * f, y - 5, 2, 3, o.pants); R(c, x + 0 - a * f, y - 5, 2, 3, o.pants);
      R(c, x - 2 + a * f, y - 2, 3, 2, DARK); R(c, x + 0 - a * f, y - 2, 3, 2, DARK);
    } else {
      R(c, x - 2, y - 5, 2, 3, o.pants); R(c, x, y - 5, 2, 3, o.pants);
      R(c, x - 3, y - 2 - (st === 1 ? 1 : 0), 3, 2, DARK); R(c, x, y - 2 - (st === 3 ? 1 : 0), 3, 2, DARK);
    }
    // torso
    const ty = y - 11 + u;
    R(c, x - 3, ty, 6, 6, o.shirt);
    if (o.stripes) for (let r = 0; r < 6; r += 2) R(c, x - 3, ty + r, 6, 1, o.stripes);
    if (o.apron && d !== "u") R(c, x - 2, ty + 1, 4, 5, "#fff");
    if (o.vest) { R(c, x - 3, ty, 2, 6, o.vest); R(c, x + 1, ty, 2, 6, o.vest); }
    if (o.coat && d !== "u") { R(c, x - 1, ty, 2, 6, "#fff3d0"); R(c, x - 1, ty + 1, 1, 1, GOLD); R(c, x, ty + 3, 1, 1, GOLD); R(c, x - 3, ty, 6, 1, "#8a1f19"); }
    R(c, x - 3, ty + 5, 6, 1, DARK); R(c, x - 1, ty + 5, 2, 1, GOLD);
    // arms
    const hl = o.hl || [0, 4], hr = o.hr || [0, 4];
    const arms = () => {
      L(c, x - 4, ty + 1, x - 4 + hl[0], ty + 1 + hl[1], o.shirt); R(c, x - 4 + hl[0], ty + 1 + hl[1], 1, 1, SKIN);
      L(c, x + 3, ty + 1, x + 3 + hr[0], ty + 1 + hr[1], o.shirt); R(c, x + 3 + hr[0], ty + 1 + hr[1], 1, 1, SKIN);

    if (d !== "u") arms();
    // head
    const hy = y - 19 + u;
    R(c, x - 4, hy, 8, 7, SKIN);
    if (d === "u") {
      R(c, x - 4, hy, 8, 6, hair); R(c, x - 3, hy + 6, 6, 1, hair);
    } else if (d === "d") {
      R(c, x - 4, hy, 8, 3, hair); R(c, x - 4, hy + 3, 1, 2, hair); R(c, x + 3, hy + 3, 1, 2, hair);
      R(c, x - 2, hy + 3, 1, 2, DARK); R(c, x + 1, hy + 3, 1, 2, DARK);
      R(c, x - 3, hy + 5, 1, 1, "#f0a090"); R(c, x + 2, hy + 5, 1, 1, "#f0a090");
    } else {
      R(c, x - 4, hy, 8, 3, hair);
      if (d === "r") { R(c, x - 4, hy + 3, 4, 3, hair); R(c, x + 2, hy + 3, 1, 2, DARK); R(c, x + 4, hy + 4, 1, 1, SKIN); R(c, x + 2, hy + 5, 1, 1, "#f0a090"); }
      else { R(c, x, hy + 3, 4, 3, hair); R(c, x - 3, hy + 3, 1, 2, DARK); R(c, x - 5, hy + 4, 1, 1, SKIN); R(c, x - 3, hy + 5, 1, 1, "#f0a090"); }
    }
    if (o.glasses && d === "d") { R(c, x - 3, hy + 2, 3, 1, "#c9c9d0"); R(c, x, hy + 2, 3, 1, "#c9c9d0"); }
    if (o.patch && d === "d") { R(c, x + 1, hy + 3, 2, 2, "#000"); R(c, x - 4, hy + 2, 8, 1, "#000"); }
    if (o.beard && d !== "u") { R(c, x - 3, hy + 5, 6, 2, o.beard); R(c, x - 2, hy + 7, 4, 1, o.beard); if (d === "d") R(c, x - 1, hy + 4, 2, 1, "#6b4a30"); }
    // headgear
    if (o.hat === "tri") {
      R(c, x - 6, hy - 2, 12, 2, o.hatc); R(c, x - 4, hy - 5, 8, 3, o.hatc);
      R(c, x - 6, hy - 2, 12, 1, GOLD); R(c, x - 6, hy - 3, 1, 1, GOLD); R(c, x + 5, hy - 3, 1, 1, GOLD);
      if (o.skull) { R(c, x - 1, hy - 5, 2, 2, "#fff"); }
      if (o.feather) { R(c, x + 3, hy - 7, 1, 3, "#f4f4ee"); R(c, x + 4, hy - 8, 1, 2, "#e0605a"); }
    } else if (o.hat === "band") {
      R(c, x - 4, hy + 1, 8, 2, o.band);
      if (d === "l") R(c, x + 4, hy + 1, 2, 3, o.band); else R(c, x - 6, hy + 1, 2, 3, o.band);
    } else if (o.hat === "chef") {
      R(c, x - 4, hy - 1, 8, 2, "#fff"); R(c, x - 5, hy - 5, 10, 4, "#fff"); R(c, x - 3, hy - 7, 6, 2, "#fff");
      R(c, x - 5, hy - 3, 1, 1, "#dcdcdc"); R(c, x + 4, hy - 4, 1, 1, "#dcdcdc");
    } else if (o.hat === "cap") {
      R(c, x - 4, hy - 2, 8, 4, o.hatc); R(c, x - 3, hy - 3, 6, 1, o.hatc);
      if (d === "d") R(c, x - 4, hy + 2, 8, 1, "#1a1008"); else if (d === "r") R(c, x + 3, hy + 1, 3, 1, "#1a1008"); else if (d === "l") R(c, x - 6, hy + 1, 3, 1, "#1a1008");
    } else {
      R(c, x - 5, hy + 1, 1, 3, hair); R(c, x + 4, hy + 1, 1, 3, hair); R(c, x - 4, hy - 1, 8, 1, hair);
    }
    if (d === "u") arms();
  }

  const LOOK = {

    mate:    { hat: "tri",  hatc: "#1d3a5c", shirt: "#2f6fb0", pants: "#2a1c10", beard: "#8a4a1a", hair: "#8a4a1a" },
    nav:     { hat: "band", band: "#1f9d8a", hair: "#2a1c10", shirt: "#e8e2cc", pants: "#163a44", vest: "#1f9d8a" },
    qm:      { hat: "none", hair: "#c9c9d0", shirt: "#7a4bb0", pants: "#3a2a4a", glasses: 1 },
    lookout: { hat: "band", band: "#f0dfb0", hair: "#c9742a", shirt: "#4aa84a", pants: "#2a4a2a" },
    gunner:  { hat: "band", band: "#15151c", hair: "#15151c", shirt: "#4a4a52", pants: "#22222a", beard: "#2a1c10" },
    cook:    { hat: "chef", shirt: "#f4f4ee", pants: "#3a3a40", apron: 1, hair: "#5a2f14" },
    carp:    { hat: "cap",  hatc: "#c9a45a", hair: "#5a2f14", shirt: "#8a5a2b", pants: "#3d1f0c", beard: "#6b3b1a" },
    kid:     { hat: "cap",  hatc: "#2f6fb0", hair: "#5a2f14", shirt: "#e8eef0", stripes: "#2f6fb0", pants: "#1d3a5c" }
  };

  /* ================= routes ================= */
  // Each crew member loops through nodes: stand and do `act` for `dur` seconds, then walk to the next.
  function mkRoute(nodes, speed) {
    speed = speed || 15;
    const segs = []; let t = 0;
    nodes.forEach((a, i) => {
      const b = nodes[(i + 1) % nodes.length];
      segs.push({ t0: t, t1: t + a.dur, stay: true, a });
      t += a.dur;
      const wt = Math.hypot(b.x - a.x, b.y - a.y) / speed;
      if (wt > 0) { segs.push({ t0: t, t1: t + wt, a, b }); t += wt; }
    });
    return { segs, total: Math.max(t, 0.001) };
  }
  function at(rt, T) {
    const tt = T % rt.total;
    let s = rt.segs[rt.segs.length - 1];
    for (const g of rt.segs) if (tt >= g.t0 && tt < g.t1) { s = g; break; }
    if (s.stay) return { x: s.a.x, y: s.a.y, dir: s.a.face || "d", moving: false, act: s.a.act, au: tt - s.t0, carry: !!s.a.carry, step: 0, tt };
    const u = (tt - s.t0) / (s.t1 - s.t0), dx = s.b.x - s.a.x, dy = s.b.y - s.a.y;
    return {
      x: s.a.x + dx * u, y: s.a.y + dy * u, moving: true, carry: !!s.a.carry, au: 0, tt,
      dir: Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "r" : "l") : (dy > 0 ? "d" : "u"),
      step: [0, 1, 2, 3][Math.floor(T * 7) % 4]
    };
  }
  const N = (x, y, act, dur, face, carry) => ({ x, y, act, dur: dur || 0, face, carry });
  const ROUTES = {
    captain: mkRoute([
      N(224, 58, "steer", 7, "u"), N(236, 58, "look", 1.5, "d"), N(236, 78), N(233, 104),
      N(176, 124, "point", 4, "d"),
      N(233, 104), N(236, 78), N(236, 58)
    ]),
    mate: mkRoute([N(208, 122, "pick", 1.2, "d", true), N(178, 168, "put", 1.2, "d", false)]),
    nav: mkRoute([N(240, 148, "map", 6, "r"), N(248, 112, "scope", 5, "u")]),
    qm: mkRoute([N(274, 172, "write", 6, "r"), N(262, 160, "write", 4, "d")]),
    cook: mkRoute([N(126, 166, "stir", 7, "r"), N(152, 152, "taste", 3, "r")]),
    carp: mkRoute([N(44, 184, "hammer", 7, "u"), N(98, 170, "saw", 5, "l")]),
    gunner: mkRoute([N(14, 116, "fire", 9, "r"), N(82, 114), N(94, 138, "sword", 5, "r"), N(82, 114)]),
    kid: mkRoute([N(98, 106, "fish", 100, "u")])
  };

  /* ================= static sprites ================= */
  const TREE = spr(34, 38, s => {
    R(s, 5, 32, 24, 5, "rgba(0,40,0,.25)");
    R(s, 14, 26, 5, 10, "#6b3b1a"); R(s, 14, 26, 2, 10, "#8a5a2b"); R(s, 12, 34, 3, 2, "#6b3b1a"); R(s, 19, 34, 3, 2, "#6b3b1a");
    for (let y = 0; y < 30; y++) for (let x = 0; x < 34; x++) {
      const dx = (x - 17) / 16, dy = (y - 15) / 14, d = dx * dx + dy * dy;
      if (d > 1) continue;
      const v = dx * 0.6 + dy * 0.9;
      let col = d > 0.8 ? "#23622a" : v < -0.45 ? "#8bd653" : v < -0.05 ? "#5db440" : v < 0.45 ? "#418f33" : "#2f7329";
      if (((x + y) & 1) && Math.abs(v + 0.05) < 0.12) col = "#5db440";
      R(s, x, y, 1, 1, col);
    }
    [[10, 12], [22, 18], [16, 22], [25, 9], [8, 20]].forEach(([x, y]) => { R(s, x, y, 2, 2, "#e8453a"); R(s, x, y, 1, 1, "#ff9a8a"); });
  });
  const CABIN = spr(66, 58, s => {
    // walls
    R(s, 5, 24, 56, 28, "#b88348");
    for (let y = 27; y < 50; y += 4) R(s, 5, y, 56, 1, "#94642f");
    R(s, 5, 48, 56, 4, "#8c8c96"); for (let x = 5; x < 61; x += 7) R(s, x, 48, 1, 4, "#6e6e78");
    R(s, 5, 24, 2, 28, "#d4a064"); R(s, 59, 24, 2, 28, "#8a5a2b");
    // roof
    for (let r = 0; r < 18; r++) {
      const col = Math.floor(r / 3) % 2 ? "#c8372d" : "#b22d25";
      R(s, 0, 8 + r, 66, 1, r % 3 === 2 ? "#8a1f19" : col);
      if (r % 3 !== 2) for (let x = (Math.floor(r / 3) % 2) * 4; x < 66; x += 8) R(s, x, 8 + r, 1, 1, "#8a1f19");
    }
    R(s, 0, 6, 66, 2, "#e0605a"); R(s, 0, 26, 66, 2, "#5a1410");
    // chimney
    R(s, 46, 0, 8, 12, "#8c8c96"); R(s, 46, 0, 8, 2, "#b4b4c0"); R(s, 46, 4, 8, 1, "#6e6e78"); R(s, 46, 8, 8, 1, "#6e6e78");
    // door + windows
    R(s, 27, 34, 11, 18, "#4a2a12"); R(s, 28, 35, 9, 17, "#5e3a1a"); R(s, 35, 43, 1, 2, GOLD);
    R(s, 24, 33, 17, 2, "#8a5a2b");
    [[10, 35], [45, 35]].forEach(([x, y]) => { R(s, x - 1, y - 1, 12, 11, "#6e3b1a"); R(s, x, y, 10, 9, "#ffe27a"); R(s, x + 4, y, 2, 9, "#8a5a2b"); R(s, x, y + 4, 10, 2, "#8a5a2b"); R(s, x, y + 9, 10, 1, "#fff2b0"); });
    // hanging sign
    R(s, 61, 28, 1, 14, "#4a2a12"); R(s, 61, 28, 5, 1, "#4a2a12");
    R(s, 59, 35, 7, 7, "#e0c27a"); R(s, 59, 35, 7, 1, "#8a5a2b"); R(s, 61, 37, 3, 2, "#1a1a2e"); R(s, 62, 39, 1, 2, "#1a1a2e");
  });
  const TENT = spr(38, 28, s => {
    R(s, 2, 24, 34, 3, "rgba(0,40,0,.22)");
    for (let r = 0; r < 22; r++) {
      const half = Math.round(2 + r * 0.82), cx = 19;
      for (let x = cx - half; x <= cx + half; x++) R(s, x, 2 + r, 1, 1, Math.floor((x + 40) / 4) % 2 ? "#f4f1e4" : "#c8372d");
      R(s, cx + half - 1, 2 + r, 2, 1, "#8a5a2b");
    }
    R(s, 18, 0, 1, 4, "#4a2a12"); R(s, 19, 0, 4, 3, "#c8372d");
    R(s, 15, 14, 8, 10, "#2a1c10"); R(s, 17, 12, 4, 3, "#2a1c10");
  });
  const CRATE = spr(9, 9, s => { R(s, 0, 0, 9, 9, "#c9a45a"); R(s, 0, 0, 9, 1, "#e8cf8a"); R(s, 0, 8, 9, 1, "#8a6a2a"); R(s, 0, 0, 1, 9, "#8a6a2a"); R(s, 8, 0, 1, 9, "#8a6a2a"); R(s, 4, 0, 1, 9, "#8a6a2a"); R(s, 1, 1, 7, 1, "#e0c27a"); });
  const BARREL = spr(9, 12, s => { R(s, 1, 0, 7, 12, "#8a5a2b"); R(s, 0, 2, 9, 8, "#8a5a2b"); R(s, 0, 3, 9, 1, "#3d1f0c"); R(s, 0, 8, 9, 1, "#3d1f0c"); R(s, 2, 1, 1, 10, "#b27a3e"); R(s, 1, 0, 7, 1, "#c99a58"); });
  const CHEST = spr(16, 14, s => {
    R(s, 1, 12, 14, 2, "rgba(0,40,0,.25)");
    R(s, 1, 5, 14, 8, "#8a5a2b"); R(s, 1, 2, 14, 4, "#b27a3e"); R(s, 2, 1, 12, 1, "#b27a3e");
    R(s, 1, 6, 14, 1, "#2a1c10"); R(s, 1, 12, 14, 1, "#5a2f14"); R(s, 1, 2, 1, 11, "#5a2f14"); R(s, 14, 2, 1, 11, "#5a2f14");
    R(s, 7, 5, 3, 4, GOLD); R(s, 8, 6, 1, 2, "#8a5a00");
    R(s, 3, 0, 3, 2, GOLD); R(s, 8, 0, 2, 1, "#ffe27a"); R(s, 11, 0, 2, 2, GOLD);
  });
  const TABLE = spr(28, 18, s => {
    R(s, 1, 14, 26, 3, "rgba(0,40,0,.22)");
    R(s, 2, 12, 3, 5, "#5a2f14"); R(s, 23, 12, 3, 5, "#5a2f14");
    R(s, 0, 4, 28, 9, "#a9753a"); R(s, 0, 4, 28, 1, "#d2a35e"); R(s, 0, 12, 28, 1, "#6e3b1a");
    R(s, 3, 5, 18, 6, "#f0dfb0"); R(s, 3, 5, 18, 1, "#fff3d0"); R(s, 15, 7, 2, 1, "#c8372d"); R(s, 16, 6, 1, 3, "#c8372d");
    L(s, 5, 9, 12, 7, "#2f6fb0"); R(s, 23, 5, 4, 4, GOLD); R(s, 24, 6, 2, 2, "#8a5a00");
  });
  const BENCH = spr(32, 18, s => {
    R(s, 1, 15, 30, 3, "rgba(0,40,0,.22)");
    R(s, 3, 9, 3, 8, "#5a2f14"); R(s, 26, 9, 3, 8, "#5a2f14");
    R(s, 0, 5, 32, 5, "#a9753a"); R(s, 0, 5, 32, 1, "#d2a35e"); R(s, 0, 9, 32, 1, "#6e3b1a");
    R(s, 4, 3, 12, 2, "#d8b06a"); R(s, 20, 2, 8, 3, "#c9a45a");

  });
  const PLANKS = spr(18, 10, s => { R(s, 0, 6, 18, 3, "rgba(0,40,0,.2)"); R(s, 0, 3, 16, 3, "#d8b06a"); R(s, 0, 3, 16, 1, "#ecd08e"); R(s, 2, 0, 15, 3, "#c9a45a"); R(s, 2, 0, 15, 1, "#e0c27a"); R(s, 1, 6, 15, 2, "#b8923f"); });

  const CANNON = spr(26, 16, s => {
    R(s, 2, 12, 22, 3, "rgba(0,40,0,.22)");

    R(s, 5, 7, 12, 1, "#5a5a68"); R(s, 12, 6, 7, 1, "#5a5a68"); R(s, 18, 5, 6, 1, "#5a5a68"); R(s, 23, 6, 2, 2, "#15151c");
    R(s, 3, 9, 14, 3, "#5a2f14"); R(s, 3, 9, 14, 1, "#8a5a2b");
    for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; R(s, 10 + Math.round(Math.cos(a) * 4), 10 + Math.round(Math.sin(a) * 4), 1, 1, "#b27a3e"); }
    R(s, 9, 9, 2, 2, "#5a2f14");
  });

      for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5; R(c, 136 + Math.round(Math.cos(a) * 8), 164 + Math.round(Math.sin(a) * 4), 3, 2, i % 2 ? "#8c8c96" : "#a9a9b4"); }
      R(c, 130, 163, 12, 3, "#5a2f14"); R(c, 131, 162, 10, 1, "#3d1f0c");
      R(c, 132, 158, 8, 6, "#e8561a"); R(c, 133, 155 + (f % 2), 6, 7, "#f2b632"); R(c, 134, 160, 4, 3, "#fff2b0");
      if (f === 1) R(c, 136, 152, 1, 2, "#e8561a");
      L(c, 131, 148, 127, 164, "#5a2f14"); L(c, 141, 148, 145, 164, "#5a2f14");
      R(c, 130, 146, 13, 7, "#2a2a32"); R(c, 129, 145, 15, 2, "#4a4a56"); R(c, 132, 147, 3, 1, "#6a6a78"); R(c, 131, 148, 11, 1, "#c8863a");
      R(c, 120, 170, 9, 3, "#6e3b1a"); R(c, 120, 170, 9, 1, "#a9753a"); R(c, 146, 171, 9, 3, "#6e3b1a"); R(c, 146, 171, 9, 1, "#a9753a");
      if (!REDUCED) for (let k = 0; k < 5; k++) {
        const q = (Tm * 0.8 + k * 0.2) % 1;
        R(c, 136 + Math.sin(Tm + k) * 3 + q * 6, 142 - q * 34, 2 + Math.floor(q * 3), 2 + Math.floor(q * 3), "rgba(245,245,250," + (0.75 * (1 - q)).toFixed(2) + ")");
      }
    });
    // cannon with its shots
    add(110, () => {
      blit(c, CANNON, 24, 110 - 14);
      if (REDUCED) return;
      const ph = Tm % ROUTES.gunner.total, mx = 49, my = 100;
      if (ph >= 6 && ph < 6.25) R(c, mx, my - 3, 5, 6, "#fff2b0");
      if (ph >= 6 && ph < 7.8) for (let i = 0; i < 4; i++) {
        const q = ph - 6;
        R(c, mx + 2 + q * 12 + i * 3, my - q * 6 - i, 2 + Math.floor(q * 3), 2 + Math.floor(q * 3), "rgba(232,232,236," + Math.max(0, 0.9 - q * 0.5).toFixed(2) + ")");
      }
      if (ph >= 6 && ph < 7.4) {
        const u = (ph - 6) / 1.4;
        R(c, mx + u * 52, my - u * 34 + 28 * u * u - 6 * u, 3, 3, "#15151c");
      } else if (ph >= 7.4 && ph < 8.6) {
        const q = ph - 7.4;
        for (let i = 0; i < 4; i++) R(c, 101 + (i - 1.5) * 3 * (1 + q * 2), 70 - Math.sin(Math.min(1, q * 1.6) * Math.PI) * 8, 2, 2, "#e6f4ff");
      }
    });
    // crab
    add(110, () => {
      const cx = 182 + (REDUCED ? 0 : Math.sin(Tm * 0.4) * 14), f = REDUCED ? 0 : Math.floor(Tm * 6) % 2;
      R(c, cx, 108, 6, 3, "#e0453a"); R(c, cx + 1, 107, 4, 1, "#f0705a"); R(c, cx + 1, 107, 1, 1, DARK); R(c, cx + 4, 107, 1, 1, DARK);
      R(c, cx - 2, 106 - f, 2, 2, "#e0453a"); R(c, cx + 6, 106 - (1 - f), 2, 2, "#e0453a");
      R(c, cx, 111, 1, 1, "#a82a22"); R(c, cx + 2, 111, 1, 1, "#a82a22"); R(c, cx + 4, 111, 1, 1, "#a82a22");
    });
    // crew on the ground and on the ship
    ["mate", "qm", "nav", "cook", "carp", "gunner", "kid", "captain"].forEach(id => add(Math.round(at(ROUTES[id], Tm).y), () => drawCrew(c, id, Tm)));
    add(20, () => {
      const y = 20 + b, d = REDUCED || Math.sin(Tm * 0.6) >= 0 ? "r" : "l", s = d === "r" ? 1 : -1;
      person(c, 236, y, { ...LOOK.lookout, dir: d, hl: [s * 3, -5], hr: [s * 5, -6] });
      L(c, 236 + s * 8, y - 16, 236 + s * 14, y - 19, "#c9a45a"); R(c, 236 + s * 14, y - 20, 1, 3, GOLD);
      R(c, 227, y - 5, 19, 2, "#c99a58"); R(c, 228, y - 3, 17, 6, "#8a5a2b"); R(c, 228, y, 17, 1, "#5a2f14"); R(c, 228, y + 2, 17, 1, "#3d1f0c");
    });
    // parrot (flies in front of everything, with a ground shadow)
    add(260, () => {
      const t = REDUCED ? 1.2 : Tm, px = 160 + 100 * Math.sin(t * 0.35), py = 70 + 24 * Math.sin(t * 0.7), d = Math.cos(t * 0.35) >= 0 ? 1 : -1, f = REDUCED ? 0 : Math.floor(Tm * 8) % 2;
      R(c, px, py + 22, 6, 2, "rgba(0,20,0,.2)");
      R(c, px - d * 4 + (d > 0 ? 0 : 3), py + 1, 4, 1, "#2f6fb0");
      R(c, px, py, 5, 3, "#d8312a"); R(c, px + (d > 0 ? 5 : -2), py - 1, 3, 3, "#d8312a");
      R(c, px + (d > 0 ? 8 : -3), py, 1, 1, GOLD); R(c, px + (d > 0 ? 6 : -1), py - 1, 1, 1, "#fff");
      R(c, px + 1, py + (f ? -2 : 3), 3, 2, "#2f6fb0");
    });
    // gulls overhead
    add(270, () => {
      for (let i = 0; i < 3; i++) {
        const gx = ((i * 130 + (REDUCED ? 70 : Tm * 9)) % (W + 40)) - 20, gy = 14 + i * 20 + (REDUCED ? 0 : Math.sin(Tm * 1.7 + i) * 3), f = REDUCED ? 0 : Math.floor(Tm * 3 + i) % 2;
        R(c, gx - 3, gy + f, 3, 1, "#fff"); R(c, gx + 1, gy + f, 3, 1, "#fff"); R(c, gx - 1, gy + 1, 2, 1, "#fff");
      }
    });

    E.sort((a, b2) => a.y - b2.y).forEach(e => e.fn());

    // drifting cloud shadows
    for (let i = 0; i < 3; i++) {
      const bx = ((i * 140 + (REDUCED ? 40 : Tm * 5)) % (W + 140)) - 70, by = 40 + i * 60;
      for (let dy = -12; dy <= 12; dy += 2) {
        const hw = Math.round(Math.sqrt(1 - (dy / 13) * (dy / 13)) * 36);
        R(c, bx - hw, by + dy, hw * 2, 2, "rgba(10,30,70,.09)");
      }
    }
  }

  /* ================= full-frame scaling ================= */
  // Cover the viewport with a whole-number scale so pixels stay crisp. If that would crop too
  // much of the scene, step down and let the water/grass body background fill the letterbox.
  function fit() {
    const vw = innerWidth, vh = innerHeight;
    let s = Math.max(vw / W, vh / H);
    if (s >= 2) {
      s = Math.ceil(s);
      if (vw / s < W * 0.8 || vh / s < H * 0.8) s = Math.floor(Math.max(vw / W, vh / H));
    } else if (vw / s < W * 0.8) s = vw / (W * 0.8);
    if (s * W > vw * 1.25) s = vw * 1.25 / W;
    cv.style.width = Math.round(W * s) + "px";
    cv.style.height = Math.round(H * s) + "px";
  }
  addEventListener("resize", fit); fit();

  /* ================= start ================= */
  draw(0);
  if (!REDUCED) {
    let last = 0;
    const loop = ts => {
      if (ts - last >= 33) { last = ts; draw(ts / 1000); }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
