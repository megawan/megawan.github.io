<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ahoy!</title>
<meta name="description" content="A small sailing game that doubles as my homepage. Steer to an island to see my cloud work, notes and pirate RPG.">
<meta name="theme-color" content="#0a1f26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pirata+One&display=swap" rel="stylesheet">

<style>
  :root {
    --sea: #0f2b33;
    --sea-deep: #0a1f26;
    --paper: #d9c596;
    --ink: #2a1c10;
    --x-red: #b3261e;
    --brass: #d1a94f;
    --foam: #dfe9e4;
    --display: "Pirata One", "Luminari", "Palatino Linotype", Georgia, serif;
    --body: "IM Fell English", "Palatino Linotype", Palatino, Georgia, serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--sea-deep); color: var(--foam);
    font-family: var(--body); font-size: 1.125rem; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--brass); }
  :focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

  #sea {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    image-rendering: crisp-edges; image-rendering: pixelated;
    touch-action: none; background: #164a63;
  }

  /* ---------- shared retro chip look ---------- */
  .chip {
    background: rgba(10, 31, 38, 0.8);
    border: 2px solid var(--brass);
    box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45);
  }
  .btn {
    font-family: var(--display); font-size: 1.2rem; line-height: 1;
    padding: 0.4rem 0.75rem; background: rgba(10, 31, 38, 0.8);
    border: 2px solid var(--brass); box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45);
    color: var(--foam);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .btn:hover, .btn[aria-pressed="true"] { background: var(--brass); color: var(--ink); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.45); }

  /* ---------- HUD ---------- */
  .hud { position: fixed; z-index: 5; transition: opacity 0.5s; }
  body:not(.playing) .hud { opacity: 0; pointer-events: none; }

  .top {
    top: 0; left: 0; right: 0;
    display: flex; justify-content: flex-end; align-items: flex-start; gap: 0.75rem;
    padding: calc(0.75rem + env(safe-area-inset-top, 0px)) 0.75rem 0;
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .top nav { display: flex; flex-wrap: wrap; gap: 0.45rem; justify-content: flex-end; }

  .mini { left: 0.75rem; bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); padding: 3px; line-height: 0; }
  #mini { width: 132px; height: 81px; image-rendering: pixelated; display: block; }

  .status {
    right: 0.75rem; bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem;
  }
  .stats { display: flex; align-items: center; gap: 0.9rem; padding: 0.35rem 0.7rem; font-size: 1.05rem; white-space: nowrap; }
  .wind { display: inline-flex; align-items: center; gap: 0.4rem; }
  #windArrow { display: inline-block; width: 22px; height: 22px; }
  .wanted { color: #ff8a7a; font-family: var(--display); font-size: 1.15rem; }
  .wanted[hidden] { display: none; }
  .hull { display: inline-flex; gap: 2px; align-items: center; }
  .hull i { width: 8px; height: 13px; background: var(--brass); border: 1px solid var(--ink); }
  .hull i.off { background: transparent; border-color: rgba(223, 233, 228, 0.35); }
  #fire { padding: 0.55rem 1.1rem; font-size: 1.35rem; }

  .center-msg {
    left: 50%; transform: translateX(-50%);
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    max-width: min(36rem, calc(100vw - 2rem)); text-align: center;
  }
  .hint { padding: 0.45rem 0.9rem; font-style: italic; font-size: 1.05rem; transition: opacity 1s; }
  .hint.gone { opacity: 0; pointer-events: none; }
  #dock .btn { font-size: 1.5rem; padding: 0.6rem 1.1rem; background: var(--brass); color: var(--ink); }
  #dock .btn:hover { background: #efcf85; }
  #dock[hidden] { display: none; }
  kbd { font-family: var(--body); border: 1px solid currentColor; padding: 0 0.35em; margin-left: 0.4em; font-size: 0.85em; }

  /* island labels and off-screen pointers */
  #labels { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
  .isle-label, .ptr {
    position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform;
    font-family: var(--display); font-size: 1.6rem; line-height: 1; color: #fff;
    text-shadow: 2px 0 0 #000, -2px 0 0 #000, 0 2px 0 #000, 0 -2px 0 #000, 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
  }
  .ptr { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 1.2rem; color: var(--brass); }
  .ptr.ghost { color: #7dffb0; }
  .ptr.ghost .arr { border-left-color: #7dffb0; }
  .ptr.navy { color: #ff8a7a; }
  .ptr.navy .arr { border-left-color: #ff8a7a; }
  .ptr .arr {
    width: 0; height: 0; border-left: 14px solid var(--brass);
    border-top: 8px solid transparent; border-bottom: 8px solid transparent;
    transform: rotate(var(--a, 0rad)); filter: drop-shadow(2px 2px 0 #000);
  }
  body:not(.playing) #labels { opacity: 0; }

  /* toast */
  #toast {
    position: fixed; z-index: 12; left: 50%; top: 4.5rem; transform: translate(-50%, -8px);
    padding: 0.45rem 1rem; font-family: var(--display); font-size: 1.35rem;
    opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- intro ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 15; display: flex; align-items: center;
    padding: clamp(1.5rem, 6vw, 5rem);
    background: linear-gradient(90deg, rgba(6, 16, 20, 0.9) 0%, rgba(6, 16, 20, 0.6) 55%, rgba(6, 16, 20, 0) 100%);
    transition: opacity 0.6s;
  }
  #intro.leaving { opacity: 0; pointer-events: none; }
  #intro[hidden] { display: none; }
  .intro-inner { max-width: 34rem; }
  #intro h1 {
    margin: 0; font-family: var(--display); font-weight: 400;
    font-size: clamp(2.6rem, 6.5vw, 4.6rem); line-height: 1;
  }
  #intro p { margin: 1rem 0 1.6rem; font-size: 1.3rem; font-style: italic; color: rgba(223, 233, 228, 0.85); max-width: 30rem; }
  .intro-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
  #start { font-size: 1.7rem; padding: 0.6rem 1.4rem; background: var(--brass); color: var(--ink); }
  #start:hover { background: #efcf85; }
  #skip { border-color: transparent; background: transparent; box-shadow: none; text-decoration: underline; text-underline-offset: 0.25em; font-family: var(--body); font-size: 1.15rem; padding: 0.4rem 0.5rem; }
  #skip:hover { background: transparent; color: var(--brass); }
  #intro .fine { margin: 1.5rem 0 0; font-size: 1rem; font-style: normal; opacity: 0.7; max-width: 30rem; }
  #intro .fine[hidden] { display: none; }

  /* ---------- island panel ---------- */
  #panel {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 1rem;
    background: rgba(6, 16, 20, 0.62);
  }
  #panel[hidden] { display: none; }
  .scroll {
    position: relative; width: min(36rem, 100%); max-height: calc(100dvh - 2rem); overflow: auto;
    background: linear-gradient(#e2d1a6, #cdb57a); color: var(--ink);
    border: 4px solid #5a3a18; box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.5);
    padding: 1.5rem 1.75rem 1.6rem; animation: unroll 0.28s ease-out;
  }
  @keyframes unroll { from { transform: scaleY(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .scroll h2 { margin: 0 0 0.6rem; font-family: var(--display); font-weight: 400; font-size: 2.6rem; line-height: 1; }
  .scroll p { margin: 0 0 0.9rem; font-size: 1.25rem; line-height: 1.6; }
  .scroll .soon { font-style: italic; opacity: 0.75; }
  .scroll a { color: #7a1d16; }
  .scroll .close {
    margin-top: 0.6rem; background: var(--ink); color: var(--paper); border-color: var(--ink);
    box-shadow: 3px 3px 0 rgba(90, 58, 24, 0.5);
  }
  .scroll .close:hover { background: #7a1d16; border-color: #7a1d16; color: #fff; }

  .scroll .shop { margin-top: 1.4rem; padding-top: 1rem; border-top: 3px double #5a3a18; }
  .scroll .shop h3 { margin: 0 0 0.3rem; font-family: var(--display); font-weight: 400; font-size: 1.8rem; line-height: 1; }
  .scroll .shop ul { list-style: none; margin: 0; padding: 0; }
  .scroll .shop li { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.45rem 0; border-bottom: 1px dashed rgba(90, 58, 24, 0.4); font-size: 1.2rem; }
  .scroll .shop small { font-size: 1rem; opacity: 0.75; }
  .scroll .shop .pips { letter-spacing: 2px; color: #7a1d16; }
  .scroll .shop .maxed { font-style: italic; opacity: 0.7; }
  .scroll .buy { background: var(--ink); color: var(--paper); border-color: var(--ink); box-shadow: 3px 3px 0 rgba(90, 58, 24, 0.5); white-space: nowrap; }
  .scroll .buy:hover:not(:disabled) { background: #7a1d16; border-color: #7a1d16; color: #fff; }
  .scroll .buy:disabled, .scroll .buy:disabled:hover { opacity: 0.4; cursor: not-allowed; box-shadow: none; background: var(--ink); color: var(--paper); }
  .scroll .livery { margin-top: 1.1rem; padding-top: 0.9rem; border-top: 1px dashed rgba(90, 58, 24, 0.4); }
  .scroll .livery h4 { margin: 0 0 0.5rem; font-family: var(--display); font-weight: 400; font-size: 1.5rem; }
  .scroll .swatches { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .scroll .swatch {
    width: 2.5rem; height: 2.5rem; border-radius: 50%; padding: 0; cursor: pointer;
    border: 3px solid rgba(90, 58, 24, 0.5); touch-action: manipulation;
  }
  .scroll .swatch[aria-pressed="true"] { border-color: #7a1d16; box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px #7a1d16; }
  .scroll .lname { margin: 0.55rem 0 0; font-size: 1.1rem; opacity: 0.8; }

  @media (max-width: 40rem) {
    .btn { font-size: 1.05rem; padding: 0.35rem 0.55rem; }
    .center-msg { bottom: calc(6.6rem + env(safe-area-inset-bottom, 0px)); }
    #mini { width: 100px; height: 61px; }
    .stats { font-size: 0.95rem; gap: 0.6rem; flex-wrap: wrap; justify-content: flex-end; }
    #intro { background: linear-gradient(180deg, rgba(6, 16, 20, 0.92) 0%, rgba(6, 16, 20, 0.6) 70%, rgba(6, 16, 20, 0.2) 100%); align-items: flex-start; padding-top: 22vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scroll { animation: none; }
    #toast, .hud, #intro, .hint { transition: none; }
  }
</style>
</head>

<body>
<canvas id="sea" role="img"
        aria-label="A sailing game: a pirate ship on the sea with four islands. The buttons at the top open the same content without sailing."></canvas>
<div id="labels" aria-hidden="true"></div>

<header class="hud top">
  <nav aria-label="Islands">
    <button class="btn" type="button" data-open="home-port">Home Port</button>
    <button class="btn" type="button" data-open="cloud-cove">Cloud Cove</button>
    <button class="btn" type="button" data-open="logbook-bay">Logbook Bay</button>
    <button class="btn" type="button" data-open="treasure-island">Treasure Island</button>
    <button class="btn" type="button" id="night" aria-pressed="false">Night</button>
    <button class="btn" type="button" id="sound" aria-pressed="true">Sound</button>
  </nav>
</header>

<div class="hud chip mini"><canvas id="mini" width="132" height="81" aria-hidden="true"></canvas></div>

<div class="hud status">
  <button class="btn" type="button" id="fire">Fire</button>
  <div class="chip stats">
    <span class="wind" title="Wind direction. Sail with it for speed.">
      <svg id="windArrow" viewBox="-12 -12 24 24" aria-hidden="true"><path d="M-9 0H7M2 -6L9 0L2 6" fill="none" stroke="#d1a94f" stroke-width="2.5" stroke-linecap="square"/></svg>
      <span id="knots">0 kn</span>
    </span>
    <span class="wanted" id="wanted" hidden title="The navy is hunting you.">Wanted</span>
    <span class="hull" id="hull" role="img" aria-label="Hull 5 of 5" title="Hull. Harbors repair it."><i></i><i></i><i></i><i></i><i></i></span>
    <span><span id="loot">0</span> barrels</span>
  </div>
</div>

<div class="hud center-msg">
  <p class="chip hint" id="hint" style="margin:0"></p>
  <div id="dock" hidden><button class="btn" type="button" id="dockBtn">Drop anchor at <span id="dockName"></span><kbd>E</kbd></button></div>
</div>

<div id="toast" class="chip" role="status" aria-live="polite"></div>

<div id="intro">
  <div class="intro-inner">
    <h1>I architect the clouds by day, build worlds by night.</h1>
    <p>This site is a small sailing game. Steer to an island to see what's there.</p>
    <div class="intro-actions">
      <button class="btn" type="button" id="start">Set sail</button>
      <button class="btn" type="button" id="skip">Skip the sailing</button>
    </div>
    <p class="fine" id="visits" hidden></p>
  </div>
</div>

<div id="panel" hidden>
  <div class="scroll" role="dialog" aria-modal="true" aria-label="Island">
    <div id="panelBody"></div>
    <button class="btn close" type="button" id="closePanel">Weigh anchor</button>
  </div>
</div>

<!-- EDIT: the text of each island lives here. Change it freely. -->
<template id="tpl-home-port">
  <h2>Home Port</h2>
  <p>Navigate the seas, find what you're looking for, or just enjoy the voyage.</p>
  <p><a href="https://github.com/megawan">github.com/megawan</a></p>
</template>
<!-- EDIT: shown when a sunken chest is found. n = how many found so far, total = how many exist. -->
<template id="tpl-chest-more">
  <h2>Sunken chest</h2>
  <p>Chest <span data-n></span> of <span data-total></span>. Inside: six barrels and a soggy note that says there are more of these out there.</p>
</template>
<template id="tpl-chest-last">
  <h2>The last chest</h2>
  <p>That's all <span data-total></span>. Six more barrels, and a way to say hello.</p>
  <p><a href="https://github.com/megawan">github.com/megawan</a></p>
  <!-- EDIT: add your email or CV link here, e.g.
       <p><a href="mailto:you@example.com">Email me</a></p> -->
</template>
<template id="tpl-cloud-cove">
  <h2>Cloud Cove</h2>
  <p>Cloud infrastructure and the automation around it. I like building things that other people can pick up and reuse without a guided tour.</p>
  <p><a href="https://github.com/megawan?tab=repositories">Browse my repositories</a></p>
</template>
<template id="tpl-logbook-bay">
  <h2>Logbook Bay</h2>
  <p>Short write-ups of problems I've solved and written so I can find them again later.</p>
  <p class="soon">The first entries are on their way.</p>
  <!-- EDIT: when you have a post, replace the line above with a link, e.g.
       <p><a href="/posts/my-first-post.html">Why my workflow ignored the tag push</a></p> -->
</template>
<template id="tpl-treasure-island">
  <h2>Treasure Island</h2>
  <p>The thing I pour my evenings into: a pirate RPG with open worlds, and still under construction.</p>
  <p class="soon">Not public yet. More soon.</p>
</template>

<noscript>
  <div style="position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#0a1f26;padding:2rem;text-align:center">
    <p>This page is a small sailing game and needs JavaScript.<br>You can find me at <a href="https://github.com/megawan">github.com/megawan</a>.</p>
  </div>
</noscript>

<script>
(() => {
'use strict';

/* =========================================================
   helpers
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;

/* =========================================================
   visit analytics (optional, no cookies)
   ---------------------------------------------------------
   1. Make a free account at https://www.goatcounter.com
   2. Put your site code below, e.g. 'gika' for gika.goatcounter.com
   3. In GoatCounter: Settings > Site > tick "Allow adding visitor counts
      on your website" if you want the visit total shown on the intro screen.
   Leave it empty and nothing is loaded or sent anywhere.
   ========================================================= */
const GOATCOUNTER = '';

const Stats = (() => {
  const code = String(GOATCOUNTER || '').trim().toLowerCase();
  const on = /^[a-z0-9-]+$/.test(code);
  const sent = new Set();
  return {
    on,
    // one event per name per visit, so the numbers mean "visits that did this"
    track(name, title) {
      if (!on || sent.has(name)) return;
      sent.add(name);
      try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: name, title: title || name, event: true }); } catch (_) {}
    },
    init() {
      if (!on) return;
      const s = document.createElement('script');
      s.async = true; s.src = 'https://gc.zgo.at/count.js';
      s.dataset.goatcounter = 'https://' + code + '.goatcounter.com/count';
      document.head.appendChild(s);
      const note = $('#visits'); if (!note) return;
      const base = 'Visits are counted anonymously, without cookies.';
      note.hidden = false; note.textContent = base;
      if (typeof fetch === 'function') {
        fetch('https://' + code + '.goatcounter.com/counter/TOTAL.json')
          .then(r => r.ok ? r.json() : Promise.reject())
          .then(d => { if (d && d.count) note.textContent = base + ' ' + d.count + ' visits so far.'; })
          .catch(() => {});
      }
    },
  };
})();

/* =========================================================
   world
   ========================================================= */
const WORLD_W = 1800, WORLD_H = 1100;
const ISLANDS = [
  { id: 'home-port',     name: 'Home Port',     x: 300,  y: 800, r: 70,  phase: 1.3, seed: 11 },
  { id: 'cloud-cove',    name: 'Cloud Cove',    x: 780,  y: 330, r: 80,  phase: 4.1, seed: 22 },
  { id: 'logbook-bay',   name: 'Logbook Bay',   x: 1020, y: 850, r: 75,  phase: 2.2, seed: 33 },
  { id: 'treasure-island', name: 'Treasure Island', x: 1500, y: 400, r: 105, phase: 5.5, seed: 44 },
];
const byId = Object.fromEntries(ISLANDS.map(i => [i.id, i]));
const landR = (isl, a) => isl.r * (1 + 0.22 * Math.sin(3 * a + isl.phase) + 0.12 * Math.sin(5 * a + isl.phase * 2.1) + 0.06 * Math.sin(9 * a + isl.phase * 0.7));

/* ---------- pixel drawing helpers ---------- */
function disc(c, cx, cy, r, color) {
  c.fillStyle = color;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy + 0.25));
    c.fillRect(Math.round(cx) - w, Math.round(cy) + dy, 2 * w + 1, 1);
  }
}
function palm(c, x, y) {
  c.fillStyle = 'rgba(16,40,26,.38)'; c.fillRect(x - 3, y + 3, 11, 5);
  for (let i = 0; i < 7; i++) {
    const a = i * TAU / 7 + 0.3;
    for (let r = 1; r <= 7; r++) {
      const s = r < 4 ? 2 : 1;
      c.fillStyle = r > 5 ? '#6fbf58' : (i % 2 ? '#3b8a3e' : '#2f7a35');
      c.fillRect(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r), s, s);
    }
  }
  c.fillStyle = '#5fae4e'; c.fillRect(x - 1, y - 1, 3, 3);
  c.fillStyle = '#7a5230'; c.fillRect(x, y, 1, 1);
}
function hut(c, x, y, roofA, roofB) {
  c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(x - 7, y - 4, 20, 15);
  c.fillStyle = '#5b3d22'; c.fillRect(x - 10, y - 9, 20, 15);
  c.fillStyle = roofA; c.fillRect(x - 11, y - 10, 22, 8);
  c.fillStyle = roofB; c.fillRect(x - 11, y - 2, 22, 8);
  c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x - 11, y - 3, 22, 1);
  c.fillStyle = 'rgba(255,255,255,.2)'; c.fillRect(x - 11, y - 10, 22, 1);
}
function lighthouse(c, x, y) {
  c.fillStyle = 'rgba(0,0,0,.22)';
  for (let i = 2; i < 14; i++) c.fillRect(x + i, y + i, 4, 4);
  disc(c, x, y, 8, '#2a1c10'); disc(c, x, y, 7, '#ece5d2'); disc(c, x, y, 5, '#b3342b');
  disc(c, x, y, 3, '#ece5d2'); disc(c, x, y, 2, '#ffd25a');
}

/* ---------- static land layer (islands, shallows, decor) ---------- */
const land = document.createElement('canvas');
land.width = WORLD_W; land.height = WORLD_H;
const lctx = land.getContext('2d');

function buildLand() {
  const img = lctx.createImageData(WORLD_W, WORLD_H);
  const d = img.data;
  const put = (x, y, c) => { const i = (y * WORLD_W + x) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = c[3] === undefined ? 255 : c[3]; };
  for (const isl of ISLANDS) {
    const ext = Math.ceil(isl.r * 1.45 * 1.75);
    const x0 = Math.max(0, isl.x - ext), x1 = Math.min(WORLD_W - 1, isl.x + ext);
    const y0 = Math.max(0, isl.y - ext), y1 = Math.min(WORLD_H - 1, isl.y + ext);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = x - isl.x, dy = y - isl.y;
        const k = Math.hypot(dx, dy) / landR(isl, Math.atan2(dy, dx));
        if (k > 1.7) continue;
        const n = hash2(x, y);
        let c;
        if (k < 0.35)       c = n > 0.6 ? [56, 120, 58] : [47, 107, 52];
        else if (k < 0.62)  c = n > 0.55 ? [86, 152, 72] : [74, 140, 66];
        else if (k < 0.85)  c = n > 0.55 ? [128, 178, 92] : [116, 168, 84];
        else if (k < 0.93)  c = n > 0.5 ? [186, 190, 110] : [170, 180, 100];
        else if (k < 0.98)  c = n > 0.5 ? [238, 220, 158] : [226, 207, 143];
        else if (k < 1.0)   c = [200, 180, 120];
        else if (k < 1.07)  c = [236, 246, 242, 225];
        else if (k < 1.3)   c = n > 0.5 ? [86, 180, 182, 150] : [70, 166, 170, 150];
        else if (n < (1.7 - k) / 0.4) c = [40, 118, 140, 110];
        else continue;
        put(x, y, c);
      }
    }
  }
  lctx.putImageData(img, 0, 0);

  for (const isl of ISLANDS) {
    const rand = rng(isl.seed);
    isl.lights = [];
    const avoid = [];
    const at = (dx, dy) => { avoid.push([isl.x + dx, isl.y + dy]); return [isl.x + dx, isl.y + dy]; };

    if (isl.id === 'home-port') {
      const [lx, ly] = at(-10, -8);  lighthouse(lctx, lx, ly);  isl.beam = { x: lx, y: ly };
      isl.lights.push({ x: lx, y: ly, r: 42, rgb: '255,210,120', a: 0.5 });
      const [hx, hy] = at(16, 16);   hut(lctx, hx, hy, '#8a3b2a', '#a44a35');
      const px = isl.x + Math.round(landR(isl, 0) * 0.9);
      pier(lctx, px, isl.y, 46);
      isl.lights.push({ x: px + 46, y: isl.y, r: 26, rgb: '255,180,90', a: 0.55 });
      avoid.push([px + 20, isl.y]);
    } else if (isl.id === 'cloud-cove') {
      const [hx, hy] = at(-8, 6);    hut(lctx, hx, hy, '#3c6ea8', '#2f5a8c');
      isl.lights.push({ x: hx, y: hy, r: 34, rgb: '150,200,255', a: 0.5 });
      const [dx, dy] = at(14, -12);  dish(lctx, dx, dy);
    } else if (isl.id === 'logbook-bay') {
      const [hx, hy] = at(-12, -6);  hut(lctx, hx, hy, '#6b7a3a', '#56652d');
      isl.lights.push({ x: hx, y: hy, r: 34, rgb: '255,200,110', a: 0.5 });
      const [bx, by] = at(14, 12);   book(lctx, bx, by);
    } else if (isl.id === 'treasure-island') {
      const [cx, cy] = at(0, -16);   chest(lctx, cx, cy);
      isl.lights.push({ x: cx, y: cy, r: 44, rgb: '255,205,80', a: 0.6 });
      const [xx, xy] = at(0, 12);    xMark(lctx, xx, xy, 12);
    }

    let placed = 0, tries = 0;
    while (placed < 9 && tries++ < 200) {
      const a = rand() * TAU, k = 0.25 + rand() * 0.55;
      const px = Math.round(isl.x + Math.cos(a) * landR(isl, a) * k);
      const py = Math.round(isl.y + Math.sin(a) * landR(isl, a) * k);
      if (avoid.some(p => Math.hypot(p[0] - px, p[1] - py) < 24)) continue;
      palm(lctx, px, py); avoid.push([px, py]); placed++;
    }
    for (let i = 0; i < 6; i++) {
      const a = rand() * TAU, k = 1.03 + rand() * 0.12;
      const px = isl.x + Math.cos(a) * landR(isl, a) * k, py = isl.y + Math.sin(a) * landR(isl, a) * k;
      const r = 2 + Math.floor(rand() * 2);
      disc(lctx, px, py, r, '#6d7078'); disc(lctx, px - 1, py - 1, Math.max(1, r - 2), '#9a9da6');
    }
  }
}

/* =========================================================
   sound (synthesised with WebAudio, no files)
   ========================================================= */
const Sfx = (() => {
  let ac = null, master = null, amb = null, noise = null, on = true, lastSplash = 0;
  function ensure() {
    if (ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ac = new AC(); } catch (_) { return false; }
    master = ac.createGain(); master.gain.value = on ? 0.7 : 0; master.connect(ac.destination);
    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    noise = buf;
    const src = ac.createBufferSource(); src.buffer = noise; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 480;
    amb = ac.createGain(); amb.gain.value = 0.04;
    const lfo = ac.createOscillator(), lfoG = ac.createGain();
    lfo.frequency.value = 0.11; lfoG.gain.value = 0.025; lfo.connect(lfoG); lfoG.connect(amb.gain);
    src.connect(lp); lp.connect(amb); amb.connect(master); src.start(); lfo.start();
    return true;
  }
  function burst(dur, freq, type, gain, q, sweepTo) {
    if (!ac || !on) return;
    const t0 = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = noise; s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t0);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + 0.05);
  }
  function tone(f0, f1, dur, type, gain, delay) {
    if (!ac || !on) return;
    const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  return {
    init() { if (ensure() && ac.state === 'suspended') ac.resume(); },
    setOn(v) { on = v; if (master) master.gain.setTargetAtTime(v ? 0.7 : 0, ac.currentTime, 0.05); },
    speed(v) { if (amb) amb.gain.setTargetAtTime(0.03 + 0.06 * v, ac.currentTime, 0.3); },
    cannon(v = 1) { burst(0.35, 900, 'lowpass', 0.5 * v, 0.7, 120); tone(110, 40, 0.3, 'sine', 0.35 * v); },
    splash() { if (!ac || ac.currentTime - lastSplash < 0.07) return; lastSplash = ac.currentTime; burst(0.25, 2500, 'highpass', 0.14, 0.7, 6000); },
    coin() { tone(660, 660, 0.09, 'square', 0.07); tone(990, 990, 0.14, 'square', 0.07, 0.08); },
    thud() { burst(0.3, 500, 'lowpass', 0.5, 0.7, 90); tone(90, 40, 0.28, 'sine', 0.4); },
    sink() { burst(0.9, 900, 'lowpass', 0.5, 0.7, 70); tone(220, 45, 0.9, 'sawtooth', 0.14); },
    rumble() { burst(1.6, 160, 'lowpass', 0.5, 0.7, 60); tone(58, 38, 1.6, 'sine', 0.3); },
    roar() { burst(1.0, 700, 'lowpass', 0.55, 0.7, 90); tone(120, 42, 1.0, 'sawtooth', 0.16); tone(90, 36, 1.1, 'sawtooth', 0.12, 0.05); },
    horn() { tone(196, 196, 0.35, 'sawtooth', 0.06); tone(147, 147, 0.55, 'sawtooth', 0.06, 0.38); },
    eerie() { tone(196, 185, 1.2, 'sine', 0.09); tone(208, 196, 1.2, 'sine', 0.07, 0.05); },
  };
})();

const state = { started: false, docked: null, near: null, night: 0, nightTarget: 0, t: 0, loot: 0, wanted: 0 };

const cam = { x: 0, y: 0 };

const storm = { active: false, level: 0, timer: 55 + Math.random() * 35, dur: 0, total: 0, flashT: 4 + Math.random() * 5, flash: 0 };
const RAIN = []; const RAIN_ANG = 1.15;
function ensureRain() { while (RAIN.length < 130) RAIN.push({ x: Math.random() * 2000, y: Math.random() * 1200, l: 8 + Math.random() * 9, s: 480 + Math.random() * 260 }); }
function updateStorm(dt) {
  if (!state.started || state.docked) return;
  if (!storm.active) {
    storm.timer -= dt;
    if (storm.timer <= 0) {
      storm.active = true; storm.dur = storm.total = 22 + Math.random() * 16;
      toast('A storm rolls in.', 2600); Sfx.rumble(); Stats.track('game/storm-start', 'Storm started');
    }
  } else {
    storm.dur -= dt;
    const rampIn = clamp((storm.total - storm.dur) / 3, 0, 1);
    storm.level = clamp(Math.min(rampIn, storm.dur < 3 ? Math.max(0, storm.dur) / 3 : 1), 0, 1);
    storm.flashT -= dt;
    if (storm.flashT <= 0) { storm.flash = 1; storm.flashT = 3.5 + Math.random() * 6.5; Sfx.rumble(); }
    if (storm.dur <= 0) {
      storm.active = false; storm.level = 0; storm.timer = 75 + Math.random() * 70;
      toast('The storm passes.', 2400); Stats.track('game/storm-end', 'Storm ended');
    }
  }
  storm.flash = Math.max(0, storm.flash - dt * 2.4);
  if (storm.level > 0.01) {
    ensureRain();
    const dx = Math.cos(RAIN_ANG), dy = Math.sin(RAIN_ANG);
    for (const r of RAIN) {
      r.x += dx * r.s * dt; r.y += dy * r.s * dt;
      if (r.y > 1200 || r.x > 2000) { r.y = -20; r.x = Math.random() * 2000; }
    }
    if (state.started && !state.docked) ship.heading += Math.sin(state.t * 3.1 + ship.x * 0.01) * 0.3 * storm.level * dt;
  }
}

}

/* =========================================================

let HULL_MAX = 5;
const ghost = { alive: false, x: 0, y: 0, heading: 0, speed: 0, hp: 3, cd: 2, timer: 18, flash: 0, orbit: 1, chasing: false };
let hull = HULL_MAX, invuln = 0, hullTimer = 0, ghostWarned = false, hitToast = false, speedTick = -1;
const hullEl = $('#hull');
function setHullMax(n) {
  HULL_MAX = n;
  while (hullEl.children.length < n) hullEl.appendChild(document.createElement('i'));
  drawHullHud();
}
function drawHullHud() {
  [...hullEl.children].forEach((el, i) => el.classList.toggle('off', i >= hull));
  hullEl.setAttribute('aria-label', 'Hull ' + hull + ' of ' + HULL_MAX);
}
function spawnGhost() {
  for (let tries = 0; tries < 80; tries++) {
    const x = 120 + Math.random() * (WORLD_W - 240), y = 120 + Math.random() * (WORLD_H - 240);
    if (insideLand(x, y, 70) || Math.hypot(x - ship.x, y - ship.y) < 420) continue;
    ghost.x = x; ghost.y = y; break;
  }
  ghost.alive = true; ghost.hp = 3; ghost.speed = 0; ghost.heading = Math.random() * TAU;
  ghost.cd = 2.5; ghost.orbit = Math.random() < 0.5 ? -1 : 1; ghost.chasing = false; ghost.flash = 0; ghostWarned = false;
}
function hurt(msg) {
  if (invuln > 0 || !state.started || state.docked) return;
  hull--; invuln = 1.4; hullTimer = 0; shake = Math.max(shake, 4);
  for (let i = 0; i < 8; i++) addPart(ship.x, ship.y, (Math.random() - 0.5) * 44, (Math.random() - 0.5) * 44, 0.7, i % 2 ? '#8a5a2b' : '#c9944f', 2, 2);
  Sfx.thud(); drawHullHud();
  if (hull <= 0) { sinkPlayer(); return; }
  if (!hitToast) { hitToast = true; toast(msg || 'Hit! Reach a harbor to repair.', 3200); }
}
function sinkPlayer() {
  splash(ship.x, ship.y, 14); Sfx.sink(); Stats.track('game/player-sunk', 'Player ship sunk');
  toast('You went down. Waking up at Home Port.', 3400);
  const hp = byId['home-port'];
  ship.x = hp.x + Math.round(landR(hp, 0) * 0.9) + 76; ship.y = hp.y; ship.heading = 0; ship.speed = 0;
  hull = HULL_MAX; invuln = 2.5; autopilot = null; drawHullHud();
  cam.x = ship.x - W / 2; cam.y = ship.y - H / 2;
  ghost.alive = false; ghost.timer = 25; respawnHostiles();
}
function hitGhost() {
  ghost.hp--; ghost.flash = 0.25; Sfx.thud();
  for (let i = 0; i < 6; i++) addPart(ghost.x, ghost.y, (Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40, 0.5, i % 2 ? '#7dffb0' : '#efe3c2', 2, 2);
  if (ghost.hp > 0) return;
  ghost.alive = false; ghost.timer = 25; Sfx.sink(); splash(ghost.x, ghost.y, 16);
  for (let i = 0; i < 12; i++) { const a = Math.random() * TAU, sp = 10 + Math.random() * 35; addPart(ghost.x, ghost.y, Math.cos(a) * sp, Math.sin(a) * sp, 1.1, i % 3 ? '#5d8780' : '#7dffb0', 2, 2); }
  addLoot(3); toast("Ghost ship sunk. +3 barrels. It won't stay down.", 3400); Stats.track('game/ghost-sunk', 'Ghost ship sunk');
}
function fireGhost(a) {
  const gx = Math.cos(a), gy = Math.sin(a);
  balls.push({ x: ghost.x + gx * 8, y: ghost.y + gy * 8, vx: gx * 130, vy: gy * 130, t: 0, life: 1.25, enemy: true });
  for (let i = 0; i < 4; i++) addPart(ghost.x + gx * 8, ghost.y + gy * 8, gx * (10 + i * 5) + (Math.random() - 0.5) * 8, gy * (10 + i * 5) + (Math.random() - 0.5) * 8, 0.5, i < 1 ? '#7dffb0' : '#cfe8df', 2, 2);
  Sfx.cannon(0.55);
}
function updateGhost(dt) {
  if (!ghost.alive) {
    if (state.started && !state.docked) { ghost.timer -= dt; if (ghost.timer <= 0) spawnGhost(); }
    return;
  }
  if (state.docked) return;                                   // frozen while you read
  ghost.flash = Math.max(0, ghost.flash - dt);
  const dx = ship.x - ghost.x, dy = ship.y - ghost.y, dist = Math.hypot(dx, dy) || 1, toP = Math.atan2(dy, dx);
  const chase = state.started && !state.near && dist < 320;    // harbors are safe
  let want, spd;
  if (chase) {
    want = dist < 120 ? toP + ghost.orbit * 1.15 : toP; spd = dist < 120 ? 42 : 58;
    if (!ghostWarned) { ghostWarned = true; toast('A ghost ship has spotted you. Harbors are safe.', 3600); Sfx.eerie(); }
  } else if (state.near && dist < 380) { want = toP + Math.PI; spd = 40; }
  else { want = ghost.heading + Math.sin(state.t * 0.3 + ghost.orbit) * 0.6; spd = 16; }
  ghost.chasing = chase;
  ghost.heading += clamp(angDiff(ghost.heading, want), -1, 1) * 1.6 * dt;
  ghost.speed += (spd - ghost.speed) * Math.min(1, dt * 1.5);
  const fx = Math.cos(ghost.heading), fy = Math.sin(ghost.heading);
  ghost.x += fx * ghost.speed * dt; ghost.y += fy * ghost.speed * dt;
  const M = 60;
  if (ghost.x < M || ghost.x > WORLD_W - M || ghost.y < M || ghost.y > WORLD_H - M) {
    ghost.x = clamp(ghost.x, M, WORLD_W - M); ghost.y = clamp(ghost.y, M, WORLD_H - M);
    ghost.heading += clamp(angDiff(ghost.heading, Math.atan2(WORLD_H / 2 - ghost.y, WORLD_W / 2 - ghost.x)), -1, 1) * 3 * dt;
  }
  for (const isl of ISLANDS) {
    const ix = ghost.x - isl.x, iy = ghost.y - isl.y, d = Math.hypot(ix, iy) || 1;
    const R = landR(isl, Math.atan2(iy, ix)) + 10;
    if (d < R) { ghost.x = isl.x + ix / d * R; ghost.y = isl.y + iy / d * R; ghost.heading += 0.05; }
  }
  ghost.cd -= dt;
  if (chase && dist < 150 && ghost.cd <= 0) {
    for (const side of [-1, 1]) {
      if (Math.abs(angDiff(ghost.heading + side * Math.PI / 2, toP)) < 0.5) {
        const lead = dist / 130;                                   // aim where the player will be
        const aim = Math.atan2(ship.y + Math.sin(ship.heading) * ship.speed * lead - ghost.y, ship.x + Math.cos(ship.heading) * ship.speed * lead - ghost.x);
        fireGhost(aim + (Math.random() - 0.5) * 0.2); ghost.cd = 3.2; break;
      }
    }
  }
  if (dist < 14) {                                             // ramming
    hurt('The ghost ship rammed you. Harbors are safe.');
    ghost.x -= dx / dist * 4; ghost.y -= dy / dist * 4; ship.x += dx / dist * 6; ship.y += dy / dist * 6; ship.speed *= 0.6;
  }
  if (ghost.speed > 8 && Math.random() < dt * 14) addPart(ghost.x - fx * 11, ghost.y - fy * 11, 0, 0, 0.8, '#9ff0cf', 2, 1);
}

const npcs = [];
let navyWarned = false, merchantToast = false;

function seaPoint(minFromShip, pad) {
  for (let tries = 0; tries < 80; tries++) {
    const x = 110 + Math.random() * (WORLD_W - 220), y = 110 + Math.random() * (WORLD_H - 220);
    if (insideLand(x, y, pad) || Math.hypot(x - ship.x, y - ship.y) < minFromShip) continue;

}
function makePtr(text, cls) {

function spawnNpc(n) {

function initNpcs() {

  for (let i = 0; i < 3; i++) { const n = { kind: 'merchant', alive: false, timer: 0 }; npcs.push(n); spawnNpc(n); }

function spawnNavy() { for (const n of npcs) if (n.kind === 'navy') spawnNpc(n); }

// steer around islands instead of scraping along them
function steerAvoid(n, want) {
  for (const isl of ISLANDS) {
    const dx = n.x - isl.x, dy = n.y - isl.y, d = Math.hypot(dx, dy) || 1;
    const R = landR(isl, Math.atan2(dy, dx)) + 60;
    if (d >= R) continue;
    const away = Math.atan2(dy, dx), t1 = away + Math.PI / 2, t2 = away - Math.PI / 2;
    const tang = Math.abs(angDiff(want, t1)) < Math.abs(angDiff(want, t2)) ? t1 : t2;
    const k = clamp((R - d) / 40, 0, 1);
    const vx = Math.cos(want) * (1 - k) + (Math.cos(tang) * 0.6 + Math.cos(away) * 0.4) * k;
    const vy = Math.sin(want) * (1 - k) + (Math.sin(tang) * 0.6 + Math.sin(away) * 0.4) * k;
    want = Math.atan2(vy, vx);
  }
  return want;
}
function npcSteer(n, want, spd, dt, turn) {
  want = steerAvoid(n, want);
  n.heading += clamp(angDiff(n.heading, want), -1, 1) * turn * dt;
  n.speed += (spd - n.speed) * Math.min(1, dt * 1.5);
  n.x += Math.cos(n.heading) * n.speed * dt; n.y += Math.sin(n.heading) * n.speed * dt;
  const M = 70;
  if (n.x < M || n.x > WORLD_W - M || n.y < M || n.y > WORLD_H - M) {
    n.x = clamp(n.x, M, WORLD_W - M); n.y = clamp(n.y, M, WORLD_H - M);
    n.heading += clamp(angDiff(n.heading, Math.atan2(WORLD_H / 2 - n.y, WORLD_W / 2 - n.x)), -1, 1) * 3 * dt;
  }
  for (const isl of ISLANDS) {
    const ix = n.x - isl.x, iy = n.y - isl.y, d = Math.hypot(ix, iy) || 1, R = landR(isl, Math.atan2(iy, ix)) + 10;
    if (d < R) { n.x = isl.x + ix / d * R; n.y = isl.y + iy / d * R; }
  }
}

function hitNpc(n) {
  n.hp--; n.flash = 0.25; Sfx.thud();
  for (let i = 0; i < 6; i++) addPart(n.x, n.y, (Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40, 0.5, i % 2 ? (n.kind === 'navy' ? '#ff9a3c' : '#ffd25a') : '#efe3c2', 2, 2);
  if (n.kind === 'merchant') {
    n.flee = 9; state.wanted = 25;
    if (!merchantToast) { merchantToast = true; toast('You attacked a merchant. The navy is coming.', 3600); Sfx.horn(); }
  }
  if (n.hp > 0) return;
  n.alive = false; n.timer = n.kind === 'navy' ? 40 : 30; Sfx.sink(); splash(n.x, n.y, 16);
  for (let i = 0; i < 12; i++) { const a = Math.random() * TAU, sp = 10 + Math.random() * 35; addPart(n.x, n.y, Math.cos(a) * sp, Math.sin(a) * sp, 1.1, i % 3 ? '#8a5a2b' : '#efe3c2', 2, 2); }

  Stats.track(n.kind === 'navy' ? 'game/navy-sunk' : 'game/merchant-sunk', n.kind === 'navy' ? 'Navy ship sunk' : 'Merchant sunk');
}

function updateMerchant(n, dt) {
  if (n.flee > 0) { n.flee -= dt; npcSteer(n, Math.atan2(n.y - ship.y, n.x - ship.x), 46, dt, 1.8); return; }
  if (!n.wp) {
    const isl = ISLANDS[Math.floor(Math.random() * ISLANDS.length)], a = Math.random() * TAU;
    n.wp = { x: isl.x + Math.cos(a) * (landR(isl, a) + 72), y: isl.y + Math.sin(a) * (landR(isl, a) + 72) };
  }
  if (n.dwell > 0) { n.dwell -= dt; npcSteer(n, n.heading, 0, dt, 0.5); if (n.dwell <= 0) n.wp = null; return; }
  const dx = n.wp.x - n.x, dy = n.wp.y - n.y;
  if (Math.hypot(dx, dy) < 24) { n.dwell = 4 + Math.random() * 3; return; }
  npcSteer(n, Math.atan2(dy, dx), 28, dt, 1.3);
}

function fireNavy(n, aim) {
  const gx = Math.cos(aim), gy = Math.sin(aim);
  balls.push({ x: n.x + gx * 8, y: n.y + gy * 8, vx: gx * 130, vy: gy * 130, t: 0, life: 1.25, enemy: true, tint: '#ff9a3c' });
  for (let i = 0; i < 4; i++) addPart(n.x + gx * 8, n.y + gy * 8, gx * (10 + i * 5) + (Math.random() - 0.5) * 8, gy * (10 + i * 5) + (Math.random() - 0.5) * 8, 0.5, i < 1 ? '#ffb347' : '#cfd6d4', 2, 2);
  Sfx.cannon(0.55);
}
function updateNavy(n, dt) {
  const dx = ship.x - n.x, dy = ship.y - n.y, dist = Math.hypot(dx, dy) || 1, toP = Math.atan2(dy, dx);
  const range = state.wanted > 0 ? 700 : 280;                  // attacking merchants makes the navy look harder
  const chase = state.started && !state.near && dist < range;  // harbors are safe
  n.cd -= dt;
  let want, spd;
  if (chase) {
    want = dist < 130 ? toP + n.orbit * 1.15 : toP; spd = dist < 130 ? 50 : 68;
    if (!navyWarned) { navyWarned = true; toast('A navy ship has spotted you. Harbors are safe.', 3600); Sfx.horn(); }
  } else if (state.near && dist < 380) { want = toP + Math.PI; spd = 44; }
  else {
    if (!n.wp || Math.hypot(n.wp.x - n.x, n.wp.y - n.y) < 40) n.wp = seaPoint(0, 80);
    want = Math.atan2(n.wp.y - n.y, n.wp.x - n.x); spd = 36;
  }
  n.chasing = chase;
  npcSteer(n, want, spd, dt, 1.7);
  if (chase && dist < 160 && n.cd <= 0) {
    for (const side of [-1, 1]) {
      if (Math.abs(angDiff(n.heading + side * Math.PI / 2, toP)) < 0.5) {
        const lead = dist / 130;
        const aim = Math.atan2(ship.y + Math.sin(ship.heading) * ship.speed * lead - n.y, ship.x + Math.cos(ship.heading) * ship.speed * lead - n.x);
        fireNavy(n, aim + (Math.random() - 0.5) * 0.24); fireNavy(n, aim + (Math.random() - 0.5) * 0.24);
        n.cd = 4.2; break;
      }
    }
  }
  if (dist < 14) {
    hurt('A navy ship rammed you. Harbors are safe.');
    n.x -= dx / dist * 4; n.y -= dy / dist * 4; ship.x += dx / dist * 6; ship.y += dy / dist * 6; ship.speed *= 0.6;
  }
}
function updateNpcs(dt) {
  let anyChase = false;
  for (const n of npcs) {
    if (!n.alive) {
      if (n.kind === 'navy' && !state.started) continue;
      if (!state.docked) { n.timer -= dt; if (n.timer <= 0) spawnNpc(n); }
      continue;
    }
    if (state.docked) continue;
    n.flash = Math.max(0, n.flash - dt);
    if (n.kind === 'merchant') updateMerchant(n, dt);
    else { updateNavy(n, dt); if (n.chasing) anyChase = true; }
  }
  if (!anyChase) navyWarned = false;
}
function respawnHostiles() {
  spawnNavy(); state.wanted = 0;
  if (kraken.state !== 'idle') { kraken.state = 'idle'; kraken.timer = 40; kraken.slam = null; }
}

/* ---------- kraken ---------- */
const kraken = { state: 'idle', t: 0, x: 0, y: 0, hp: 12, timer: 9999, slamCd: 2, slam: null, scale: 0, flash: 0 };
function startKraken() {
  for (let tries = 0; tries < 40; tries++) {
    const a = ship.heading + (Math.random() - 0.5) * (tries < 20 ? 1.6 : TAU), d = 105 + Math.random() * 30;
    const x = ship.x + Math.cos(a) * d, y = ship.y + Math.sin(a) * d;
    if (x < 90 || x > WORLD_W - 90 || y < 90 || y > WORLD_H - 90 || insideLand(x, y, 50)) continue;
    kraken.x = x; kraken.y = y; kraken.state = 'warn'; kraken.t = 0; kraken.scale = 0; kraken.slam = null; kraken.flash = 0;
    toast('The water is churning.', 2200); Sfx.rumble(); return;
  }
  kraken.timer = 8;
}
function retreatKraken() { kraken.state = 'down'; kraken.t = 0; kraken.slam = null; }
function hitKraken() {
  const k = kraken;
  k.hp--; k.flash = 0.2; Sfx.thud();
  for (let i = 0; i < 6; i++) addPart(k.x + (Math.random() - 0.5) * 16, k.y + (Math.random() - 0.5) * 16, (Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40, 0.6, i % 2 ? '#7a4a8e' : '#2a1238', 2, 2);
  if (k.hp > 0) return;
  retreatKraken(); Sfx.sink(); splash(k.x, k.y, 20); addLoot(8); Stats.track('game/kraken-driven-off', 'Kraken driven off');
  toast('The kraken sinks back into the deep. +8 barrels.', 3400);
}
function updateKraken(dt) {
  const k = kraken;
  if (state.docked) return;
  if (k.flash > 0) k.flash -= dt;
  if (k.state === 'idle') {
    if (state.started && !state.near) { k.timer -= dt; if (k.timer <= 0) startKraken(); }
    return;
  }
  k.t += dt;
  if (k.state === 'warn') {
    if (Math.random() < dt * 30) addPart(k.x + (Math.random() - 0.5) * 44, k.y + (Math.random() - 0.5) * 36, 0, -10, 0.8, '#dff3f3', 1, 0.5);
    if (k.t > 1.8) {
      k.state = 'up'; k.t = 0; k.hp = 12; k.slamCd = 1.8; k.slam = null; shake = Math.max(shake, 6);
      splash(k.x, k.y, 18); Sfx.roar(); toast('A kraken rises from the deep.', 3000); Stats.track('game/kraken-appeared', 'Kraken appeared');
    }
    return;
  }
  if (k.state === 'down') {
    k.scale = Math.max(0, 1 - k.t / 1.0);
    if (k.t >= 1) { k.state = 'idle'; k.timer = 50 + Math.random() * 45; k.slam = null; }
    return;
  }
  // up
  k.scale = Math.min(1, k.t / 1.2);
  const dx = ship.x - k.x, dy = ship.y - k.y, dist = Math.hypot(dx, dy) || 1;
  if (k.t > 26 || dist > 420 || state.near) { retreatKraken(); return; }
  if (k.scale < 1) return;
  const sp = dist > 60 ? 30 : 8;
  const nx = k.x + dx / dist * sp * dt, ny = k.y + dy / dist * sp * dt;
  if (!insideLand(nx, ny, 26)) { k.x = nx; k.y = ny; }
  k.slamCd -= dt;
  if (!k.slam && k.slamCd <= 0 && dist < 95) {
    k.slam = { x: ship.x + Math.cos(ship.heading) * ship.speed * 0.8, y: ship.y + Math.sin(ship.heading) * ship.speed * 0.8, t: 0 };
    Sfx.rumble();
  }
  if (k.slam) {
    k.slam.t += dt;
    if (k.slam.t >= 0.9) {
      splash(k.slam.x, k.slam.y, 14); Sfx.thud(); shake = Math.max(shake, 5);
      if (Math.hypot(ship.x - k.slam.x, ship.y - k.slam.y) < 18) hurt('The kraken slammed you. Harbors are safe.');
      k.slam = null; k.slamCd = 2.4;
    }
  }
  if (dist < 22) { hurt('The kraken grabbed you.'); ship.x += dx / dist * 8; ship.y += dy / dist * 8; ship.speed *= 0.5; }
}

function sailEff() {
  return clamp((0.35 + 0.65 * (1 + Math.cos(ship.heading - wind.ang)) / 2) * wind.g, 0.2, 1);
}

function update(dt) {
  const t = state.t;
  updateStorm(dt);
  wind.ang = 0.9 + 0.7 * Math.sin(t * 0.045) + 0.35 * Math.sin(t * 0.11 + 1);
  wind.g = (0.9 + 0.1 * Math.sin(t * 0.6)) * (1 + 0.85 * storm.level);
  wind.x = Math.cos(wind.ang); wind.y = Math.sin(wind.ang);

  let steer = 0, throttle = 0, brake = false;
  if (state.started && !state.docked) {
    if (keys.left) steer -= 1; if (keys.right) steer += 1;
    if (keys.up) throttle = 1; if (keys.down) brake = true;
    if (steer || throttle || brake) autopilot = null;
    if (autopilot) {
      const dx = autopilot.x - ship.x, dy = autopilot.y - ship.y, dist = Math.hypot(dx, dy);
      if (dist < 16) autopilot = null;
      else { steer = clamp(angDiff(ship.heading, Math.atan2(dy, dx)) * 3, -1, 1); throttle = clamp(dist / 90, 0.35, 1); }
    }
  } else if (state.docked) {
    brake = true;
  } else {
    ship.heading += Math.sin(t * 0.4) * 0.05 * dt;
  }

  const target = throttle * MAX * sailEff();
  if (brake) ship.speed = Math.max(0, ship.speed - 90 * dt);
  else if (ship.speed < target) ship.speed = Math.min(target, ship.speed + ACC * dt);
  else ship.speed = Math.max(target, ship.speed - DRAG * dt);
  ship.heading += steer * TURN * (0.3 + 0.7 * Math.min(1, ship.speed / 35)) * dt;
  ship.x += Math.cos(ship.heading) * ship.speed * dt;
  ship.y += Math.sin(ship.heading) * ship.speed * dt;

  // world edge
  const M = 40;
  if (ship.x < M || ship.x > WORLD_W - M || ship.y < M || ship.y > WORLD_H - M) {
    ship.x = clamp(ship.x, M, WORLD_W - M); ship.y = clamp(ship.y, M, WORLD_H - M); ship.speed *= 0.92;
    if (t > edgeToast) { edgeToast = t + 5; toast('Here be dragons. Turn back.'); }
  }
  // island collision
  for (const isl of ISLANDS) {
    const dx = ship.x - isl.x, dy = ship.y - isl.y, dist = Math.hypot(dx, dy) || 1;
    const R = landR(isl, Math.atan2(dy, dx)) * 0.98 + 5;
    if (dist < R) {
      ship.x = isl.x + dx / dist * R; ship.y = isl.y + dy / dist * R;
      if (ship.speed > 30) { shake = Math.max(shake, 2); for (let i = 0; i < 6; i++) addPart(ship.x, ship.y, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30, 0.6, '#e2cf8f', 2, 3); }
      ship.speed *= 0.6;
    }
  }

  // wake
  wakeT -= dt;
  if (wakeT <= 0 && ship.speed > 6) {
    wakeT = 0.05;
    const fx = Math.cos(ship.heading), fy = Math.sin(ship.heading);
    for (const side of [-1, 1]) {
      addPart(ship.x - fx * 11 - fy * side * 3, ship.y - fy * 11 + fx * side * 3, -fy * side * 5, fx * side * 5, 0.9, '#e8f6f2', 2, 1.4);
      if (ship.speed > 25) addPart(ship.x + fx * 11 - fy * side * 3, ship.y + fy * 11 + fx * side * 3, -fy * side * 8, fx * side * 8, 0.4, '#f4fbf9', 1, 2);
    }
  }

  // cannonballs
  cooldown = Math.max(0, cooldown - dt);
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i]; b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt;
    let dead = false;
    if (b.enemy) {
      if (Math.hypot(ship.x - b.x, ship.y - b.y) < 8) { hurt('Hit! Harbors are safe.'); splash(b.x, b.y, 5); dead = true; }
    } else {
      for (const br of barrels) if (br.alive && Math.hypot(br.x - b.x, br.y - b.y) < 8) { breakBarrel(br); splash(br.x, br.y, 6); dead = true; break; }
      if (!dead && ghost.alive && Math.hypot(ghost.x - b.x, ghost.y - b.y) < 13) { hitGhost(); dead = true; }
      if (!dead) for (const n of npcs) if (n.alive && Math.hypot(n.x - b.x, n.y - b.y) < 13) { hitNpc(n); dead = true; break; }
      if (!dead && kraken.state === 'up' && kraken.scale >= 0.7 && Math.hypot(kraken.x - b.x, kraken.y - b.y) < 20) { hitKraken(); dead = true; }
    }
    if (!dead && insideLand(b.x, b.y)) { for (let k = 0; k < 5; k++) addPart(b.x, b.y, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30, 0.5, '#e2cf8f', 2, 3); dead = true; }
    if (!dead && b.t >= b.life) { splash(b.x, b.y); dead = true; }
    if (dead) balls.splice(i, 1);
  }
  updateGhost(dt);
  updateNpcs(dt); updateKraken(dt);
  state.wanted = Math.max(0, state.wanted - dt); $('#wanted').hidden = !(state.wanted > 0);
  invuln = Math.max(0, invuln - dt);
  if (hull < HULL_MAX && state.started) { hullTimer += dt; if (hullTimer > 10) { hull++; hullTimer = 7; drawHullHud(); } }
  if (state.started && !state.docked) updateChests();
  const tick = Math.floor(t * 4);
  if (tick !== speedTick) { speedTick = tick; Sfx.speed(ship.speed / MAX); }

  // barrels
  for (const br of barrels) {
    if (!br.alive) { br.respawn -= dt; if (br.respawn <= 0) spawnBarrel(br); continue; }
    const nx = br.x + wind.x * 4 * dt, ny = br.y + wind.y * 4 * dt;
    if (!insideLand(nx, ny, 12) && nx > 20 && nx < WORLD_W - 20 && ny > 20 && ny < WORLD_H - 20) { br.x = nx; br.y = ny; }
    if (state.started && Math.hypot(br.x - ship.x, br.y - ship.y) < 10) { breakBarrel(br); splash(br.x, br.y, 6); }
  }

  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.d) { const f = Math.exp(-p.d * dt); p.vx *= f; p.vy *= f; }
  }
  shake = Math.max(0, shake - dt * 14);
  state.night = lerp(state.night, state.nightTarget, 1 - Math.exp(-2.2 * dt));
  if (Math.abs(state.night - state.nightTarget) < 0.002) state.night = state.nightTarget;

  // camera
  const tx = ship.x + Math.cos(ship.heading) * ship.speed * 0.35 - W / 2;
  const ty = ship.y + Math.sin(ship.heading) * ship.speed * 0.35 - H / 2;
  const f = 1 - Math.exp(-4 * dt);
  cam.x += (tx - cam.x) * f; cam.y += (ty - cam.y) * f;

  // dock prompt + HUD
  state.near = state.started ? nearIsland() : null;
  const showDock = !!state.near && !state.docked;
  $('#dock').hidden = !showDock;
  if (showDock) { $('#dockName').textContent = state.near.name; $('#hint').classList.add('gone'); }
  $('#windArrow').style.transform = `rotate(${wind.ang}rad)`;
  $('#knots').textContent = Math.round(ship.speed / MAX * 12) + ' kn';
}

/* =========================================================
   rendering
   ========================================================= */
const C_DEEP = '#164a63', C_GLINT = '#4f9db3', C_GLINT2 = '#7cc4d0';

function drawOcean(camX, camY, t) {
  ctx.fillStyle = C_DEEP; ctx.fillRect(0, 0, W, H);
  const stepX = 18, stepY = 11;
  const ox = wind.x * t * 5, oy = wind.y * t * 5;
  const gx0 = Math.floor((camX - ox) / stepX) - 1, gx1 = Math.floor((camX - ox + W) / stepX) + 1;
  const gy0 = Math.floor((camY - oy) / stepY) - 1, gy1 = Math.floor((camY - oy + H) / stepY) + 1;
  for (let gy = gy0; gy <= gy1; gy++) {
    for (let gx = gx0; gx <= gx1; gx++) {
      const h = hash2(gx, gy);
      if (h > 0.55) continue;
      const s = reduce ? 0.5 : Math.sin(h * 40 + t * 1.3);
      if (s < 0.1) continue;
      const x = Math.round(gx * stepX + hash2(gx + 91, gy) * stepX + ox - camX);
      const y = Math.round(gy * stepY + hash2(gx, gy + 57) * stepY + oy - camY);
      if (s > 0.7) { ctx.fillStyle = C_GLINT2; ctx.fillRect(x, y, 5, 1); ctx.fillRect(x + 2, y + 1, 4, 1); }
      else { ctx.fillStyle = C_GLINT; ctx.fillRect(x, y, 3, 1); }
    }
  }
}

function drawShip(camX, camY, t) {
  const bob = reduce ? 0 : Math.round(Math.sin(t * 1.6) * 0.8);
  const sx = Math.round(ship.x - camX), sy = Math.round(ship.y - camY) + bob;
  ctx.save(); ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 0.3; ctx.translate(sx + 2, sy + 3); ctx.rotate(ship.heading); ctx.drawImage(shipSprite.shadow, -17, -11);
  ctx.restore();
  ctx.save(); ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = invuln > 0 && Math.floor(t * 12) % 2 === 0 ? 0.35 : 1;
  ctx.translate(sx, sy); ctx.rotate(ship.heading); ctx.drawImage(shipSprite.body, -17, -11);
  ctx.restore();
}

function drawNpcs(camX, camY, t) {
  for (const n of npcs) {
    if (!n.alive) continue;
    const bob = reduce ? 0 : Math.round(Math.sin(t * 1.4 + n.x) * 0.8);
    const sx = Math.round(n.x - camX), sy = Math.round(n.y - camY) + bob;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
    const spr = n.kind === 'navy' ? navySprite : merchSprite;
    ctx.save(); ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = 0.3; ctx.translate(sx + 2, sy + 3); ctx.rotate(n.heading); ctx.drawImage(spr.shadow, -17, -11);
    ctx.restore();
    ctx.save(); ctx.imageSmoothingEnabled = false;
    ctx.translate(sx, sy); ctx.rotate(n.heading);
    ctx.globalAlpha = n.flash > 0 && Math.floor(t * 30) % 2 ? 0.35 : 1;
    ctx.drawImage(spr.body, -17, -11);
    ctx.restore();
    if (n.hp < n.maxHp) { ctx.fillStyle = '#b3261e'; for (let i = 0; i < n.hp; i++) ctx.fillRect(sx - 6 + i * 4, sy - 19, 3, 2); }
  }
}

function drawKraken(camX, camY, t) {
  const k = kraken;
  if (k.state === 'idle') return;
  const x = Math.round(k.x - camX), y = Math.round(k.y - camY);
  if (x < -70 || x > W + 70 || y < -70 || y > H + 70) return;
  if (k.state === 'warn') {                                   // whirlpool: the only warning you get
    const r = 30 - (k.t / 1.8) * 14;
    ctx.globalAlpha = 0.4; disc(ctx, x, y, Math.max(2, Math.round(r * 0.7)), '#06202d'); ctx.globalAlpha = 1;
    for (let i = 0; i < 16; i++) {
      const a = i * TAU / 16 + t * 4, rr = r + Math.sin(i + t * 6) * 2;
      ctx.fillStyle = i % 2 ? '#0c2a3a' : '#dff3f3';
      ctx.fillRect(Math.round(x + Math.cos(a) * rr), Math.round(y + Math.sin(a) * rr * 0.8), 2, 2);
    }
    return;
  }
  const s = k.scale;
  if (k.slam) {                                               // slam telegraph: dodge the ring
    const sx = Math.round(k.slam.x - camX), sy = Math.round(k.slam.y - camY);
    const pulse = Math.floor(t * 12) % 2;
    ctx.fillStyle = pulse ? '#ff4d3a' : '#ffb1a6';
    for (let i = 0; i < 14; i++) { const a = i * TAU / 14 + t * 2; ctx.fillRect(Math.round(sx + Math.cos(a) * 17), Math.round(sy + Math.sin(a) * 17), 2, 2); }
    ctx.fillStyle = 'rgba(255,77,58,.5)';
    for (let i = 1; i < 8; i++) ctx.fillRect(Math.round(x + (sx - x) * i / 8), Math.round(y + (sy - y) * i / 8), 2, 2);
  }
  ctx.globalAlpha = 0.3; disc(ctx, x + 3, y + 5, Math.max(1, Math.round(19 * s)), '#000'); ctx.globalAlpha = 1;
  for (let i = 0; i < 20; i++) {                              // foam ring
    const a = i * TAU / 20 + t * 0.6, rr = (24 + Math.sin(t * 3 + i) * 1.5) * s;
    ctx.fillStyle = '#e6f6f4'; ctx.fillRect(Math.round(x + Math.cos(a) * rr), Math.round(y + Math.sin(a) * rr), 2, 1);
  }
  const N = 7;
  for (let i = 0; i < N; i++) {                               // tentacles
    const base = i * TAU / N + t * 0.25;
    let px = x, py = y;
    for (let j = 1; j <= 10; j++) {
      const frac = j / 10, a = base + Math.sin(t * 2.2 + i * 1.7 + j * 0.5) * 0.55 * frac;
      px += Math.cos(a) * 4.4 * s; py += Math.sin(a) * 4.4 * s;
      const r = Math.max(1, Math.round((5.6 - 3.8 * frac) * s));
      disc(ctx, px, py, r, j % 2 ? '#4a2a5c' : '#583368');
      if (j % 3 === 0 && r > 1) { ctx.fillStyle = '#b58ac9'; ctx.fillRect(Math.round(px), Math.round(py), 1, 1); }
    }
  }
  disc(ctx, x, y, Math.max(1, Math.round(15 * s)), '#3b1f4a');
  disc(ctx, x, y, Math.max(1, Math.round(13 * s)), '#5a2f6e');
  disc(ctx, x - 2, y - 3, Math.max(1, Math.round(7 * s)), '#6d3d84');
  if (s > 0.6) {
    for (const ex of [-5, 5]) { disc(ctx, x + ex, y - 2, 3, '#ffd25a'); ctx.fillStyle = '#2a0d0d'; ctx.fillRect(x + ex, y - 3, 1, 3); }
  }
  if (k.flash > 0 && Math.floor(t * 30) % 2) { ctx.globalAlpha = 0.5; disc(ctx, x, y, Math.round(15 * s), '#ffffff'); ctx.globalAlpha = 1; }
  if (k.state === 'up' && k.hp < 12) { ctx.fillStyle = '#b3261e'; for (let i = 0; i < k.hp; i++) ctx.fillRect(x - 12 + i * 2, y - 24, 1, 2); }
}

function drawGhost(camX, camY, t) {
  if (!ghost.alive) return;
  const bob = reduce ? 0 : Math.round(Math.sin(t * 1.3 + 2) * 0.8);
  const sx = Math.round(ghost.x - camX), sy = Math.round(ghost.y - camY) + bob;
  if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) return;
  ctx.save(); ctx.imageSmoothingEnabled = false;
  ctx.translate(sx, sy); ctx.rotate(ghost.heading);
  ctx.globalAlpha = ghost.flash > 0 && Math.floor(t * 30) % 2 ? 0.3 : 0.9;
  ctx.drawImage(ghostSprite.body, -17, -11);
  ctx.restore();
  ctx.fillStyle = '#b3261e';
  if (ghost.hp < 3) for (let i = 0; i < ghost.hp; i++) ctx.fillRect(sx - 5 + i * 4, sy - 18, 3, 2);
  ctx.globalCompositeOperation = 'lighter'; glow(sx, sy, 34, '110,255,190', 0.16); ctx.globalCompositeOperation = 'source-over';
}

function drawBarrels(camX, camY, t) {
  for (const b of barrels) {
    if (!b.alive) continue;
    const x = Math.round(b.x - camX), y = Math.round(b.y - camY + Math.sin(t * 1.8 + b.ph) * 0.8);
    if (x < -10 || x > W + 10 || y < -10 || y > H + 10) continue;
    ctx.fillStyle = 'rgba(0,20,30,.3)'; ctx.fillRect(x - 3, y + 3, 8, 3);
    disc(ctx, x, y, 4, '#5a3a18'); disc(ctx, x, y, 3, '#9a6a35');
    ctx.fillStyle = '#5a3a18'; ctx.fillRect(x - 3, y - 1, 7, 1); ctx.fillRect(x - 3, y + 1, 7, 1);
    ctx.fillStyle = '#c9944f'; ctx.fillRect(x - 1, y - 3, 2, 1);
  }
}

function drawChests(camX, camY, t) {
  for (const c of CHESTS) {
    if (c.found) continue;
    const d = Math.hypot(ship.x - c.x, ship.y - c.y); if (d > 240) continue;
    const k = 1 - d / 240, x = Math.round(c.x - camX), y = Math.round(c.y - camY);
    for (let i = 0; i < 5; i++) {
      if (Math.sin(t * 3 + i * 2 + c.ph) < 0.2) continue;
      const a = t * 0.7 + i * 1.256 + c.ph, rr = 5 + (i % 3) * 5;
      const px = x + Math.round(Math.cos(a) * rr), py = y + Math.round(Math.sin(a) * rr * 0.6);
      ctx.globalAlpha = 0.25 + 0.6 * k; ctx.fillStyle = i % 2 ? '#ffe9a6' : '#fff6d6';
      ctx.fillRect(px, py, 1, 1);
      if (i % 2) { ctx.fillRect(px - 1, py, 3, 1); ctx.fillRect(px, py - 1, 1, 3); }
    }
    ctx.globalAlpha = 1;
  }
}

function drawParts(camX, camY) {
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x - camX), Math.round(p.y - camY), p.s, p.s);
  }
  ctx.globalAlpha = 1;
}

function drawBalls(camX, camY) {
  for (const b of balls) {
    const x = Math.round(b.x - camX), y = Math.round(b.y - camY);
    const z = Math.sin(Math.PI * b.t / b.life) * 10;
    ctx.fillStyle = 'rgba(0,20,30,.35)'; ctx.fillRect(x, y, 2, 2);
    ctx.fillStyle = b.enemy ? '#12100e' : '#15151a'; ctx.fillRect(x, Math.round(y - z), 2, 2);
    ctx.fillStyle = b.enemy ? (b.tint || '#7dffb0') : '#6b6f78'; ctx.fillRect(x, Math.round(y - z), 1, 1);
  }
}

function drawTarget(camX, camY, t) {
  if (!autopilot) return;
  const x = Math.round(autopilot.x - camX), y = Math.round(autopilot.y - camY);
  const r = 5 + Math.round((Math.sin(t * 6) + 1) * 1.2);
  ctx.fillStyle = '#efe3c2';
  for (let i = 0; i < 8; i++) { const a = i * TAU / 8; ctx.fillRect(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r), 1, 1); }
}

function cloudPos(c, t) {
  const isl = byId['cloud-cove'];
  const a = c.a + t * c.s;
  return { x: isl.x + Math.cos(a) * c.rx, y: isl.y + Math.sin(a) * c.ry };
}
function drawCloudShadows(camX, camY, t) {
  ctx.fillStyle = 'rgba(0,20,30,.18)';
  for (const c of clouds) {
    const p = cloudPos(c, t), x = Math.round(p.x - camX + 12), y = Math.round(p.y - camY + 16);
    for (const [dx, dy, r] of [[0, 0, c.r], [-9, 3, c.r - 2], [9, 3, c.r - 2]]) {
      for (let j = -r; j <= r; j++) { const w = Math.floor(Math.sqrt(r * r - j * j)); ctx.fillRect(x + dx - w, y + dy + j, 2 * w + 1, 1); }
    }
  }
}
function drawClouds(camX, camY, t) {
  for (const c of clouds) {
    const p = cloudPos(c, t), x = Math.round(p.x - camX), y = Math.round(p.y - camY);
    if (x < -40 || x > W + 40 || y < -30 || y > H + 30) continue;
    ctx.globalAlpha = Math.hypot(p.x - ship.x, p.y - ship.y) < 34 ? 0.4 : 0.93;
    disc(ctx, x, y + 2, c.r, '#dbe6ee'); disc(ctx, x - 9, y + 4, c.r - 2, '#dbe6ee'); disc(ctx, x + 9, y + 4, c.r - 2, '#dbe6ee');
    disc(ctx, x - 1, y - 1, c.r - 1, '#f6fafc'); disc(ctx, x + 7, y + 1, c.r - 3, '#f6fafc'); disc(ctx, x - 8, y + 2, c.r - 4, '#f6fafc');
    ctx.globalAlpha = 1;
  }
}

function glow(x, y, r, rgb, a) {
  if (x < -r || x > W + r || y < -r || y > H + r) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function drawNight(camX, camY, t) {
  const n = state.night; if (n < 0.01) return;
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = `rgb(${Math.round(lerp(255, 62, n))},${Math.round(lerp(255, 80, n))},${Math.round(lerp(255, 132, n))})`;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const fx = Math.cos(ship.heading), fy = Math.sin(ship.heading);
  glow(ship.x + fx * 12 - camX, ship.y + fy * 12 - camY, 52, '255,196,110', 0.5 * n);
  if (ghost.alive) glow(ghost.x - camX, ghost.y - camY, 42, '110,255,190', 0.35 * n);
  for (const q of npcs) if (q.alive) glow(q.x - camX, q.y - camY, 26, q.kind === 'navy' ? '190,215,255' : '255,200,110', 0.32 * n);
  if (kraken.state === 'up') glow(kraken.x - camX, kraken.y - camY, 50, '170,90,255', 0.3 * n * kraken.scale);
  for (const isl of ISLANDS) for (const l of isl.lights) {
    const flick = reduce ? 1 : 0.9 + 0.1 * Math.sin(t * 7 + l.x);
    glow(l.x - camX, l.y - camY, l.r, l.rgb, l.a * n * flick);
  }
  const lh = byId['home-port'].beam;
  if (lh) {
    const a = t * 0.8, s = 0.1, L = 280, x = lh.x - camX, y = lh.y - camY;
    const g = ctx.createLinearGradient(x, y, x + Math.cos(a) * L, y + Math.sin(a) * L);
    g.addColorStop(0, `rgba(255,240,180,${0.5 * n})`); g.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a - s) * L, y + Math.sin(a - s) * L);
    ctx.lineTo(x + Math.cos(a + s) * L, y + Math.sin(a + s) * L); ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawFog() {
  const edge = Math.min(ship.x, ship.y, WORLD_W - ship.x, WORLD_H - ship.y);
  if (edge > 150) return;
  ctx.fillStyle = `rgba(6,16,20,${((150 - edge) / 150 * 0.72).toFixed(3)})`;
  ctx.fillRect(0, 0, W, H);
}
function drawStorm() {
  if (storm.level <= 0.01 && storm.flash <= 0.01) return;
  if (storm.level > 0.01) {
    ctx.fillStyle = `rgba(12,20,28,${(0.38 * storm.level).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    const dx = Math.cos(RAIN_ANG), dy = Math.sin(RAIN_ANG);
    ctx.strokeStyle = `rgba(205,228,236,${(0.4 * storm.level).toFixed(3)})`; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const r of RAIN) {
      const x = r.x % W, y = r.y % H;
      ctx.moveTo(x, y); ctx.lineTo(x - dx * r.l, y - dy * r.l);
    }
    ctx.stroke();
  }
  if (storm.flash > 0.01) { ctx.fillStyle = `rgba(230,238,255,${(0.5 * storm.flash).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
}

const mini = $('#mini'), mctx = mini.getContext('2d');
function drawMini() {
  const s = mini.width / WORLD_W;
  mctx.fillStyle = '#0d2a38'; mctx.fillRect(0, 0, mini.width, mini.height);
  for (const isl of ISLANDS) {
    mctx.fillStyle = '#e2cf8f'; mctx.beginPath(); mctx.arc(isl.x * s, isl.y * s, isl.r * 1.05 * s + 1, 0, TAU); mctx.fill();
    mctx.fillStyle = '#5a9a4a'; mctx.beginPath(); mctx.arc(isl.x * s, isl.y * s, isl.r * 0.8 * s + 0.5, 0, TAU); mctx.fill();
  }
  mctx.fillStyle = '#b07a3d';
  for (const b of barrels) if (b.alive) mctx.fillRect(Math.round(b.x * s), Math.round(b.y * s), 1, 1);
  if (ghost.alive) { mctx.fillStyle = '#7dffb0'; mctx.fillRect(Math.round(ghost.x * s) - 1, Math.round(ghost.y * s) - 1, 3, 3); }
  for (const q of npcs) if (q.alive) { mctx.fillStyle = q.kind === 'navy' ? '#ff5a4a' : '#ffd25a'; mctx.fillRect(Math.round(q.x * s) - 1, Math.round(q.y * s) - 1, 2, 2); }
  if (kraken.state === 'up' || kraken.state === 'warn') { mctx.fillStyle = '#b06cff'; mctx.fillRect(Math.round(kraken.x * s) - 2, Math.round(kraken.y * s) - 2, 4, 4); }
  mctx.strokeStyle = 'rgba(223,233,228,.5)'; mctx.lineWidth = 1;
  mctx.strokeRect(Math.round(cam.x * s) + 0.5, Math.round(cam.y * s) + 0.5, Math.round(W * s), Math.round(H * s));
  mctx.fillStyle = '#fff'; mctx.fillRect(Math.round(ship.x * s) - 1, Math.round(ship.y * s) - 1, 3, 3);
  mctx.fillStyle = '#b3261e'; mctx.fillRect(Math.round((ship.x + Math.cos(ship.heading) * 60) * s), Math.round((ship.y + Math.sin(ship.heading) * 60) * s), 1, 1);
}

function render() {
  const t = state.t;
  let camX = Math.round(cam.x), camY = Math.round(cam.y);
  if (shake > 0 && !reduce) { camX += Math.round((Math.random() - 0.5) * shake); camY += Math.round((Math.random() - 0.5) * shake); }
  drawOcean(camX, camY, t);
  ctx.drawImage(land, -camX, -camY);
  drawCloudShadows(camX, camY, t);
  drawBarrels(camX, camY, t);
  drawChests(camX, camY, t);
  drawParts(camX, camY);
  drawTarget(camX, camY, t);
  drawNpcs(camX, camY, t);
  drawGhost(camX, camY, t);
  drawShip(camX, camY, t);
  drawKraken(camX, camY, t);
  drawBalls(camX, camY);
  drawClouds(camX, camY, t);
  drawNight(camX, camY, t);
  drawFog();
  drawStorm();
  updateLabels(camX, camY);
  drawMini();
}

/* =========================================================
   boot
   ========================================================= */
function init() {
  buildLand();
  loadSave(); $('#loot').textContent = state.loot;
  applyLivery(); ghostSprite = makeShip(PAL_GHOST); navySprite = makeShip(PAL_NAVY); merchSprite = makeShip(PAL_MERCH); drawHullHud();
  applyUpgrades(); placeChests();
  for (let i = 0; i < 16; i++) barrels.push(spawnBarrel());
  initNpcs();
  resize();
  cam.x = ship.x - W / 2; cam.y = ship.y - H / 2;
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    state.t += dt; update(dt); render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  $('#start').focus();
  window.__game = { state, ship, cam, ISLANDS, barrels, fire, start, openPanel, toggleNight, keys, ghost, spawnGhost, hurt, hitGhost, npcs, kraken, startKraken, hitKraken, hitNpc, CHESTS, up, UPGRADES, buyUpgrade, addLoot, storm, LIVERIES, cosmetics, selectLivery, wind, get MAX() { return MAX; }, get HULL_MAX() { return HULL_MAX; }, get gunCd() { return gunCd; }, get hull() { return hull; }, get W() { return W; }, get H() { return H; } };
}

Stats.init();
const ready = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
ready.then(init);
})();
</script>
