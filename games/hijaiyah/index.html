<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Belajar Huruf Hijaiyah</title>
<meta name="description" content="Game sederhana untuk anak belajar mengenal dan menghafal 28 huruf hijaiyah, lengkap dengan suara.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff7e6; --ink: #3b2a14; --card: #ffffff; --line: #ecd9b0;
    --accent: #1f9d6b; --accent-d: #167a53; --warm: #f2a33a; --bad: #d9534f;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Baloo 2", system-ui, sans-serif; touch-action: manipulation; }
  .ar { font-family: "Amiri", "Noto Naskh Arabic", "Geeza Pro", serif; direction: rtl; line-height: 2.2; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.6rem; margin: 8px 0 4px; text-align: center; }
  .sub { text-align: center; margin: 0 0 16px; opacity: .8; }
  .btn { font: inherit; font-weight: 700; font-size: 1.15rem; border: 0; border-radius: var(--radius);
    padding: 14px 20px; background: var(--accent); color: #fff; cursor: pointer;
    box-shadow: 0 4px 0 var(--accent-d); min-height: 56px; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-d); }
  .btn.alt { background: var(--warm); box-shadow: 0 4px 0 #c2801f; }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: none; border: 2px solid var(--line); }
  .stack { display: grid; gap: 14px; max-width: 420px; margin: 24px auto; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .bar .btn { padding: 8px 14px; min-height: 44px; font-size: 1rem; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(7, 1fr); } }
  .tile { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 6px 0 8px; text-align: center; cursor: pointer; font: inherit; color: inherit; }
  .tile .ar { font-size: 2.2rem; display: block; }
  .tile small { display: block; font-size: .8rem; opacity: .75; }
  .tile.on { border-color: var(--accent); background: #e8f8f0; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab { flex: 1; font: inherit; font-weight: 700; font-size: 1rem; padding: 8px 4px; min-height: 48px;
    background: var(--card); color: inherit; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; }
  .tab.on { background: var(--accent); border-color: var(--accent-d); color: #fff; }
  .tab .ar { font-size: 1.4rem; display: block; }

  .stage { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 16px; text-align: center; margin-bottom: 14px; }
  .stage .big { font-size: 6rem; }
  .stage .name { font-size: 1.6rem; font-weight: 700; }
  .stage .row { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }

  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt { background: var(--card); border: 3px solid var(--line); border-radius: var(--radius);
    min-height: 130px; padding: 8px 0; font: inherit; font-size: 1.6rem; font-weight: 700; color: inherit; cursor: pointer; }
  .opt .ar { font-size: 3.2rem; display: block; }
  .opt.ok { border-color: var(--accent); background: #e8f8f0; }
  .opt.no { border-color: var(--bad); background: #fdeceb; animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .prog { display: flex; gap: 4px; flex: 1; }
  .prog i { flex: 1; height: 10px; border-radius: 5px; background: var(--line); }
  .prog i.done { background: var(--accent); }
  .stars { display: flex; justify-content: center; gap: 6px; margin: 12px 0; }
  .star { width: 44px; height: 44px; fill: var(--line); }
  .star.on { fill: var(--warm); }
  .note { font-size: .9rem; text-align: center; opacity: .75; margin-top: 10px; }
  .lv { display: flex; justify-content: center; gap: 3px; margin-top: 2px; }
  .lv i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .tile.l1 { background: #fdeceb; } .tile.l2 { background: #fff1d6; }
  .tile.l3 { background: #f1f6d8; } .tile.l4 { background: #dff5e8; border-color: var(--accent); }
  .tile.l1 .lv i:nth-child(-n+1), .tile.l2 .lv i:nth-child(-n+2),
  .tile.l3 .lv i:nth-child(-n+3), .tile.l4 .lv i:nth-child(-n+4) { background: var(--accent); }
  .legend { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; font-size: .85rem; margin: 12px 0; opacity: .85; }
  .summary { text-align: center; font-weight: 700; margin: 8px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="home">
    <h1>Belajar Huruf Hijaiyah</h1>
    <p class="sub">28 huruf, ketuk untuk mendengar suaranya</p>
    <div class="stack">
      <button class="btn" id="goLearn" type="button">Belajar</button>
      <button class="btn alt" id="goHear" type="button">Tebak dari suara</button>
      <button class="btn alt" id="goSee" type="button">Tebak nama huruf</button>
      <button class="btn" id="goHarakat" type="button">Belajar harakat</button>
      <button class="btn alt" id="goHarQuiz" type="button">Tebak harakat</button>
      <button class="btn ghost" id="goProgress" type="button">Peta progres</button>
    </div>
    <p class="note" id="homeSummary"></p>
    <p class="note" id="voiceNote" hidden>Suara tidak bisa diputar di perangkat ini. Coba periksa volume dan mode senyap.</p>
  </section>

  <section id="learn" hidden>
    <div class="bar"><button class="btn ghost" data-home type="button">Kembali</button></div>
    <div class="tabs" id="tabs"></div>
    <div class="stage">
      <div class="big ar" id="lBig">ا</div>
      <div class="name" id="lName">Alif</div>
      <div class="row"><button class="btn" id="lPlay" type="button">Dengar lagi</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="progress" hidden>
    <div class="bar"><button class="btn ghost" data-home type="button">Kembali</button></div>
    <div class="tabs" id="pTabs">
      <button class="tab on" type="button" data-p="0">Huruf</button>
      <button class="tab" type="button" data-p="1">Harakat</button>
    </div>
    <p class="summary" id="pSummary"></p>
    <div class="grid" id="pGrid"></div>
    <div class="legend" aria-hidden="true"><span>Belum dicoba</span><span>Sedang belajar</span><span>Hampir hafal</span><span>Hafal</span></div>
    <div class="stack"><button class="btn ghost" id="reset" type="button">Hapus progres</button></div>
  </section>

  <section id="quiz" hidden>
    <div class="bar">
      <button class="btn ghost" data-home type="button">Kembali</button>
      <div class="prog" id="prog" aria-hidden="true"></div>
    </div>
    <div class="stage" id="qStage">
      <div class="big ar" id="qBig"></div>
      <div class="name" id="qPrompt"></div>
      <div class="row"><button class="btn" id="qPlay" type="button">Dengar lagi</button></div>
    </div>
    <div class="opts" id="opts"></div>
  </section>

  <section id="result" hidden>
    <div class="stage">
      <h1>Hebat!</h1>
      <p class="name" id="rText"></p>
      <div class="stars" id="rStars"></div>
    </div>
    <div class="stack">
      <button class="btn" id="again" type="button">Main lagi</button>
      <button class="btn ghost" data-home type="button">Menu utama</button>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';

  // File names are the fallback order: optional recording first, then speech synthesis.
  const LETTERS = [
    ['ا', 'أَلِف', 'Alif', 'alif'], ['ب', 'باء', 'Ba', 'ba'], ['ت', 'تاء', 'Ta', 'ta'],
    ['ث', 'ثاء', 'Tsa', 'tsa'], ['ج', 'جيم', 'Jim', 'jim'], ['ح', 'حاء', 'Ha', 'ha'],
    ['خ', 'خاء', 'Kho', 'kho'], ['د', 'دال', 'Dal', 'dal'], ['ذ', 'ذال', 'Dzal', 'dzal'],
    ['ر', 'راء', 'Ra', 'ra'], ['ز', 'زاي', 'Zai', 'zai'], ['س', 'سين', 'Sin', 'sin'],
    ['ش', 'شين', 'Syin', 'syin'], ['ص', 'صاد', 'Shad', 'shad'], ['ض', 'ضاد', 'Dhad', 'dhad'],
    ['ط', 'طاء', 'Tho', 'tho'], ['ظ', 'ظاء', 'Zho', 'zho'], ['ع', 'عين', "'Ain", 'ain'],
    ['غ', 'غين', 'Ghain', 'ghain'], ['ف', 'فاء', 'Fa', 'fa'], ['ق', 'قاف', 'Qaf', 'qaf'],
    ['ك', 'كاف', 'Kaf', 'kaf'], ['ل', 'لام', 'Lam', 'lam'], ['م', 'ميم', 'Mim', 'mim'],
    ['ن', 'نون', 'Nun', 'nun'], ['و', 'واو', 'Wau', 'wau'], ['ه', 'هاء', 'Ha (Ha kecil)', 'ha2'],
    ['ي', 'ياء', 'Ya', 'ya']
  ].map((r, i) => ({ ch: r[0], say: r[1], name: r[2], file: String(i + 1).padStart(2, '0') + '-' + r[3] + '.mp3' }));

  // Harakat: 0 = plain letter, then fathah, kasrah, dammah.
  const MARKS = [
    { key: '', mark: '', title: 'Huruf', vowel: '' },
    { key: 'fathah', mark: '\u064E', title: 'Fathah', vowel: 'a' },
    { key: 'kasrah', mark: '\u0650', title: 'Kasrah', vowel: 'i' },
    { key: 'dammah', mark: '\u064F', title: 'Dammah', vowel: 'u' }
  ];
  const SYL = ['', 'b', 't', 'ts', 'j', 'h', 'kh', 'd', 'dz', 'r', 'z', 's', 'sy', 'sh', 'dh', 'th', 'zh',
               "'", 'gh', 'f', 'q', 'k', 'l', 'm', 'n', 'w', 'h', 'y'];
  // The item to display and speak for letter index i under harakat h.
  function form(i, h) {
    const l = LETTERS[i], m = MARKS[h];
    if (h === 0) return l;
    const base = i === 0 ? (h === 2 ? '\u0625' : '\u0623') : l.ch;
    return { ch: base + m.mark, say: base + m.mark, name: SYL[i] + m.vowel, file: l.file.slice(0, 2) + '-' + m.key + '.mp3' };
  }

  const $ = (id) => document.getElementById(id);
  const AUDIO_BASE = 'audio/'; // can point to any folder or URL that serves the same file names
  const sections = ['home', 'learn', 'quiz', 'result', 'progress'].map($);
  function show(id) { sections.forEach((s) => { s.hidden = s.id !== id; }); window.scrollTo(0, 0); }

  // ---- Sound ----
  let ac = null, arVoice = null;
  function audioCtx() {
    if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freqs, dur, type) {
    const c = audioCtx(); if (!c) return;
    freqs.forEach((f, i) => {
      const t0 = c.currentTime + i * dur, o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.18, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur);
    });
  }
  const sfx = { good() { tone([660, 880], 0.12); }, bad() { tone([220], 0.25, 'triangle'); },
                win() { tone([523, 659, 784, 1047], 0.14); } };

  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    arVoice = vs.find((v) => /^ar/i.test(v.lang)) || null;
    $('voiceNote').hidden = !!arVoice;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); }
  else { $('voiceNote').hidden = false; }

  let current = null, token = 0;
  function speak(item) {
    const my = ++token;
    if (current) { current.pause(); current = null; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    const fallback = () => {
      if (my !== token || !('speechSynthesis' in window)) return;
      // A short delay after cancel() avoids dropped utterances in some browsers.
      setTimeout(() => {
        const u = new SpeechSynthesisUtterance(item.say);
        u.lang = 'ar-SA'; if (arVoice) u.voice = arVoice; u.rate = 0.7;
        speechSynthesis.speak(u);
      }, 60);
    };
    const a = new Audio(AUDIO_BASE + item.file);
    current = a;
    a.addEventListener('error', fallback, { once: true });
    const p = a.play();
    if (p && p.catch) p.catch((e) => { if (!a.error && e && e.name === 'NotAllowedError') return; fallback(); });
  }
  // ---- Learn ----
  let learnIdx = 0, learnH = 0;
  function renderLearn() {
    const f = form(learnIdx, learnH);
    $('lBig').textContent = f.ch; $('lName').textContent = f.name;
    [...$('tabs').children].forEach((t, i) => t.classList.toggle('on', i === learnH));
    [...$('grid').children].forEach((t, i) => {
      const g = form(i, learnH);
      t.firstChild.textContent = g.ch; t.lastChild.textContent = g.name;
      t.setAttribute('aria-label', g.name);
      t.classList.toggle('on', i === learnIdx);
    });
  }
  MARKS.forEach((m, h) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab';
    b.innerHTML = '<span class="ar" lang="ar"></span><small></small>';
    b.firstChild.textContent = h === 0 ? 'ب' : 'ب' + m.mark; b.lastChild.textContent = m.title;
    b.addEventListener('click', () => { learnH = h; renderLearn(); speak(form(learnIdx, learnH)); });
    $('tabs').appendChild(b);
  });
  LETTERS.forEach((l, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tile';
    b.innerHTML = '<span class="ar" lang="ar"></span><small></small>';
    b.addEventListener('click', () => { learnIdx = i; renderLearn(); speak(form(i, learnH)); });
    $('grid').appendChild(b);
  });
  $('lPlay').addEventListener('click', () => speak(form(learnIdx, learnH)));

  // ---- Quiz ----
  const ROUNDS = 10;
  let mode = 'hear', order = [], qi = 0, score = 0, wrongThis = false, answer = null, qKind = 'hear';

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  // ---- Progress ----
  // Each entry has a level 0..4: +1 for a first-try answer, -1 for a mistake.
  // Keys: "i" for a letter, "i:h" for a letter with harakat h (1..3).
  const STORE_KEY = 'hijaiyah.progress.v1', MAX_LV = 4;
  let store = {};
  try { store = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { store = {}; }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* private mode */ } }
  function level(key) { return (store[key] && store[key].lv) || 0; }
  function record(key, ok) {
    const e = store[key] || (store[key] = { lv: 0, wrong: 0 });
    e.lv = Math.max(0, Math.min(MAX_LV, e.lv + (ok ? 1 : -1)));
    if (!ok) e.wrong++;
    save();
  }
  function letterLevel(i, h) {
    if (h === 0) return level(String(i));
    return Math.round([1, 2, 3].reduce((a, v) => a + level(i + ':' + v), 0) / 3);
  }
  // Weighted sample without replacement: weaker items are likelier to be chosen.
  function weightedPick(items, weightOf, n) {
    const pool = items.map((it) => ({ it, w: weightOf(it) })), out = [];
    while (out.length < n && pool.length) {
      let r = Math.random() * pool.reduce((a, p) => a + p.w, 0), k = 0;
      for (; k < pool.length - 1; k++) { r -= pool[k].w; if (r <= 0) break; }
      out.push(pool.splice(k, 1)[0].it);
    }
    return out;
  }
  const weightFor = (lv) => 1 + (MAX_LV - lv) * 2;
  function qKey() { return mode === 'harakat' ? order[qi].i + ':' + order[qi].h : String(LETTERS.indexOf(answer)); }

  function startQuiz(m) {
    mode = m; qi = 0; score = 0;
    if (m === 'harakat') {
      // Weak letters come up more often, and each gets the vowel it knows least.
      const letters = weightedPick(LETTERS.map((_, i) => i), (i) => weightFor(letterLevel(i, 1)), ROUNDS);
      order = letters.map((i) => {
        const hs = shuffle([1, 2, 3]).sort((a, b) => level(i + ':' + a) - level(i + ':' + b));
        return { i, h: hs[0] };
      });
    } else {
      order = weightedPick(LETTERS.map((l, i) => i), (i) => weightFor(level(String(i))), ROUNDS).map((i) => LETTERS[i]);
    }
    $('prog').innerHTML = order.map(() => '<i></i>').join('');
    show('quiz'); nextQ();
  }
  function nextQ() {
    wrongThis = false;
    [...$('prog').children].forEach((p, i) => p.classList.toggle('done', i < qi));
    let choices, hear, label;
    if (mode === 'harakat') {
      const q = order[qi];
      answer = form(q.i, q.h);
      qKind = Math.random() < 0.5 ? 'hear' : 'see';
      hear = qKind === 'hear';
      choices = [1, 2, 3].map((h) => form(q.i, h));
      if (!hear) choices = choices.map((c) => ({ ch: c.name, say: c.say, name: c.name, file: c.file, text: true }));
      label = hear ? 'Harakat apa yang kamu dengar?' : 'Bagaimana cara membaca ini?';
    } else {
      answer = order[qi];
      hear = mode === 'hear';
      choices = shuffle([answer].concat(shuffle(LETTERS.filter((l) => l !== answer)).slice(0, 3)));
      label = hear ? 'Huruf apa yang kamu dengar?' : 'Apa nama huruf ini?';
    }
    $('qBig').textContent = hear ? '' : answer.ch;
    $('qBig').hidden = hear;
    $('qPrompt').textContent = label;
    $('qPlay').hidden = !hear;
    $('opts').innerHTML = '';
    $('opts').style.gridTemplateColumns = choices.length === 3 ? 'repeat(3, 1fr)' : '';
    choices.forEach((c) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt';
      if (hear) { b.innerHTML = '<span class="ar" lang="ar"></span>'; b.firstChild.textContent = c.ch; b.setAttribute('aria-label', c.name); }
      else { b.textContent = c.name; }
      b.addEventListener('click', () => pick(b, c));
      $('opts').appendChild(b);
    });
    if (hear) speak(answer);
  }
  function pick(btn, c) {
    if (btn.classList.contains('ok')) return;
    if (c.name === answer.name && c.say === answer.say) {
      btn.classList.add('ok'); sfx.good();
      if (!wrongThis) { score++; record(qKey(), true); }
      if (qKind === 'see' || mode === 'see') speak(answer);
      qi++;
      setTimeout(() => (qi < order.length ? nextQ() : finish()), 900);
    } else {
      if (!wrongThis) record(qKey(), false);
      wrongThis = true; btn.classList.add('no'); sfx.bad();
      setTimeout(() => btn.classList.remove('no'), 400);
    }
  }
  function finish() {
    const n = score >= 9 ? 3 : score >= 6 ? 2 : 1;
    $('rText').textContent = 'Benar langsung: ' + score + ' dari ' + order.length;
    $('rStars').innerHTML = [1, 2, 3].map((i) =>
      '<svg class="star' + (i <= n ? ' on' : '') + '" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z"/></svg>').join('');
    sfx.win(); show('result');
  }
  $('qPlay').addEventListener('click', () => speak(answer));
  $('again').addEventListener('click', () => startQuiz(mode));

  // ---- Progress map ----
  let pH = 0;
  function renderProgress() {
    const grid = $('pGrid');
    if (!grid.children.length) {
      LETTERS.forEach((l) => {
        const t = document.createElement('div');
        t.className = 'tile';
        t.innerHTML = '<span class="ar" lang="ar"></span><div class="lv"><i></i><i></i><i></i><i></i></div>';
        grid.appendChild(t);
      });
    }
    let done = 0;
    [...grid.children].forEach((t, i) => {
      const lv = letterLevel(i, pH ? 1 : 0);
      if (lv === MAX_LV) done++;
      t.className = 'tile' + (lv ? ' l' + lv : '');
      t.firstChild.textContent = pH ? form(i, 1).ch : LETTERS[i].ch;
      t.setAttribute('aria-label', LETTERS[i].name + ', tingkat ' + lv + ' dari ' + MAX_LV);
    });
    $('pSummary').textContent = 'Hafal: ' + done + ' dari 28 huruf';
    [...$('pTabs').children].forEach((b, i) => b.classList.toggle('on', i === pH));
  }
  // Harakat level is the average of the three vowels, so the grid shows fathah as the sample glyph.
  $('pTabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    pH = Number(b.dataset.p); renderProgress();
  });
  $('reset').addEventListener('click', () => {
    if (window.confirm('Hapus semua progres belajar?')) { store = {}; save(); renderProgress(); homeSummary(); }
  });
  function homeSummary() {
    const n = LETTERS.filter((_, i) => level(String(i)) === MAX_LV).length;
    $('homeSummary').textContent = n ? 'Huruf yang sudah hafal: ' + n + ' dari 28' : '';
  }
  homeSummary();

  // ---- Navigation ----
  $('goProgress').addEventListener('click', () => { pH = 0; renderProgress(); show('progress'); });
  $('goLearn').addEventListener('click', () => { audioCtx(); learnH = 0; show('learn'); renderLearn(); });
  $('goHarakat').addEventListener('click', () => { audioCtx(); learnH = 1; show('learn'); renderLearn(); });
  $('goHarQuiz').addEventListener('click', () => { audioCtx(); startQuiz('harakat'); });
  $('goHear').addEventListener('click', () => { audioCtx(); startQuiz('hear'); });
  $('goSee').addEventListener('click', () => { audioCtx(); startQuiz('see'); });
  document.querySelectorAll('[data-home]').forEach((b) => b.addEventListener('click', () => {
    if ('speechSynthesis' in window) speechSynthesis.cancel(); homeSummary(); show('home');
  }));
})();
</script>
</body>
